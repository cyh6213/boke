<head>
    <meta charset="UTF-8" />

    <title>实习经历 | 程愚瀚</title>
    <link rel="stylesheet" href="../资源/css/style.css" />
    <style>
        .internship-list {
            width: min(1040px, calc(100% - 48px));
            margin: 0 auto;
            padding: 112px 0 88px;
        }
        .list-head {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: end;
            gap: 24px;
            padding-bottom: 30px;
            border-bottom: 1px solid #dfe5ec;
        }
        .list-head h1 {
            margin: 6px 0 10px;
            color: #0f172a;
            font-size: 38px;
            line-height: 1.2;
            letter-spacing: 0;
        }
        .list-head p {
            max-width: 680px;
            color: #64748b;
            font-size: 15px;
        }
        .record-count {
            color: #475569;
            font-size: 13px;
            white-space: nowrap;
        }
        .internship-item {
            display: grid;
            grid-template-columns: 190px minmax(0, 1fr) 72px;
            gap: 28px;
            align-items: start;
            padding: 34px 4px;
            border-bottom: 1px solid #dfe5ec;
            color: inherit;
            text-decoration: none;
            transition: border-color 0.2s, background 0.2s;
        }
        .internship-item:hover {
            border-color: #8b5cf6;
            background: #ffffff;
        }
        .company {
            color: #0f172a;
            font-size: 17px;
            font-weight: 750;
        }
        .company-meta {
            margin-top: 7px;
            color: #64748b;
            font-size: 12px;
            line-height: 1.7;
        }
        .role-label {
            color: #7c3aed;
            font-size: 12px;
            font-weight: 700;
        }
        .internship-item h2 {
            margin: 5px 0 10px;
            color: #0f172a;
            font-size: 22px;
            line-height: 1.35;
            letter-spacing: 0;
        }
        .internship-item p {
            max-width: 670px;
            color: #475569;
            font-size: 14px;
            line-height: 1.8;
        }
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-top: 15px;
        }
        .tags span {
            padding: 4px 9px;
            border: 1px solid #dbe2ea;
            border-radius: 4px;
            color: #475569;
            background: #f8fafc;
            font-size: 11px;
        }
        .item-arrow {
            padding-top: 24px;
            color: #7c3aed;
            font-size: 13px;
            font-weight: 700;
            text-align: right;
        }
        @media (max-width: 720px) {
            .internship-list { width: min(100% - 32px, 1040px); padding-top: 92px; }
            .list-head { grid-template-columns: 1fr; gap: 8px; }
            .list-head h1 { font-size: 30px; }
            .internship-item { grid-template-columns: 1fr; gap: 14px; }
            .item-arrow { padding-top: 0; text-align: left; }
        }
    </style>
</head>

                </div>
