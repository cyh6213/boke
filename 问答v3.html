        /* 项目标题（最外层） */

            padding: 12px 20px;

            gap: 10px;

        /* 一级按钮（父节点，可点击显示答案） */

        .qa-nav .nav-btn.level-1:hover {

        /* 二级按钮（子节点） */

            background: #6D28D9;

        }
        
        /* 三级按钮 */
        .qa-nav .nav-btn.level-3 {
            padding-left: 50px;
            font-size: 12px;
            font-weight: 500;
            color: #7c3aed;
            background: #f8f7ff;
            border: 1px solid #ece8ff;

        .qa-content {
            position: relative;

        .qa-content .content-header {

        .qa-content .content-header .category-tag {

        /* ===== 微型目录（导航栏右侧，纵向排列，向下延伸） ===== */

        /* ===== 问答正文图片 ===== */

        .qa-content .qa-block .qa-body pre { margin: 12px 0; padding: 12px 14px; overflow-x: auto; border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc; }
        .qa-content .qa-block .qa-body pre code { display: block !important; padding: 0 !important; background: transparent; white-space: pre; }

    <script>
        // ===== 问答数据（严格按照自我介绍页面的提示词内容）=====
        var qaData = {
          hero: { label: "自我介绍", items: [{"id":"qa-1","title":"自我介绍","content":"<p>面试官您好，我是程愚瀚，电子科技大学软件工程专业 28 届本科生。<br>我觉得agent方向的内容主要分为了两个方面，一个是agent开发，包括agent runtime，harness的底层设计，比如上下文机制，工具调用，异常处理等；另一方面是agent应用，也就是具体到了一个实际场景，我们应该怎么样驱动Agent帮我们完成这个任务？</p><p>我的项目和实习经历就分别对应了这两方面。</p><p>我项目对应的就是 Agent 开发，这个项目是一个多agent的调度系统，对标的是 Claude Code 的一个叫 Dynamic Workflow 的项目。<br>这个项目想要解决什么问题？以及我做了什么？简历上写的其实蛮清楚的，我举个例子，就包括我实习当中做的这个广告审核 Workflow 自迭代 Agent，就是基于我的这个 Graph Harness 项目上搭起的工作流。<br>正常情况下，我们希望 Agent 帮我们完成一项任务，通常会编写一个 Skill。但是 Skill 本质上还是一种软约束，当这个任务它的执行链路比较长的时候，Agent 就容易跳步遗漏，然后任务没有真正完成却他自己认为已经完成了，或者说因为上下文太长而忘记了最初的目标的这些问题。<br>所以我做的想法呢，就是把这些步骤落成了一个可执行的脚本，通过系统实现确定性的任务调度，而这个 Agent 就只需要完成一个节点内部的任务就 OK 了，这个就是我项目实现的基本逻辑。<br>在这个基础上，我又围绕他在任务执行的稳定性上做了一些补充：比如</p><ol><li>通过 Trace 记录完整的执行链路，方便定位问题</li><li>通过 Checkpoint 机制和异常治理机制来处理异常</li><li>增加自动 Plan 的能力，降低人工编写脚本的成本</li></ol><p>然后接着说我的实习内容，对应的就<strong>是agent</strong>应用方向。<br>背景是，我们在维护一个机审审核平台，就是利用模型去做审核，这个平台就类似于扣子这种workflow搭建平台，运营的同学就是用这个平台去搭一些审核 Workflow。<br>而我们正在做的事情就是一个平台agent，我们希望赋予这个agent一些能力，让运营同学更方便的使用这个平台。<br>我是从广告这个类型的审核入手，针对他们搭建的workflow的两个问题，一个是误杀率高，另外一个是人工维护它的成本高，设计了这个迭代agent。<br>它的实现目标就是能够精确识别出这些误杀 Case 的原因，来帮助我们自动进行 Workflow 的迭代。<br>而这个 Agent 有两个技术难点，一方面是需要提高审核准确率。但好消息是，相较于 Workflow，它拥有更多资源：可以使用更好的模型、调用更多次数的模型，以及提供更多信息。另外一个带解决的问题是，需要让他能够识别出 Workflow 的问题在哪里，怎么修改，修改完了，怎么判断他自己的修改是正向的。<br>最后成果是：经这个agent优化一周之后的线上 Workflow 的误杀率从 5% 降到了 2%，处理单个 Workflow 的人工优化时间由 1 个小时降成了这个Agent帮我完成大部分的事情，我只需要最后人工确认的 5 分钟。</p><p>这两段经历让我对 Agent 有了两个角度的理解：一方面是怎么让它跑得稳，另一方面是到了实际业务里，需要考虑的远不止技术是不是够足够的 fancy，而是真正从实际出发，需要考虑到成本等一系列地问题，回归到它有没有真正解决问题上。<br>以上就是我的自我介绍，谢谢。</p>"}] },
          skillPractice: { label: "Skill 调度实践", items: [{"id":"qa-2","title":"简单介绍一下这个 Skill 的确定性调度是怎么做的","content":"<p><strong>最开始，我是通过 Prompt 和 SOP 来约束主控 Agent</strong>，告诉它整个任务有哪些步骤，以及每一步应该调用哪个子 Agent。</p><p><strong>但我后来发现，这种方式其实不太可靠</strong>。因为 Prompt 只是把流程告诉了 Agent，并不能真正限制它的行为。流程一长，它还是可能跳过某一步、遗漏某个任务，或者在任务没有真正完成的时候，自己判断流程已经结束了。</p><p>所以我当时就在想，在没有办法直接接入我个人项目的情况下，能不能只通过一个 Skill，实现类似的确定性调度。</p><p><strong>于是我就给这个skill写了一个脚本</strong>，就相当于简化版的GrphHarness。</p>"},{"id":"qa-3","title":"这个 Python 脚本的运行机制是什么？","content":"<p><strong>这个 Python 脚本本质上是一个状态机</strong>，Agent 会通过几个固定命令和它交互。</p><p><strong>首先，任务开始的时候</strong>，Agent会根据skill的指导生成当前任务的 <code>workflow.json</code> ，接着他需要会调用脚本的 <code>init</code> 命令，并把这个 <code>workflow.json</code> 传给它。这个 JSON 里面定义了任务有哪些节点、节点之间怎么连接、有哪些条件分支，以及哪个节点是起点和终点。</p><p><code>init</code> 命令会读取这份 workflow，然后初始化一个 <code>todo-list.json</code>。这个文件相当于当前任务的运行状态，记录每个节点现在是待执行、执行中、已经完成，还是处于阻塞状态。这个初始化操作是幂等的，如果任务之前已经执行过，就不会把原来的进度直接覆盖掉。</p><p><strong>初始化完成之后</strong>，Agent 会调用脚本的 <code>next</code> 命令。脚本会读取 <code>todo-list.json</code>，再根据 workflow 里面定义的节点关系和依赖，计算当前有哪些节点已经满足条件，可以开始执行，然后把下一步任务返回给 Agent。</p><p>Agent 拿到节点之后，就按照 Skill 里面对应的 Action 文档去执行具体任务。执行完成以后，它会调用 <code>set-status</code> 命令，把这个节点更新成 <code>done</code>，同时把这一步的执行结果和 evidence 写回状态文件。</p><p>如果当前节点后面存在条件分支，Agent 在调用 <code>set-status</code> 的时候，还需要通过 <code>--next-action</code> 明确告诉脚本这一次选择了哪条分支。然后 Agent 再调用一次 <code>next</code>，脚本重新计算下一步可以执行的节点。</p><p><strong>这里的确定性主要体现在</strong>，Agent 不能完全凭自己的判断决定下一步做什么。它每完成一个节点，都必须重新调用 <code>next</code>，由脚本根据预先定义的工作流、节点依赖和当前状态，计算出下一步允许执行的任务。Agent 负责具体执行，而脚本负责流程推进。</p>"},{"id":"qa-4","title":"和项目的区别","content":"<p><strong>这个 Skill 可以看作我项目的 Light 版本</strong>。Skill 里虽然有 Python 脚本计算下一步，但调用 <code>init</code>、<code>next</code>、<code>set-status</code> 仍然依赖 Agent 主动完成，所以它只能约束 Agent，不能完全接管 Agent。我的项目里则是 Orchestrator 直接掌握流程控制权，Agent 只负责执行具体节点。</p><p><strong>在此基础上</strong>，项目还要包括上下文产物管理、Checkpoint、分层异常恢复、Trace记录等机制来保证流程的稳定运行。</p>"}] },
          gh: { label: "GraphHarness", items: [{"id":"qa-5","title":"项目介绍","content":"","children":[{"id":"qa-6","title":"项目介绍","content":"<p>自我介绍我已经说过项目目标了，然后我在简单介绍一下这个项目的harness系统和功能实现</p><p><strong>在架构上：</strong></p><p>我将系统拆成了三层：Planner 负责生成版本化 DAG；Orchestrator 负责校验 DAG，维护节点依赖和 <code>ready queue</code>，并行调度满足条件的节点；Agent Runtime 只负责节点内的 ReAct 和工具调用。<br>Harness 则是承载这三层的完整运行环境，统一提供上下文、Workspace、Checkpoint、异常治理、HITL 和 Trace。<br><strong>这个设计主要带来三点价值：</strong>第一，把模型的不确定推理与系统的确定性控制解耦；第二，统一并行、重试、恢复等执行语义；第三，模型、规划策略和执行引擎可以独立替换和测试。</p><p><strong>在功能实现上：</strong></p><p><strong>从</strong>长链路任务怎么跑得完、跑得稳<strong>的角度来看</strong>：<br>为了避免 Skill 描述的任务完全依赖 Agent 自己理解和推进，我设计了规划和执行解耦的架构<br>在此基础上，我还设计了多 Agent 协作模式、上下文与产物组织机制、节点级 Checkpoint、三级异常治理、审查 Loop 和人机交互机制，共同保证任务执行时不跳步、出现异常后可恢复，并且能够对最终结果进行验收。</p><p><strong>从</strong> <strong>Agent</strong> 编排<strong>基建的角度</strong>来看：设计了五级 Trace，方便测试和异常处理</p><p><strong>从优化的角度</strong>来<strong>看：</strong>针对执行效率做了双层并行；针对 Plan 能力优化了 DAG 构建正确率；针对上下文传递和工具管理优化了 Token 用量。</p><p><strong>其中，还有一些功能在计划当中，</strong>比如toolhub工具智能化管理（计划通过Trace调用工具记录，来给planagent提供更多信息来选择tool）、Trace记录实现了，但是还在思考Trace的可视化怎么做，让用户可以更方便对异常溯源；多LLM模型调用（审查agent，planAgent）也暂时还未实现；上下文传递智能化，目前的上下文主要想要实现的目标是在减少工具调用等无关信息的传递，同时尽量传递够用的信息，但是没有根据任务类型的不同，来动态的选择传递信息的量（查天气 vs 复杂任务）</p>"},{"id":"qa-7","title":"为什么项目叫 GraphHarness？","content":"<p>这个名字由 <strong>Graph</strong> 和 <strong>Harness</strong> 两部分组成。</p><p><strong>Graph</strong> <strong>来自</strong> <strong>Graph</strong> <strong>Engineering</strong>。它不是把所有任务塞进一个 Agent Loop，而是把多个 Agent、工具、审查机制和人工决策点组织成显式的 DAG，由系统根据依赖关系自动推进。加入 HITG 后，就形成了“系统管流程、Agent 管执行、人管关键决策”的协作方式。</p><p><strong>Harness</strong> <strong>不止是确定性调度</strong>，而是让这张图可靠运行的完整工程环境。它负责 DAG 校验、依赖解析、并行调度、上下文组装、Checkpoint、异常恢复、HITL 和 Trace，把模型的不确定推理与系统的确定性控制解耦。</p><p>所以可以概括为：<strong>Graph 定义人和 Agent 如何协作，Harness 保证这套协作能够稳定、可控地运行。</strong></p>"},{"id":"qa-8","title":"随着模型能力不断提升，Harness 和 DAG 会不会逐渐失去意义","content":"<p>我的理解是，Harness 和 DAG 在我的项目中不止一个作用，它有两个作用：</p><ol><li>引导模型下一个任务是什么</li></ol><ol><li>约束模型下一步任务只能是这个</li></ol><p>我觉得随着模型能力提升，它压缩的是“引导模型下一个任务是什么”这部分。这个时候模型不再需要我们提前帮它想好下一个任务需要指什么、执行什么了，模型可以自己想出来更好的执行方向。</p><p>但是在一些特殊场景，我们还是有确定性调度的需求，也就是我说的第二个作用，它是一种约束，保证关键的流程是按照我们想要的去执行。这种约束可能就会成为它未来主要的作用。</p><p>所以<strong>的判断是</strong>：<strong>模型能力的提升会压缩 Harness 的范围，但不会消除对确定性调度的需求。</strong></p>"}],"hasChildren":true},{"id":"qa-9","title":"Planner–Orchestrator–Agent Runtime 分层架构","content":"","children":[{"id":"qa-10","title":"Workflow 和 Agent 的抉择","content":"<p>首先，<strong>区别</strong>非常明显：Workflow 是固定的流水线，它的步骤和分支都是提前定好的，不能够随便修改；而 Agent（包括 ReAct 还有 Plan and Execute）可以在执行过程中灵活地选择工具和调整路径。</p><p>所以在<strong>使用上</strong>，怎么选择呢？</p><ol><li>任务是不是固定流程。这是最清楚的区分点，决定了什么时候使用 Workflow，什么时候使用 Agent。</li><li>Workflow 的 flow 需要预先定义，这本身就是一种投入（花销），所以我们肯定要有所得。因此，只有在非常频繁使用的任务，或者比较复杂的任务中，我们才会使用 Workflow；而一般简单任务，直接交给 Agent 就能完成。</li><li>Workflow 非常适用于涉及安全、比较敏感的场景。比如订单的下单流程，或者我实习中的审核场景。这种场景下，我们不可能把所有权限都交给 Agent 去完成，所以 Workflow 就非常适合。</li><li>然后还有第四点，也是我在实习中悟出来的：如果我们想要将一个完整的审核任务交给一个 Agent 来完成，它需要花费大量时间在流程抉择上。而我们的审核任务量非常大，这会造成非常多的 Token 消耗，这是第一方面。第二方面，如果我们使用 Workflow，就可以将这个大的审核任务拆分成很多小点。这样我们就可以使用更便宜的 Agent 来完成这些更简单的任务，也能省很多钱。</li></ol>"},{"id":"qa-11","title":"多 Agent 、单agent的抉择","content":"<strong>什么时候该拆？</strong> 核心依据是职责分离。当一个 Agent 的 prompt 太长、工具太多、频繁切换上下文，就该拆。比如一个 Agent 既要写代码又要做 code review，两套逻辑混在一起容易搞混，拆成\"写代码 Agent\"和\"审查 Agent\"，每个 prompt 更短、工具更少、任务更聚焦。另一个依据是并行需求，两个任务没依赖，拆成两个 Agent 并行跑比串行快。<strong>（上下文、职责、并发）</strong><br><br><strong>什么情况下不该拆？</strong> 核心成本是上下文隔离。拆开后只能通过结构化数据传递信息，不能共享上下文，就会造成信息丢失——第二个 Agent 只看到结果，看不到中间推理过程。如果两个任务需要频繁信息交换，或者第二个要基于第一个的中间推理来判断，拆开反而降质量。另一个情况是任务太简单，几句话能说清的任务拆成两个 Agent 反而增加调度开销。<br><br><strong>边界：</strong> 拆与不拆就是\"职责清晰度\"和\"上下文共享度\"之间的取舍。"}],"hasChildren":true},{"id":"qa-12","title":"Agent 全链路可观测","content":"","children":[{"id":"qa-13","title":"设计","content":"<p>我的trace设计主要就是想要解决异常观测的问题。<br>所以首先我是针对工具调用重试、节点重试的问题，设计了六级的Trace记录机制（ Run → Node → NodeAttempt → Round → ToolCall → ToolAttempt），这样我就能够看到系统想要完成什么，以及他为了完成这个任务尝试了几次，就能够分析更底层的重试、错误情况。</p><p>其次呢，我为了让这六级的Trace记录可以串联起来，设计了span_id 和 parent_span_id ，接能够让我们更清楚的观测到布层层级之间的联系，而不是一堆散落的记录。</p><p>第三点，我们已经记录清楚了Agent的执行流程，但是我还是觉得对于异常的过程不够方便，于是我增加了 异常id，用同一个 ID 关联这次问题涉及的多层级的trace记录，就能够让我看到这个问题从发生到最终处置的过程。<br>举个例子，比如在工具调用层级，发生了失败，这个时候这个异常id就会被加到工具调用这个层级的trace记录中，而随着工具一直调用不成功，异常就会被上抛到节点层级，于是这个异常id将节点层级的Trace也回串连了起来。</p><p>这一套机制就一方面是清晰的记录了任务执行的过程，另一方面是针对异常的观察做了多方优化，让我们能够更清楚的看见异常的处理流程，还让任务即使成功执行，也能够让我们看见哪里出现了异常，及时处理。</p>"},{"id":"qa-14","title":"异常排查","content":"<p><strong>第一条是</strong>：前面我们说我设计了六层的Trace记录方案，是靠parent-span-id联系起来的，所以就形成了类似树形的结构，我们就可以通过span-id下钻，找到问题具体发生在哪里。</p><p>还有一条更直接的办法，就是通过异常id，在发生异常之后，的每一次重试，以及随着异常的上抛，这个id会被携带在这些行为的Trace当中，知道这个异常被解决。<br>这个设计有两个优势，一方面是即使任务最后执行成功了，我们也能够知道在这个过程中发生了异常；另一方面是这个异常id就将异常串联了起来，我们能够更清楚的看到，这个异常在哪里开始，在那里结束。</p>"}],"hasChildren":true},{"id":"qa-15","title":"三级异常治理","content":"","children":[{"id":"qa-16","title":"三级异常实现","content":"<p>异常处理机制这里的核心设计原则就是：</p><p><strong>第一层是处理工具故障。</strong><br>首先是针对工具调用的临时性问题，采用直接的指数退避重试；<br>但是就发现有的问题不是靠重试就可以解决的，所以针对比如参数错误这类问题，则是把错误返回给模型修正；<br>但是遇到不可恢复异常，比如权限不足则直接上抛到上层，就不在重试或者消耗模型资源重试了<strong>。</strong></p><p><strong>第二层是处理节点执行问题。</strong><br>这一次的异常现象主要表现为时间或者token耗尽，而原因主要是模型陷入了死循环，一直重复调用工具。<br>所以在这里的难点就是如何重试，让他既能够继承原来已经实现的成果，还不会被原来的思路影响，陷入死循环。<br>我这里最开始先到的策略是，找到他在react的过程中，是哪一步思路出现错误了，然后从这里截断，继续执行。但是我发现思路错误不是单个步骤导致的，所以这个思路不太走得通。<br>后面就选择了抹去他React的过程，单独调用一次模型，把他的成功保留下来，但是不显示他之前的思路是什么。</p><p><strong>第三层是决定整个流程如何继续。</strong><br>如果节点仍然失败，调度器 会根据预设的 处理策略，选择中断流程、还是使用默认值、进入异常分支，或者人工介入。<br>人工处理后，也支持从未受影响的节点重新执行。</p><p>最后呢就是这套系统搭配了我们的Trace记录系统支持的可视化机制，专门设计了异常id，可以将一次异常引发的三层异常串成完整的问题处理链。</p>"},{"id":"qa-17","title":"底层实现","content":"<strong>模板方法模式</strong>：抽象出<code>AbstractNodeExecutor</code>抽象基类，把<strong>所有节点通用的执行流程</strong>（重试、超时、异常处理）全部封装在父类的模板方法里，子类只需要继承父类，重写核心的业务执行方法即可。"},{"id":"qa-18","title":"节点重试时，如何重新构建一份既保留有效成果、又不会继承错误思路的上下文","content":"<strong>节点级主要有两类问题。</strong>输出 Schema 不合格比较容易处理：保留原始证据和待修正结果，注入字段级错误，让新的 <code>NodeAttempt</code> 定向修改。更难的是模型循环或长期无进展。<br><br><strong>我最初想的是竖切一刀，</strong>通过判断旧 ReAct 从哪一步开始走错，保留前面的正确部分、删除后面的错误部分。但是我想不出来怎么做，而且只要保留旧的推理轨迹，就可能让模型继续锚定原来的思路。<br><br><strong>最后我的解决方案是横切一刀，</strong>把执行成果与推理过程解耦：只继承执行结果，不继承原来的 Thought、ReAct 历史。这样既避免从头重复获取信息，也降低了新一轮重试被旧思路误导的风险。"}],"hasChildren":true},{"id":"qa-19","title":"上下文与产物管理","content":"","children":[{"id":"qa-20","title":"你是如何设计系统的上下文与产物管理的？","content":"<strong>这部分主要思考两个问题：</strong>上游 Agent 的产出以什么形式、存放在哪里；下游 Agent 又应该获取哪些内容。<br><br><strong>整个方案经历了三次迭代。</strong><br><br><strong>1.0 阶段</strong>采用全量上下文传递。<br>最开始，我直接把上游 Agent 的完整执行历史，全部传给下一个节点。但多个节点串联后，信息会不断累积。很快就会占满 Context Window。<br><br><strong>2.0 阶段</strong>改为结构化输出和按需输入。<br>我首先考虑过把完整历史压缩成摘要，但这既需要额外调用模型，也可能丢失细节。因此，我借鉴 Dynamic Workflow 的思路，在生成 DAG 时为每个节点动态定义输出 Schema。节点完成后，只保存和传递经过 Schema 校验的 <code>NodeOutput</code>，不再传递完整执行历史。<br><br>输入侧也不再累积整条链路的输出。每个节点默认只接收原始任务、Plan，以及直接依赖节点的结构化输出；其他节点的信息独立存储，Agent 确实需要时再通过 Tool 按需查询。这样，节点间传递的信息量降低到了原始内容的 10%～20%，也基本解决了上下文持续膨胀的问题。<br><br><strong>3.0 阶段</strong>进一步加入 Workspace 和产物版本管理。<br>2.0 解决了文本上下文的问题，但代码、报表等中间产物仍然分散，难以判断应该使用哪个版本。因此，我设计了统一的 <code>Workspace</code>，集中管理用户需求、全局约束和各类文件产物。<br><br>Workspace 使用本地 Git 管理版本。每个节点成功后，会把修改提交为一个 commit，并把 <code>commit_sha</code> 写入对应的 <code>Checkpoint</code>。需要回滚时，系统会同时恢复节点状态和对应的文件版本。<br><br>所以，这套方案就是：结构化 <code>NodeOutput</code> 负责节点间的信息传递，Workspace + Git + Checkpoint 负责中间产物和版本状态的一致性。"},{"id":"qa-21","title":"子节点的输入你是怎么做的？","content":"子 Agent 的 Prompt 组织主要解决两个问题：默认给它哪些信息，以及这些信息按照什么顺序组织。<strong>我的原则是只提供完成当前节点所需的最小完整上下文，同时让稳定约束优先、动态信息靠后、大型产物按需读取</strong>。整体分成六层。<br><br><strong>第一层</strong>是 System Prompt，定义稳定规则。包括 Agent 的职责边界、安全要求、工作原则、工具规则和通用输出要求。这部分最稳定，也最不能被后续内容干扰，所以放在最前面。<br><br><strong>第二层</strong>是 Workflow Context，帮助它理解全局目标。包括用户原始需求、全局约束、验收标准、当前 Plan 和轻量化 DAG 概览。这里只说明整体流程和依赖关系，不注入其他节点的完整执行历史。<br><br><strong>第三层</strong>是 Node Prompt，明确当前要做什么。包括节点目标、输入要求、完成条件、Workspace 读写范围、失败处理方式，以及什么时候必须触发 HITL。<br><br><strong>第四层</strong>是 Dependency Context，提供必要的上游信息。默认只注入直接依赖节点经过 Schema 校验的结构化输出，包括结果、告警、未解决问题和必要的 Artifact 引用，而不是累积所有祖先节点的上下文。<br><br><strong>第五层</strong>是 Tool Context，说明当前可以怎么做。包括可用工具、权限、预算和调用限制。如果默认上下文不够，Agent 可以通过 <code>context_query</code> 和 <code>context_get</code> 主动查询其他节点的信息。查询结果必须携带来源节点、文件路径和 <code>commit_sha</code>；大型内容只返回引用，需要时再读取，查询不到则明确返回 <code>context_missing</code>，不能让模型自行补全。<br><br><strong>第六层</strong>是 Output Contract，约束最终产出。系统会根据动态 <code>NodeOutput Schema</code> 明确必填字段、<code>ArtifactRef</code> 格式，以及成功、部分成功和失败的表达方式，保证输出能够被下游节点稳定消费。<br><br>所以这套设计不是简单地压缩 Prompt，而是建立一条明确的信息链：先固定行为边界，再说明全局目标，然后聚焦当前任务，提供最小依赖，开放按需查询，最后约束输出。这样既能保证子 Agent 理解任务，又能避免全量上下文累积造成的 Token 膨胀和注意力干扰。"}],"hasChildren":true},{"id":"qa-22","title":"Plan 架构与能力优化","content":"","children":[{"id":"qa-23","title":"为什么拆成两阶段 Plan？","content":"<p>早期 Plan Agent 只需要生成任务流程，输出内容比较简单，DAG 构建正确率较高。后来有需要他同时生成工具选择、节点输入输出等信息，就导致他单次生成的目标变得过多，<strong>plan的质量出现明显下降。</strong></p><p>所以我就<strong>设计了两阶段</strong> <strong>Plan</strong>：</p><ul><li>第一阶段：流程规划。只生成任务节点、节点职责和依赖关系，优先保证任务覆盖、拆解粒度和 DAG 拓扑合理。用户也可以在这一阶段调整节点粒度和流程方向。</li><li>第二阶段：再是在确认后的 DAG 上，为每个节点补充 Agent、Tools、输入输出 Schema、数据映射和验收条件，使其成为可以直接执行的图。</li></ul><p>所以本质上，这是把一个复杂任务，拆成“<strong>先确定做什么，再细化</strong>”两个步骤。改造后，DAG 构建正确率恢复并提升到了 97%。</p>"},{"id":"qa-24","title":"两级规划+校验","content":"<p>这里校验的核心逻辑就是先利用脚本做确定性的校验，在利用模型做逻辑上的校验。具体到plan的两个阶段就是：</p><p>第一阶段是<strong>流程规划</strong>。这里Plan Agent 会拆分任务，生成每一个节点干什么，以及节点之间的关系<strong>。</strong><br><strong>此时系统先通过图算法校验</strong> <strong>DAG</strong> 有没有<strong>环、连通</strong>怎么样、依赖是不是<strong>合法，再由</strong> <strong>Review</strong> <strong>Agent</strong> <strong>检查任务覆盖、拆解粒度和流程逻辑。校验通过后展示给用户调整，确认后冻结流程拓扑。</strong></p><p>第二阶段是<strong>任务细化</strong>。这里Plan Agent 在已确认的 DAG 上，为各节点补充他的执行 Agent、输入来源、输出 Schema、验收条件等。<br>在这里就是先检查Json格式、<strong>上下游数据</strong>链接条件是不是匹配的；再由<strong>Review</strong> <strong>Agent</strong> 去<strong>评估节点任务</strong>详情和用户需要<strong>是否一致。</strong></p>"},{"id":"qa-25","title":"如何让模型返回格式化的内容？","content":"首先是模型有参数可以选择，包括宽松模式和严格模式，宽松模式只需要我们提供大概的描述，二严格模式则需要我们提供完整的 JSON Schema 定义目标结构。<br><br>底层原理包含两点：一是大模型厂商在训练的时候，就会让模型适应这种格式化输出能力；二是约束解码，在选择输出词表的时候，约束解码会根据当前 schema 状态，<strong>动态计算合法的 token 集合</strong>，只允许模型从合法 token 中选择。<br><br>如果模型不支持，那就只依靠prompt约束，比如写rules、以及举例，但是这种肯定就非常不稳定。"}],"hasChildren":true},{"id":"qa-26","title":"双层并行调度","content":"","children":[{"id":"qa-27","title":"并行执行","content":"调度我用 Kahn 拓扑排序。因为节点执行是动态推进的：维护每个节点的剩余依赖数（入度），入度为 0 的进 ready queue，节点进入终态后发事件去减后继入度，减到 0 就入队。这样既能发现环，也天然支持并行和条件分支。<br><br>内层是工具级，同一节点内 ReAct 一轮模型一次产出多个互不依赖的 ToolCall，并发执行，有数据依赖的串行。<br><br>测评：200 项任务评测里端到端 wall time 比完全串行低 23%，这个数字固定了模型版本、工具延迟和并发参数，是评测环境数字，和图的可并行宽度强相关。"},{"id":"qa-28","title":"工具并行调用实现？","content":"<p>首先就是要<strong>让模型同时返回多个</strong> <strong>tool</strong> <strong>call</strong>，现在的模型一般都支持了，可以通过参数设置，也可以用prompt去引导。</p><p>其次就当模型<strong>返回了多个</strong> <strong>toolcall</strong>的时候，我们就可以遍历 <code>tool_calls</code> 数组，如果是java的话，就可以使用<code>CompletableFuture.allOf()</code> + 逐个 <code>exceptionally()</code> 来收集结果，收集所有结果后统一回灌。</p>"},{"id":"qa-29","title":"LLM 到底是怎么进行工具调用的？","content":"<p>这个问题要分两个层面：一个是<strong>Agent 怎么进行工具调用</strong>和 另一个是<strong>LLM 怎么进行工具调用</strong>。</p><p><strong>先说 Agent 层。</strong> Agent 的工具调用流程是：<br>运行时把tools数组 和上下文的messages数组 组装成请求发给模型；<br>模型就会生成一个结构化的\"调用参数\"，包括他要调用那个工具，参数填什么；<br>然后clint就会解析并把调用发送给server；<br>在server把执行结果返回之后，就会把消息追加回上下文；<br>模型看到结果后决定是继续调下一个工具还是给最终答案。<br>这个\"思考→行动→观察→再思考\"的循环就是 ReAct，也是今天几乎所有 Agent 框架的范式。</p><p>那更底层一点，模型是怎么实现工具调用的呢？<br>首先是我们通过 API 传的 messages 和 tools 参数，会经过一个叫 <strong>Chat Template</strong> 的翻译层，渲染成模型训练时见过的那个确切格式。以 Qwen3 为例，tools 定义会被 <code>&lt;tools&gt;&lt;/tools&gt;</code> XML 标签包裹，同时告诉模型\"需要调用工具的时候需要在 <code>&lt;tool_call&gt;</code> 标签内输出 JSON\"。<br>这些特殊 token 是模型区分角色和轮次的依据，用错模板模型识别准确性就会下降很多。</p>"}],"hasChildren":true},{"id":"qa-30","title":"人机交互","content":"","children":[{"id":"qa-31","title":"系统的HITX","content":"我的项目提供了两层的人工介入，包括HITL、HITG。<br><br>HITL就是传统的，单个Agent React的过程中，遇到信息不足、准备调用高风险工具时，需要临时向人请求帮助。<br><br>HITG 则是把人工介入作为 Graph 中的一类正式任务节点，把人当做一个subagent来调用。它不是临时帮助 Agent，而是在实际场景中，会遇到一些任务是受到权限、安全等各种因素，只能由人来完成的。<br><br><strong>二者的区别主要有两点</strong>：<br><br>● HITG是预先定义好的，我清楚在这个流程中哪里需要人介入；HITL是临时的，是由Agent自己决定发起的。<br>● 第二点区别就是，HITG需要完成的任务更加复杂，只做决断。所以我在这里把这个HITG设计为了一个任务节点，把人当做SubAgent一样的调用：让系统根据任务准备好任务背景、上游产物、待决策事项和可选操作，而不是默认人了解全部上下文。人可以通过对应的输入窗口提交审批结果、产物或处理意见；将结果写回 Workflow，再推进后继节点。这个策略带来了很大的提效，因为他将我们人需要完成任务的上下文直接准备好了。"},{"id":"qa-32","title":"HITG/HITL：人应该扮演什么角色","content":"主要有四方面：<br><br>● 澄清：Agent 不确定用户意图，主动提问<br>● 审批：Agent 准备执行某步，等人点头<br>● 审核：Agent 产出初稿，人审核修改后再继续<br>● 接管：有的任务受限于权限、安全性需要人来完成"},{"id":"qa-33","title":"HITL怎么实现？","content":"HITL 通常实现为 执行拦截、状态保存、人工回调、上下文恢复 四步。<br><br>Agent 在 ReAct 循环中准备执行高风险 ToolCall，或者遇到信息不足、低置信度时，就会拦截本轮执行，生成结构化的 <code>interrupt</code>，包含介入原因、待确认操作、工具参数、上下文摘要和期望的人类输入类型。<br><br>系统随后序列化当前 Agent 状态，以等待人工介入之后恢复，等待期间释放线程和模型资源。<br><br>人通过聊天卡片或 Web 页面提交批准、拒绝、修改或补充信息。服务端校验身份、权限、输入格式，再把人工结果作为新的 信息 加入上下文，恢复 ReAct 循环：批准就执行原 ToolCall，修改就用新参数执行，补充信息就继续推理，拒绝则终止或重新规划。"}],"hasChildren":true},{"id":"qa-34","title":"其他","content":"","children":[{"id":"qa-35","title":"成本控制","content":"我主要从几个方面控制成本。<br><br>第一，<strong>预算控制</strong>。我们在工具、节点和整个 Run 三个层级分别设置调用次数、Token 和执行时间预算，避免局部循环拖垮整条流程。<br><br>第二，<strong>减少不必要的模型调用</strong>。依赖解析、Schema 校验和瞬时错误重试等确定性逻辑由 Runtime 处理，不交给大模型反复判断。<br><br>第三，<strong>减少上下文传递</strong>。一方面是父子节点之间通过结构化输出传递核心结果和引用，过滤大量的工具调用返回结果；一方面是将大文件等中间结果存入 Workspace，需要时再按需读取。<br><br>第四，<strong>按任务加载工具</strong>。不会把所有工具的 Schema 都放进 Agent 上下文，而是由 Plan Agent根据节点任务选择必要工具，降低输入 Token 和误选概率。<br><br>第五，<strong>提高 Prompt Cache 命中率</strong>。固定的 System Prompt、工具定义等静态内容放在上下文前部，动态任务信息放在后部，尽量保持前缀稳定，从而复用缓存并降低成本。<br><br>模型分级路由目前还没有实现，后续可以让简单任务使用轻量模型，复杂推理再升级模型。"}],"hasChildren":true}] },
          internship: { label: "广告机审实习", items: [{"id":"qa-36","title":"整体流程","content":"<figure class=\"qa-figure\"><img src=\"资源/img/问答/广告机审Agent-完整流程.png\" alt=\"广告机审Agent-完整流程\"><figcaption>广告机审Agent-完整流程</figcaption></figure><p>我具体展开一下这个 Agent 是怎么工作的。<strong>整体分成两个角色：诊断 Agent 负责确认是不是误杀、问题可能出在哪里；修改 Agent 负责改 Prompt，并通过测试验证改法。</strong></p><p>先说诊断。这里我没有让它一上来就看机审和人审的结论，而是设计了四步：<strong>先理解广告内容，再理解规则和边界，形成自己的判定，最后才对照机审、人审的理由和各节点的执行记录。</strong> 这样做是因为，模型有时看到一个关键词就会套规则，或者看到人审说 “这是误杀”，就顺着这个答案找理由。我希望它先有自己的判断，再根据证据复核，而不是默认哪一方一定正确。</p><p>这里比较重要的一个设计是 <strong>Case 库</strong>。有些规则用文字不容易把边界讲清楚，所以除了规则，我还会给它相关的历史合规和违规案例。重点不是找一条 “长得像” 的广告让它照着判，而是让它比较：<strong>为什么两个很像的 Case，一个应该拦，一个不应该拦，真正改变结论的条件是什么。</strong></p><p>诊断结束后，它会把出错节点、相关证据和可疑的 Prompt 表达交给修改 Agent。<strong>这里给的是初步假设，不是已经确定的根因。</strong> 比如怀疑某个词写得太宽，究竟是不是这个原因，还要看修改后的测试结果。</p><p><strong>修改 Agent 先用原 Prompt 重复运行当前 Case</strong>，看看原来是不是就存在判定波动，再针对问题做局部修改。如果不确定哪种措辞合适，就生成少量候选，用同一套测试比较，而不是凭感觉选一句。</p><p>测试也不只是看当前 Case 能不能通过。<strong>先重复测试当前 Case，再测换一种表达、相似但结论相反的边界案例，最后跑规则相关的历史回归。</strong> 这样才能发现：这次到底修好了一个问题，还是单纯把规则放宽了，导致其他违规广告也被放过去。</p><p><strong>测试失败后</strong>，具体失败案例会交回修改 Agent，帮助它调整改法，也反过来修正前面的归因。达到迭代上限，或者一直出现 “改严误杀、改松漏放”，就停止并保留旧版；通过后交出候选和报告，再由灰度观察和人工确认决定是否上线。</p><p>所以这个项目的核心，不是让 Agent 自动写一句更好的 Prompt，而是让它能提出修改假设、用测试验证，并且知道什么时候该停。</p>"},{"id":"qa-37","title":"项目目标与整体流程","content":"","children":[{"id":"qa-38","title":"为什么用 Agent 优化 Workflow，而不是直接替代它？","content":"<p>主要有两个点：</p><ol><li><strong>成本：包括 Token 和时间消耗</strong>。Agent 比 Workflow 准，很大原因是我们给它设计了很多策略，这不可避免带来了更多次数的模型调用，进而导致 Token 和时间消耗翻倍。在以万为单位的审核场景里，这种消耗是无法承受的。</li></ol><ol><li><strong>规则层面：</strong>原始策略是每个 case 会经过每一个 workflow，而一个 workflow 对应一类细分规则。因此只要 case 有问题，就一定会被对应的规则审核一遍。这就是 Workflow 带来的好处。而如果我们用 Agent 来实现的话，我们不可能把所有的规则都放在这一个 Agent 的 Prompt 里面，就需要想办法让这个 Case 匹配上它对应的规则，这又是一个难点。</li></ol><p>所以我说 Workflow 这种看起来更不灵活、更笨的策略，在这种场景下是目前最好的办法，有的时候没有必要去追求过于 fancy 的策略，看起来朴素一点的方法其实会更有效。</p>"}],"hasChildren":true},{"id":"qa-39","title":"诊断与归因","content":"","children":[{"id":"qa-40","title":"Workflow 为什么会误判？","content":"<p><strong>我把 Workflow 误判大概分成四类</strong>。</p><ol><li><strong>模型本身有波动。</strong> 同一个 Case 有时候判对、有时候判错，也可能出现编造素材、理由和最后标签对不上的情况。</li><li><strong>Prompt 有明确问题。</strong> 比如边界没说准、规则没写全，或者本来需要理解语义，却写成了关键词命中就拦截。</li><li><strong>模型能力到了上限。</strong> 信息和规则已经给全了，但当前模型还是理解不了隐含语义、多模态内容或者复杂规则。</li><li><strong>Prompt 本身很难把边界说清楚。</strong> 有些判断依赖大量经验，继续加规则只会让 Prompt 越来越长、例外越来越多。</li></ol><p><strong>这四类只是原因分类</strong>，不代表拿到一条误杀时，马上就能确认它属于哪一类。尤其是概率波动、模型能力和 Prompt 表达上限，通常还要通过重复运行和修改测试才能判断。</p><p>详见：<a href=\"obsidian://open?vault=Obsidian-Vault&amp;file=%E5%AE%9E%E4%B9%A0%2F%E5%B9%BF%E5%91%8A%E6%9C%BA%E5%AE%A1Agent-%E9%9D%A2%E8%AF%95%E9%97%AE%E7%AD%94%E5%AF%BC%E8%88%AA%23%5Eans-diagnosis-6\" title=\"在本机 Obsidian 中查看；需要原知识库\">完整误判原因分类</a>。</p>"},{"id":"qa-41","title":"为了让诊断 Agent 判得更准，我做了什么？","content":"<p>我主要做了四件事：<strong>给它更多信息、使用更强模型、把判断拆成四步，以及增加证据和结果一致性检查。</strong></p><p><strong>信息上</strong>，除了广告素材和业务规则，还会提供历史正反 Case、Workflow 执行记录和实际 Prompt；</p><p><strong>模型上</strong>，因为诊断 Agent 只处理少量疑难误杀，可以使用比线上 Workflow 更强的模型和更多次调用。</p><p><strong>四步就是：</strong>先理解广告在说什么，再理解规则管什么，然后在没看旧机审和人审结论之前自己判一次，最后才对照双方理由和各节点记录。这样既能避免看到关键词就套规则，也能减少沿着旧结论补理由的情况。</p><p><strong>另外，关键判断必须绑定到素材和规则证据</strong>，还要检查前面的理由和最后标签是否一致。但这些策略只是让诊断更可靠，不能保证一次就判断出真正原因，也不能彻底消除模型波动或突破模型能力上限。</p><p>详见：<a href=\"obsidian://open?vault=Obsidian-Vault&amp;file=%E5%AE%9E%E4%B9%A0%2F%E5%B9%BF%E5%91%8A%E6%9C%BA%E5%AE%A1Agent-%E9%9D%A2%E8%AF%95%E9%97%AE%E7%AD%94%E5%AF%BC%E8%88%AA%23%5Eans-diagnosis-four-step\" title=\"在本机 Obsidian 中查看；需要原知识库\">诊断四步及其原因</a>、<a href=\"obsidian://open?vault=Obsidian-Vault&amp;file=%E5%AE%9E%E4%B9%A0%2F%E5%B9%BF%E5%91%8A%E6%9C%BA%E5%AE%A1Agent-%E9%9D%A2%E8%AF%95%E9%97%AE%E7%AD%94%E5%AF%BC%E8%88%AA%23%5Eans-diagnosis-1\" title=\"在本机 Obsidian 中查看；需要原知识库\">完整准确率策略</a>。</p>"},{"id":"qa-42","title":"面对一条具体误杀，怎么做归因？为什么后面还要继续归因？","content":"<p><strong>面对具体 Case</strong>，我不会一上来就断言“这是 Prompt 的问题”，而是看现在的证据能够支持到什么程度。</p><p><strong>第一类，是现在就能确认的输出错误。</strong> 比如模型编造了广告里不存在的内容、引用了不存在的规则，或者理由明明支持合规，最后却判成违规。这里能确认的是“输出错了”，但还不一定知道为什么会错。</p><p><strong>第二类，是现在能指出的 Prompt 缺陷。</strong> 把业务规则和实际 Prompt 放在一起对照，看是不是边界没说准、必要条件或豁免没写全，或者判断方式写错了。这时可以提出修改方向，但还不能证明它就是唯一根因。</p><p><strong>第三类，是现在不能确认、必须靠测试验证的原因。</strong> 比如是不是概率波动，某个措辞是不是真的影响判断，或者已经到了模型能力和 Prompt 表达的上限。这些要靠原 Prompt 重复运行、候选修改和回归测试继续判断。</p><p><strong>所以诊断 Agent 交给修改 Agent 的</strong>，不是一个已经定死的答案，而是<strong>错误节点、证据、目前能确认的问题，以及还要验证的原因假设</strong>。后面的修改和测试可能支持这个假设，也可能修正甚至推翻它，这就是为什么归因会分成初步归因和进一步归因。</p><p>还要注意三点：<strong>找到错误节点不等于找到根因，人审结论也不一定正确，而且一条 Case 可能同时存在多个问题。</strong></p><p>详见：<a href=\"obsidian://open?vault=Obsidian-Vault&amp;file=%E5%AE%9E%E4%B9%A0%2F%E5%B9%BF%E5%91%8A%E6%9C%BA%E5%AE%A1Agent-%E9%9D%A2%E8%AF%95%E9%97%AE%E7%AD%94%E5%AF%BC%E8%88%AA%23%5Eans-preliminary-attribution\" title=\"在本机 Obsidian 中查看；需要原知识库\">三层初步归因与交接内容</a>。</p>"}],"hasChildren":true},{"id":"qa-43","title":"Prompt 修改与测试","content":"","children":[{"id":"qa-44","title":"Prompt 具体怎么改？修改过程中遇到了哪些困难？","content":"<p><strong>明确缺了条件或豁免</strong>，这种问题比较好改，对照业务规则补进去就可以。<strong>真正难的是，我知道大概要改哪里，但不知道怎么写，线上模型才能按我想的意思理解。</strong></p><p><strong>比如一个词用得严一点</strong>，可能增加误杀；换得松一点，又可能增加漏放。所以我不会只生成一句话，然后凭感觉认为它更准确，而是让修改 Agent 给出少量不同表达，固定模型和测试 Case，比较实际效果。</p><p>还有一个问题是，当前 Case 修好了，不代表这次修改就没问题。比如直接补一句“手机壳不违规”，可能把一些借手机壳包装其他业务的广告也放过去。因此我要求<strong>尽量只改目标规则片段，并且每次修改都要说明它可能影响哪些 Case</strong>，再针对这些范围测试。</p><p><strong>另外，也不能每来一条误杀就追加一句豁免</strong>。类似问题要归纳成共同条件，否则 Prompt 越改越长，后面自己都可能互相冲突。</p><p>详见：<a href=\"obsidian://open?vault=Obsidian-Vault&amp;file=%E5%AE%9E%E4%B9%A0%2F%E5%B9%BF%E5%91%8A%E6%9C%BA%E5%AE%A1Agent-%E9%9D%A2%E8%AF%95%E9%97%AE%E7%AD%94%E5%AF%BC%E8%88%AA%23%5Eans-prompt-edit-strategy\" title=\"在本机 Obsidian 中查看；需要原知识库\">修改中的典型困难与处理方法</a>。</p>"},{"id":"qa-45","title":"修改之后怎么测？这些测试分别解决什么问题？","content":"<p><strong>我不是只看当前 Case 有没有从违规变成合规，而是要区分：到底真的修好了，还是碰巧答对了，或者只是把规则放松了。</strong></p><p><strong>所以修改前</strong>，我先用原 Prompt 重复跑当前 Case，看原来是不是就有时对、有时错。修改后再重复跑候选，检查它能不能稳定判对。</p><p><strong>然后做三类针对性测试</strong>：</p><ul><li><strong>同一个意思换种说法，</strong>看它是不是只对原来的那句话有效；</li><li><strong>只改变一个关键条件，</strong>看它能不能区分很相近的合规和违规 Case；</li><li><strong>找可能受补丁影响的其他 Case，</strong>看范围有没有被改大或改小。</li></ul><p><strong>最后再从同一规则相关的历史 Case 里随机抽合规、违规两组</strong>，让新旧 Prompt 跑同一批，重点找“旧版判对、新版判错”的情况。</p><p><strong>边界案例可以检索</strong>，不够时人工构造并核对；但大范围回归还是要用真实历史案例，不能只拿自己构造的题证明效果。</p><p>详见：<a href=\"obsidian://open?vault=Obsidian-Vault&amp;file=%E5%AE%9E%E4%B9%A0%2F%E5%B9%BF%E5%91%8A%E6%9C%BA%E5%AE%A1Agent-%E9%9D%A2%E8%AF%95%E9%97%AE%E7%AD%94%E5%AF%BC%E8%88%AA%23%5Eans-edit-test-design\" title=\"在本机 Obsidian 中查看；需要原知识库\">测试顺序、各项作用与 Case 来源</a>。</p>"},{"id":"qa-46","title":"怎么判断一版 Prompt 改好了？误杀和漏放怎么权衡？","content":"<p><strong>我把“当前 Case 修好”和“这一版可以交出去”分开判断。</strong> 当前 Case 通过，只是第一步；如果同时改坏了其他 Case，这一版仍然不能用。</p><p><strong>这个业务更重视减少误杀</strong>，所以我设计的门槛偏向保护合规广告：当前 Case 连续跑 5 次都正确，针对性的合规案例不出现误杀，历史回归不新增误杀；同时给新增漏放设置一个预先约定的上限，不能为了放过当前广告，把规则无限放宽。</p><p><strong>测试后不只看一个总分</strong>，还要把新旧版的结果逐条对上，看看<strong>修好了哪些，又改坏了哪些</strong>。标签正确但理由编造了素材，也不能算可靠修复。</p><p><strong>这些是我设计的验收条件</strong>，不是公司统一标准。满足条件后交出候选和报告，再通过灰度观察和人工确认决定是否正式上线。</p><p>详见：<a href=\"obsidian://open?vault=Obsidian-Vault&amp;file=%E5%AE%9E%E4%B9%A0%2F%E5%B9%BF%E5%91%8A%E6%9C%BA%E5%AE%A1Agent-%E9%9D%A2%E8%AF%95%E9%97%AE%E7%AD%94%E5%AF%BC%E8%88%AA%23%5Eans-edit-pass-fail-gates\" title=\"在本机 Obsidian 中查看；需要原知识库\">候选通过与不通过的门槛</a>、<a href=\"obsidian://open?vault=Obsidian-Vault&amp;file=%E5%AE%9E%E4%B9%A0%2F%E5%B9%BF%E5%91%8A%E6%9C%BA%E5%AE%A1Agent-%E9%9D%A2%E8%AF%95%E9%97%AE%E7%AD%94%E5%AF%BC%E8%88%AA%23%5Eans-arch-1\" title=\"在本机 Obsidian 中查看；需要原知识库\">灰度和人工决策</a>。</p>"},{"id":"qa-47","title":"一直改不好怎么办？什么时候停止？","content":"<p><strong>我不会因为一版没通过就说 Prompt 修不了，但也不会让 Agent 一直换词、一直重试。</strong></p><p><strong>比如某个方向改了两轮</strong>，失败的还是同一批 Case，稳定性没提高，新增误杀或漏放也没减少，就说明继续沿这个方向小修意义不大，应该换一个真正不同的方向。</p><p><strong>我设计的预算是</strong>最多尝试 3 个方向，每个方向最多 2 版。如果仍然反复出现“改严就误杀、改松就漏放”，或者只能不停追加特例，就结束本轮，保留旧版。</p><p><strong>还有些情况不需要把次数用完</strong>：比如关键证据根本没进入模型输入，或者这个 Case 应该怎么判，业务上还有争议。这时继续改 Prompt 也解决不了缺失的信息或标准。</p><p><strong>停止后不能只说“失败了”</strong>，而要留下<strong>试过什么、哪些 Case 一直失败、为什么停下来</strong>，交给人继续处理。这个结论是“当前条件下没找到可用版本”，不是“任何 Prompt 都不可能解决”。</p><p>详见：<a href=\"obsidian://open?vault=Obsidian-Vault&amp;file=%E5%AE%9E%E4%B9%A0%2F%E5%B9%BF%E5%91%8A%E6%9C%BA%E5%AE%A1Agent-%E9%9D%A2%E8%AF%95%E9%97%AE%E7%AD%94%E5%AF%BC%E8%88%AA%23%5Eans-edit-test-limits\" title=\"在本机 Obsidian 中查看；需要原知识库\">当前修不好的具体表现</a>、<a href=\"obsidian://open?vault=Obsidian-Vault&amp;file=%E5%AE%9E%E4%B9%A0%2F%E5%B9%BF%E5%91%8A%E6%9C%BA%E5%AE%A1Agent-%E9%9D%A2%E8%AF%95%E9%97%AE%E7%AD%94%E5%AF%BC%E8%88%AA%23%5Eans-edit-pass-fail-gates\" title=\"在本机 Obsidian 中查看；需要原知识库\">迭代预算与停止条件</a>。</p>"}],"hasChildren":true},{"id":"qa-48","title":"Case 库","content":"","children":[{"id":"qa-49","title":"为什么要做 Case 库？它怎么帮助判断边界 Case？","content":"<p><strong>我最开始处理误杀 Case 的办法</strong>，就是发现一个误杀，就在 Prompt 里面加一个豁免点。这样确实能把当前 Case 修好，但问题是 Case 会越来越多，Prompt 也会越来越长，里面的豁免点会不断增加，后面还可能互相冲突。</p><p><strong>后来我发现</strong>，我们很难只依靠 Prompt，把一条规则的边界描述得特别精确。所以除了把规则告诉模型，还要给它一些以前判过的例子。于是我把<strong>误杀 Case、其他没有问题的 Case，以及确认有问题的 Case</strong>都存进 Case 库。</p><figure class=\"qa-figure\"><img src=\"资源/img/问答/Case规则边界.png\" alt=\"Case规则边界\"><figcaption>Case规则边界</figcaption></figure><p>就像图里这样，有问题的 Case 和没有问题的 Case，在内容上可能非常像。在向量空间里，它们也可能交织在一起，很难直接画出一条清楚的边界，这也是原来的 Workflow 容易判断错的地方。</p><p><strong>当现在又来了一条处在边界附近的 Case</strong>，我会分别找离它最近的 <strong>3 条有问题 Case和3 条没有问题 Case</strong>，然后让模型去比较：为什么这 6 条 Case 在内容或者判定理由上都很像，但其中三条有问题，另外三条没有问题？到底是哪一个条件改变了最后的结论？</p><p><strong>所以我做 Case 库</strong>，一方面是为了避免每出现一条误杀，就继续往 Prompt 里加豁免点；另一方面也是想用历史上的正反例，帮助模型理解那些单靠 Prompt 很难说清楚的边界。</p><p>详见：<a href=\"obsidian://open?vault=Obsidian-Vault&amp;file=%E5%AE%9E%E4%B9%A0%2F%E5%B9%BF%E5%91%8A%E6%9C%BA%E5%AE%A1Agent-%E9%9D%A2%E8%AF%95%E9%97%AE%E7%AD%94%E5%AF%BC%E8%88%AA%23%5Eans-case-2\" title=\"在本机 Obsidian 中查看；需要原知识库\">为什么同时保存合规与违规 Case</a>、<a href=\"obsidian://open?vault=Obsidian-Vault&amp;file=%E5%AE%9E%E4%B9%A0%2F%E5%B9%BF%E5%91%8A%E6%9C%BA%E5%AE%A1Agent-%E9%9D%A2%E8%AF%95%E9%97%AE%E7%AD%94%E5%AF%BC%E8%88%AA%23%5Eflow-case-boundary\" title=\"在本机 Obsidian 中查看；需要原知识库\">规则边界示意与解释</a>。</p>"},{"id":"qa-50","title":"Case 检索策略是怎么迭代的？","content":"<p><strong>我最开始用视频转写做向量检索</strong>，但 OCR 和 ASR 的结果有时比较乱，所以后来加入了关键词检索，用向量找语义相近的内容，用关键词保留商品名、规则名等精确信号。</p><p><strong>接着我发现</strong>，内容相似不代表命中同一条规则，也不代表误杀原因相同，所以又增加了 Workflow 原判理由和误杀反转原因两个检索方向，并保证同时召回有问题和没有问题的案例。</p><p><strong>最终的方案是</strong>：先按照 Workflow、规则和业务场景做标签过滤，再通过混合 RAG 召回大约 30 条 Case。由模型根据这个 Case 的内容自行判定需要哪几条 Case，选中后再把 Case 的全量信息交给他进行判断。</p>"}],"hasChildren":true},{"id":"qa-51","title":"流程控制与 GraphHarness","content":"","children":[{"id":"qa-52","title":"实习里为什么需要流程控制？和 GraphHarness 怎么结合？","content":"<p><strong>Agent 负责判断怎么改，程序负责控制执行过程。</strong> 参考 GraphHarness 的思路，这里主要有两个价值：</p><ol><li><strong>控制信息何时给。</strong> 诊断先理解 Case 和规则、保存独立判定，再提供旧机审结论、人审理由和执行记录。不是先全塞进去，再要求它“别受影响”。</li><li><strong>控制是否完成、何时停。</strong> 看测试是否跑齐、成绩是否对应当前候选、指标是否达标；记录修改次数，没改善或预算耗尽就停止，不能靠 Agent 自报完成。</li></ol><p>详见：<a href=\"obsidian://open?vault=Obsidian-Vault&amp;file=%E5%AE%9E%E4%B9%A0%2F%E5%B9%BF%E5%91%8A%E6%9C%BA%E5%AE%A1Agent-%E9%9D%A2%E8%AF%95%E9%97%AE%E7%AD%94%E5%AF%BC%E8%88%AA%23%5Eans-arch-2\" title=\"在本机 Obsidian 中查看；需要原知识库\">流程控制的详细回答</a>、<a href=\"#qa-4\" data-qa-target=\"qa-4\">轻量编排与个人项目的区别</a>。</p>"}],"hasChildren":true}] },
          concepts: { label: "概念", items: [{"id":"qa-53","title":"基础","content":"","children":[{"id":"qa-54","title":"Agent是啥？和普通的 LLM 有什么区别？","content":"<p>我觉得可以从两方面去说，<br>一方面是：Agent 就是大模型加Harness。我们在Harness里面实现了什么能力，这个agent就有什么能力。一般就包括记忆、工具等能力，这就让模型能够真正执行任务，而不只是回答问题。<br>然后我们还可以在harness层面对agent进行优化，让他有有上下文压缩，checkpoint机制，让它能够在任务完成当中更稳定。</p><p>另一方面呢，就是说而目前的Agent大多是通过ReAct循环来完成一个任务，所以我们可以大概的说：Agent 的本质是一个基于 LLM 的决策循环（Reasoning Loop）。它观察环境、思考下一步行动、执行行动，然后再次观察结果，如此往复。<br>当然还有包括Plan-and-Execute、Reflection等策略，让agent拥有反思总结、多步骤的能力，就可以让他在复杂任务中执行的更好。</p>"},{"id":"qa-55","title":"agent有哪些设计范式？如何选择？","content":"<p><strong>ReAct</strong>就是推理、行动、观察的循环，推理这一轮我需要干什么，行动获取结果，再根据结果思考是在进行下一轮还是结束循环返回结果。</p><p>他的问题就是只能看见眼前，在处理特别复杂的、需要全局规划的任务时，容易迷失方向。</p><p><strong>Plan-and-Execute</strong>是先制定计划-执行-再加上动态判断（可能提前结束或者重新规划）。</p><p><strong>Reflexion</strong>是在完成当前任务之后，反思做的好不好，如果评估不通过，就重试或者换一种策略。他还有一种变体，就是会记录错题本。记录下这次失败的原因和改进建议，然后把这段总结作为额外的上下文传给下一次尝试。</p><p><strong>CoT</strong>（Chain of Thought，思维链），在 prompt 里加一句「让我们一步步思考」，LLM 就会先把推理步骤写出来，再给答案，而不是直接蹦出结论。从而减少多步推理中的累积误差。<br>但是现在的模型都在逐渐的将思维链内化，所以现在在使用强模型的时候应该不太需要我们在prompt里面专门加这句话了。</p><p><strong>TOT：</strong>Tree of thoughts，多路径探索和回溯。会同时探索多条推理路径，通过评分、回溯或搜索选择更优方案，适合解空间大、错误代价高的任务；但模型调用量、延迟和成本都明显更高。</p><p><strong>SC</strong>（Self-Consistency，自洽性）是对抗幻觉的方法，用相同提示词多次调用模型，以多数结果作为最终答案，类似多次验算投票，能降低错误率，但更耗时、成本更高。</p><p>首先是针对后面四种策略，它们的成本都较高，所以实际使用不是很多。<br>并且随着但前模型逐渐将思维链内化，就导致显式的PAE/TOT/reflexion的收益降低，但是在弱模型还是有效的。</p>"},{"id":"qa-56","title":"MCP是什么？有哪几个部分？怎么使用？","content":"我理解的 MCP 它就是一个 agent 到 tool 之间的一个协议，它能够让 agent 调用这个tool，避免每一个agent对接每接一个新工具都要单独写适配代码。<br><br>底层基于 <strong>JSON-RPC 2.0</strong> 实现有状态双向通信，支持本地 stdio、HTTP-SSE、流式 HTTP 多种传输方式<br><br>有三部分，Host、Client、Server。Host就是支持MCP协议的应用程序，也就是我们配置大模型了的地方。Client在 Host 内部运行，负责与 MCP Server 建立连接。Server可以理解为一个软件，我们将他提供的原子性的能力称之为Tool，一个Server可以提供多个Tool。<br><br>当我们配置并启动我们需要的 Server 后，会获取其包含的 Tool 列表，用户提问后，Host 将问题与 Tool 列表一同传给模型；模型判断需调用的 Tool 及参数，反馈给 Clinet；Clinet 转发调用请求至 MCP Server，Server 执行 Tool 后返回结果；Cline 将结果回传给模型，模型整理后给出最终答案并反馈给用户。"}],"hasChildren":true},{"id":"qa-57","title":"Harness、Graph、Loop","content":"","children":[{"id":"qa-58","title":"HarnessEngineering","content":"<strong>Harness 这个概念本质上是在回答一个问题</strong>：为什么同样一个模型，在不同的产品里表现天差地别？答案就是 Agent 等于模型加 Harness，模型提供的是智能，而 Harness 是让这份智能真正落地的系统。<br><br><strong>那harness包含哪些内容呢？</strong>你想要 Agent 能做什么，就在 Harness 里给它搭什么能力。包括文件系统让它能持久化存储、沙箱让它能安全执行代码、记忆系统让它能跨会话学习、压缩机制防止它在长任务中性能衰减。"},{"id":"qa-59","title":"Loop Engineering","content":"<p><strong>定义是：</strong>给任务定一个准出标准，不达标就回去继续干，直到过线。</p><p><strong>Loop</strong> <strong>Engineering到底改变了什么？</strong>之前的工作模式是我写 prompt、Agent 干活、我检查结果、再写下一个 prompt，我才是那个驱动循环的人。有了 Loop Engineering 之后，我设计好目标、评估标准，然后一个循环系统自动去驱动 Agent，我只在最后看结果。</p><p>但这里有一个关键的前提，就是<strong>Loop</strong> <strong>Engineering</strong> <strong>真正适用的场景</strong>，是那些停止条件可以被明确验证的任务。比如\"让所有测试通过\"或者\"构建成功\"，这些条件 Agent 自己能判断。但对于\"做一个好的 PPT\"这种任务，什么是好本身就很模糊，你还是需要在循环中介入判断。</p>"},{"id":"qa-60","title":"Graph Engineering","content":"<strong>Graph Engineering简单的说就是，</strong>把多个Agent Loop连成显示的图，而不是把所有东西塞在一个聊天上下文里。<br><br>而他的一个比较明显的特点就是这个些AgentLoop之间，联系了起来，交给了系统自动推进。<br><br>所以他解决问题是不同任务之间的流程依赖人来推动，效率就不高，这里是交给系统来推动<br><br>但这里和我们项目所描述的状态还有一定的距离，我们再把人工介入加进去，就变成了HITG（Human in the Graph）,也就形成了我项目所描述的人和Agent的新协作方式：“系统管流程、Agent 管执行、人管关键决策”。"},{"id":"qa-61","title":"三者关系","content":"● Harness Engineering：给 Agent 搭一套环境，让它能更稳定地干活。<br>● Loop Engineering：给任务定一个准出标准，不达标就回去继续干，直到过线。<br>● Graph Engineering：把多个Agent Loop连成显示的图，而不是把所有东西塞在一个聊天上下文里。"},{"id":"qa-62","title":"Loop 最基础包含哪几个部分？","content":"我理解一个最基础的 Loop，至少包含四个部分，分别是<strong>任务状态、执行、检查和循环控制</strong>。<br><br>首先要有一个任务状态，用来保存当前要完成的目标、已经执行到哪一步，以及上一轮产生的结果。<br><br>第二个部分是执行。系统根据当前任务和上下文执行一次操作，产生一个阶段性结果。这个执行过程可以是调用大模型，也可以是调用工具、运行代码或者查询数据。<br><br>第三个部分是检查。每次执行完成之后，系统都需要判断当前结果是否已经满足任务要求。检查可以是规则校验、单元测试，也可以是由另外一个审查 Agent 来完成。<br><br>最后是循环控制。如果检查通过，就结束循环并返回结果；如果没有通过，就把检查发现的问题反馈给执行模块，让它进入下一轮修改。同时还要设置最大循环次数、超时或者无进展退出条件，避免一直循环下去。<br><br>所以最简单的实现逻辑就是：<br><br>执行一次，检查结果；通过就退出，不通过就带着反馈继续执行，直到通过或者触发兜底退出条件。<br><br>从代码层面来看，它本质上就是由宿主程序通过 <code>for</code> 或者 <code>while</code> 循环来控制的。大模型本身并不会自动循环，真正让 Loop 运转起来的是外部的编排程序。"},{"id":"qa-63","title":"你项目中的 Loop 是怎么实现的？","content":"首先，由于我的项目是由 DAG 控制的，以任务为颗粒度划分节点，而在这里执行 Agent 和审查 Agent 相当于共同执行一个任务，所以它在 DAG 里的体现只是一个任务节点，而不是一个循环。<br><br>执行 Agent 生成结果，审查 Agent 检查结果；通过就结束，不通过就把问题反馈给执行 Agent 继续修改。<br><br>这里最关键的不是简单判定通过还是不通过？而是要形成真正的<strong>反馈闭环</strong>。也就是说，审查 Agent 会输出不通过的原因，并且会放进下一轮执行 Agent 的输入，否则每一轮执行都是重新生成，系统很可能反复犯同样的错误，这样就不算一个有效的 Loop。"}],"hasChildren":true},{"id":"qa-64","title":"SDD","content":"","children":[{"id":"qa-65","title":"SpecCoding是什么","content":"<p>我先说普通 Vibe Coding是什么，他是“描述需求 然后 直接写代码”。这种方式适合小改动，但复杂业务里容易出问题，就可能因为 AI 没有完全理解业务，导致他的实现跟我的需求不一样</p><p>而Spec Coding 就多了几个步骤：<strong>先需求分析 → 再技术选型 → 再拆解任务 → 编码执行</strong>。它的意义在于，在实践之前，我们先理清楚我们需要什么，然后怎么做，按什么样的步骤去做。这样人可以在低成本阶段发现错误，而不是等 AI 写完一堆代码再返工。</p><p>所以在选择上，我会把 Spec Coding 用在比较正式的、比较复杂的需求上面；简单 任务就不太需要走这个流程。</p>"},{"id":"qa-66","title":"你的 AI Coding 流程是什么？","content":"<p>AI Coding 除了 Spec Coding（规范驱动），还会再加一点<strong>测试驱动</strong>。</p><p>也就是先通过 Spec Coding 把我们要做<strong>什么说清楚，</strong>然后再通过测试驱动把我们怎么样验收给<strong>定义清楚，最后再让</strong>这个 AI 去执行。</p><p>这个 Spec Coding 规范驱动解决的问题就是说，我们在实践之前，先理清楚我们需要什么、怎么做、按什么样的步骤去做，这样就可以在低成本阶段发现错误，而不是等 AI 写完一段代码再返工。</p><p>而这个测试驱动就是要解决一个问题：AI 有时会假装任务完成。他会为了让代码跑通而造假，比如说补假数据、吞掉错误、改测试用例。<br>而测试驱动就是一种验证，也是 Loop Engineering 的一种实践。我们在让 AI 帮我们完成这个任务之前，就需要想清楚这个任务到底怎么样算完成了。只有理清楚了这一点，才能够让 AI 形成一个执行又修改的 Loop，然后让让他能够有校验地去帮我完成这个任务。只有真的通过了我们设计的测试，才代表他任务完成了。</p>"},{"id":"qa-67","title":"你对于AIcoding的理解是什么？","content":"<p>我之前看到了一个很有意思的说法：AI Coding 效果的决定性因素是模型能力，其次是工具，最后才是使用方法和范式</p><p>而<strong>代码仓库</strong>相较于前面说的几点，影响同样也非常的大：因为他<strong>是最大的上下文</strong>。所以说，同样的模型、同样的工具、同样的方法，只不过原始代码不一样，就可能导致代码生成质量千差万别。</p><p>约束很多是<strong>模型能力不足时的\"打补丁\"</strong>。当模型足够强，约束的可能会<strong>起反作用</strong>，就比如说前段时间GPT-6出来的时候，有人就发了文章说，在使用 GPT-6 的时候，应该把我们之前写的那些 System Prompt 进行缩减。</p><p>真正高杠杆的是<strong>输入给模型的代码质量本身</strong>。</p>"},{"id":"qa-68","title":"踩过的坑","content":"<strong>AI 跳过确认直接执行</strong><br><br>agent经常在我还没有确认试下方案时就直接开始执行了。这说明rules时不可靠的，还需要我们自己清楚步骤是什么，人工主导流程。<br><br><strong>没有耐心看 AI 的输出</strong><br><br>这是我自己最大的问题。不管是让 AI 出一个方案，还是看它执行完的返回，我经常扫两眼感觉差不多就点确认了，根本没有仔细看完。结果等到它跑完了才发现，原来它那个方案有问题，或者它理解错了我的意思。我的经验是：每次 AI 输出后，强迫自己从头到尾看完。不管它输出多长，方案也好、改完代码的反馈也好，别跳过。你省下来的那两分钟，后面可能要花两个小时去 debug。<br><br><strong>AI 偷摸换了方案不告诉你</strong><br><br>有时候让它实现一个方案，它写着写着发现那个方案有问题，就自己悄悄换成了另一种方案。但它不会主动告诉你它换了——你如果不仔细看它的执行输出，根本发现不了。所以必须养成习惯：每次 AI 执行完任务，仔细看它返回的内容，别跳过。不然你以为它在做 A，实际上它在做 B。<br><br><strong>我没有版本控制意识</strong><br><br>前两次尝试时没有养成\"修改前先 commit\"的习惯，导致 AI 改坏了代码后无法回退。"}],"hasChildren":true},{"id":"qa-69","title":"上下文管理","content":"","children":[{"id":"qa-70","title":"为什么需要上下文压缩？","content":"<ol><li><strong>上下文窗口有限</strong>：模型有最大 token 限制，超出后无法调用。</li><li><strong>成本和延迟增加</strong>：上下文越长，prefill 计算越重，token消耗和首 token 延迟越高。</li><li><strong>噪声干扰推理</strong>：无关内容越多，模型越容易关注错误信息、可能遗漏关键信息。</li></ol>"},{"id":"qa-71","title":"压缩策略？","content":"<ol><li><strong>摘要压缩</strong>：把长文本总结成短摘要。</li><li><strong>抽取式压缩</strong>：只保留原文中的关键句、关键词或 token。</li><li><strong>工具结果压缩</strong>：大输出落盘，只给模型摘要或关键字段。</li></ol><ol><li><strong>RAG 检索压缩</strong>：对召回文档进行重排、过滤和片段压缩。</li></ol><ol><li><strong>上下文隔离</strong>：用子 Agent 处理大规模探索，只返回压缩结论。</li></ol><ol><li><strong>状态栏显式化</strong>：把工具次数、TODO、错误等隐式状态压缩成结构化状态。</li></ol>"},{"id":"qa-72","title":"上下文压缩如何避免丢失信息？","content":"<p>首先就是压缩策略，在压缩过程中，我们可以通过<strong>结构化压缩</strong>，固定保留核心结论、约束条件、异常未解决项等方面。也就是说，提前明确本次压缩需保留的信息维度，避免模型压缩得过于笼统<br>其次是，在压缩过程中，我们可以先去除重复内容，再压缩过程信息，最后压缩历史结论。这种分层压缩模式，避免一次性压缩过度。</p><p>然后呢，就是我们要选择需要压缩哪些信息。重要信息可以不参与压缩，比如说用户要求、业务规则，或者一些比较重要且长度不是特别长的这类信息，就原样保留。</p><p>最后，针对大段日志（如执行 read 操作、工具返回的超长结果），可以保存到本地，上下文里只放摘要引用，在需要时再回查，而不是不可逆地删除。</p>"},{"id":"qa-73","title":"实战上下文维护策略","content":"实际工程中我会组合使用：最近几轮保留原文，中期历史维护结构化摘要，长期信息进入检索系统。<br><br>对于关键事实、用户约束和未完成事项应结构化保存，不能只依赖摘要。评测时除了压缩率，还要检查事实保留率、召回准确率和最终任务成功率，避免压缩后成本降低但效果变差。"},{"id":"qa-74","title":"OpenClaw、ClaudeCode、hermes的压缩策略","content":"<strong>OpenClaw 的压缩策略</strong>是当 token 余量到达一定值时自动触发压缩，先将内容分块，分块大小在原大小的 15% 到 40% 区间内再进行压缩。剪裁策略上保留头尾（头部的系统指令、初始任务，尾部的最新对话），将中间的工具调用、推理过程做摘要替换，头部还会根据时间和 KV Cache 边界进行智能压缩降低计费。<br><br><strong>HermesAgent 的压缩触发</strong>与 OpenClaw 不同，OpenClaw 使用绝对值触发，Hermes 使用相对比例阈值触发，相对更平衡，剪裁策略一致都是保留头尾中间做摘要替换。<br><br><strong>ClaudeCode 的三层压缩策略</strong>最精细：第一层不使用 LLM，对产生大量输出的工具（如 Bash、Read、Grep）进行截断或摘要，对 Edit、Write 的输出则完整保留，会基于 KV Cache 前缀不变减少花费的情况，根据时间和 KV Cache 边界进行智能压缩；第二层是会话记忆压缩，复用已生成的会话记忆摘要来替换原始历史消息，减少 LLM 调用成本；第三层才是 LLM 压缩，只有在前两者机制已经触发之后才会使用，要求模型先进行推演分析，之后剥离分析部分只保留纯净摘要，提升了逻辑连贯性。"}],"hasChildren":true},{"id":"qa-75","title":"RAG","content":"","children":[{"id":"qa-76","title":"RAG是什么？RAG解决的问题是什么？","content":"检索增强生成<br><br>大模型有三大问题：首先是知识的时效性，在训练好的那一刻就固定了；其次是专业性不足或者说不知道私有知识；最后是幻觉问题，他没有说不知道的能力，只能瞎编。<br><br>RAG 就是在调用大模型前，先从知识库里检索相关内容，塞到 Prompt 里，让大模型\"看着资料回答。可以让新知识随时入库解决知识时效性的问题；公司文档入库解决私有的问题；让LLM有参考内容，可溯源，解决幻觉的问题。"},{"id":"qa-77","title":"RAG 调优的基本思路是什么？","content":"<p>从全链路看，可以分为几个阶段优化：</p><ol><li><strong>数据处理、向量数据库的建立</strong></li></ol><ul><li>提升原始知识质量，包括清洗、去重、结构化处理。</li><li>选择合适的 Chunking 策略，如固定长度、句子段落章节切分、语义分块、父子切分</li><li>设置滑动窗口，避免关键信息被切断。</li><li>针对垂直领域微调 Embedding 模型，或为 chunk 生成摘要、关键词、假设问题，构建多索引结构。</li></ul><ol><li><strong>问题处理</strong></li></ol><ul><li>对用户 Query 做改写和增强，例如<strong>指代消解、省略补全、查询扩展、意图还原</strong></li><li>问题拆分</li><li><strong>假设性文档生成（HyDE）</strong>：让 LLM 先针对问题\"猜\"一个理想答案，用这个假想答案去检索，有时比原始问题效果更好。</li><li><strong>时空补全</strong>：\"苹果发布会新品价格\" → \"2025 年苹果公司 iPhone 17 系列发布会新品价格\"。</li></ul><ol><li><strong>检索</strong></li></ol><ul><li>使用混合检索，将语义检索和全文检索结合，例如 BM25 + 向量检索。</li><li>对多路召回结果可用 RRF 融合排序。</li><li>增加 Re-ranking，用更精细的模型重新评估 query-doc 相关性。</li></ul><ol><li><strong>生成（避免幻觉）</strong></li></ol><ul><li>优化 Prompt，明确要求模型严格基于召回内容回答，信息不足时说明无法回答，不要编造。</li><li>把tempreture、top-p等参数调低，让他回答的更严谨，避免跑偏。</li><li>让 LLM 输出结构化的结论，每个结论都必须填写来自哪条参考资料。</li><li>生成后再调用一次LLM核查或者使用RAGAS来做核查，来检查忠实性、答案相关性。</li></ul><ol><li><strong>评估与迭代</strong></li></ol><ul><li>在召回阶段，测评他的召回率、排序准确性</li><li>在生成阶段使用 RAGAS框架测评答案相关性、忠实度</li><li>在上线之后，看用户数据</li></ul><p>一句话总结：<strong>RAG 优化的核心不是单点调参，而是先判断问题发生在哪一层，再按“数据质量 → 索引结构 → Query 处理 → 检索排序 → 上下文压缩 → Prompt 生成 → 评估反馈”的链路系统优化。</strong></p>"},{"id":"qa-78","title":"什么是幻觉？如何避免幻觉？","content":"本质：模型在生成过程中，过度自信地“编造”了信息<br><br>原因：<br><br>● 大模型生成本质是根据概率输出，所以天然会偏<br>● Decoder 逐词生成，一旦某一步注意力权重偏了，后续全在这个错误上堆叠。并且向量没有“我不知道”这个状态，遇到知识盲区模型不会沉默，而是用最流畅的语法硬编一个错答案。<br><br>类型：<br><br>● 训练数据没有包含、检索没有召回到相关内容，导致LLM 没有可用的上下文，靠自身知识在编造答案<br>● 检索内容召回了但 LLM 没有严格遵循，在文档内容的基础上加了自己的推断。<br><br>解决：<br><br>● 针对没有找回到相关内容，首先是prompt约束，让他没有的就说不知道；其次是如果混合检索或者Rerank得出来的分数过低，就直接回复没有资料，而不是让大模型对着不相干的内容硬编。<br>● 针对LLM添加私货的情况，首先是可以把tempreture、top-p等参数调低，让他回答的更严谨，避免跑偏。其次是可以让 LLM 输出结构化的结论，每个结论都必须填写来自哪条参考资料。其次可以是生成后再调用一次LLM核查或者使用RAGAS来做核查，来检查忠实性、答案相关性。"},{"id":"qa-79","title":"怎么量化RAG的效果？","content":"检索层：是量化数据有没有找到<br><br>● 召回率（相关文档中有多少被成功检索出来了）、精确率（检索出来的文档中有多少是真正相关的）<br>&nbsp;&nbsp;&nbsp;&nbsp;◦ Hit\\@K： 前 k 个里有没有找到答案，有就算成功。 计算成功率<br>&nbsp;&nbsp;&nbsp;&nbsp;◦ MRR： 平均倒数排名。得分= 平均 (1 / 正确答案的排名)  ，也就是说正确答案越靠前，分数越高<br><br>生成层：是量化大模型忠实的程度<br><br>● RAGAs 框架（是利用LLM来判断）<br>&nbsp;&nbsp;&nbsp;&nbsp;◦ 忠实度(faithfulness)：答案与检索结果的相关性<br>&nbsp;&nbsp;&nbsp;&nbsp;◦ 答案相关性(Answer relevancy)：答案与问题的相关性<br>&nbsp;&nbsp;&nbsp;&nbsp;◦ 上下文精度(Context precision)：检索到的上下文中与问题相关的比例<br>&nbsp;&nbsp;&nbsp;&nbsp;◦ 上下文召回率(Context recall)：问题相关信息在检索上下文中被覆盖的比例<br><br>线上指标：<br><br>● 用户行为数据：点击率、点赞/点踩、会话时长。<br>● A/B 测试：任何改动（换重排模型、调 Prompt）都应通过 A/B 验证。<br>● 日志与看板：记录查询、检索 chunks 及分数、最终 Prompt、LLM 输出、用户反馈、各阶段耗时；可视化 P95/P99 延迟、Token 消耗。<br>● 人工抽样评测：定期人工打分。<br><br>在客服的场景中有<br><br>● 转人工率：知识库覆盖不足"}],"hasChildren":true},{"id":"qa-80","title":"Skill","content":"","children":[{"id":"qa-81","title":"Skill是啥？","content":"Skill 可以理解为解决特定任务的固定规则，是一种知识的沉淀，来实现策略的复用和传播。<br><br>整体采用<strong>渐进式披露机制</strong>，由三层组成，第一层元数据始终加载，包括名称和描述，让模型决定使用哪一个skill；第二层流程层，描述怎么做（流程、规则、约束条件，以及使用哪一个tool，加载哪一个材料）；第三层资源层，是进一步的按需加载，包括资源、示例、脚本、甚至其他的skill等。比如我在些一个skill的时候，为了避免这个skill包含不同任务的内容，我就会在这个skill中写明，当他遇到什么问题的时候，去访问某一个子skill。这样能够加少上下文浪费"},{"id":"qa-82","title":"skill的能力边界（局限）","content":"<p>我们需要对skill（或者说prompt、rules）的能力局限有一个认知：</p><p>在这里我对于我们想要通过skill解决的问题分一个类，包括固定流程型，灵活创造型</p><ul><li>针对固定任务型，我们总会遇到的问题是Agent不按照skill规范做事，也就是幻觉的问题。比如在实习过程中，我写了一个skilli交给Agent，希望他能在指定的时间@我，但是就是会偶尔出现没有呼叫我的情况。所以我们需要接受的是模型本身就是概率，我们是不可能依靠调整skill的格式、内容、明不明确来让他一定会做一件事情的（我们只能减少幻觉，不能消除幻觉）。</li></ul><ul><li>如果任务比较重要，我们只能通过外在的手段，比如workflow、hooks在代码层面来做确定性的限制，或者通过增加人工审核来做兜底，而不是一味的调整skill的内容。</li></ul><ul><li>针对灵活传造性的问题：比如，在我项目的plan能力优化中，我总是觉得他规划的流程不够好，然后我就给他举例，帮他给任务分类，哪一类该怎么做，但是随着限制增加，Agent反而变得呆滞，他丧失了视情况而定的能力，每一次输出都是在套模板，如果是前一种任务类型（固定），这更能体现他在遵守我的规则，这是一个好事，但是放在这一种任务类型，他完成任务的质量反而下降了。所以</li></ul><ul><li>我们要做的是精简skill，只保留我们最不能忍受的rule，其他的交给模型去发挥，这里的上限是由模型决定的，这种时候只有通过换模型来解决这个问题。</li></ul>"},{"id":"qa-83","title":"如何写好一个skill","content":"正常来说，我们写一个skill，大致分为三步<br><br>● 先写清楚description，来确保skill会被正确的触发<br>● 接着写一个最初的版本，<br>● 最后在使用中不断地迭代优化。<br><br><hr style=\"border:none;border-top:1px solid #e2e8f0;margin:18px 0;\"><br><br><strong>description要求：</strong><br><br>● 需要包含几方面：功能用途、触发场景<br>● 注意：不要过长<br><br><hr style=\"border:none;border-top:1px solid #e2e8f0;margin:18px 0;\"><br><br><strong>内容要求：</strong><br><br>● 内容（描述、步骤、规则）清晰明确<br>&nbsp;&nbsp;&nbsp;&nbsp;◦ 分段表达，强调重点<br>&nbsp;&nbsp;&nbsp;&nbsp;◦ 罗列步骤<br>&nbsp;&nbsp;&nbsp;&nbsp;◦ 明确输入输出<br>● 在需要Agent自由的地方，规则不要过于具体和僵化<br>● 举一些例子<br>● 遵循单一原则，一个skill只干一件事情<br>● 渐进式加载：针对一些不是只要进入这个skill就一定需要的内容，就可以放进目录，渐进式加载。比如当这个skill包含多个内容的时候，可以将不同内容分散成多个Skill，在这个skill内部触发。还比如一些资源，比如详细文档、代码示例等。<br><br><hr style=\"border:none;border-top:1px solid #e2e8f0;margin:18px 0;\"><br><br><strong>迭代优化：</strong><br><br>● 在迭代优化这里，我觉得需要注意的就是我们需要认清<strong>skill的能力边界。</strong><br>● 如果这个skill很重要，修改之后可以做一下回归测试，来防止改好了一个，改坏了另一个。"},{"id":"qa-84","title":"skill底层调用逻辑","content":"<p><strong>Skill 和 Tool 的调用逻辑不完全一样</strong>。</p><p><strong>Tool 通常是大模型 API 原生支持的</strong>。请求中会有一个独立的 <code>tools</code> 数组，里面存放工具名称、功能描述和参数 Schema。模型根据这些信息决定是否生成 tool call。</p><p><strong>而Skill 通常没有统一的</strong> <code>skills</code> 数组，在 Agent 启动时，需要我们设计的Agent Runtime扫描Skill仓库，一般是将 Skill 描述放进 <code>system</code> 或 <code>developer</code> 消息，告诉模型当前有哪些 Skill、分别适用于什么场景；同时在 <code>tools</code> 数组里提供一个类似 <code>read_skill</code> 或 <code>load_skill</code> 的工具。</p><p><strong>当模型判断当前任务需要某个 Skill 时</strong>，它不会直接执行 Skill，而是先生成一个工具调用请求，例如调用 <code>read_skill</code>，参数是 Skill 的名称。这个调用作为 <code>assistant</code> 的 tool call 返回给 Agent Runtime。</p><p>Runtime 收到调用后，根据 Skill 名称读取对应的完整说明文件，再把读取结果作为 <code>tool</code> 消息回传给模型。</p><p><strong>这就体现了 Skill 的渐进式披露</strong>：第一层只暴露 Skill 的名称和简介，用于判断是否匹配；第二层在选中后加载完整的执行说明；第三层只有真正执行时，才提供相关工具的参数 Schema、参考材料或其他资源。这样既节省上下文，也能减少无关信息对模型决策的干扰。</p>"}],"hasChildren":true},{"id":"qa-85","title":"Transformer","content":"","children":[{"id":"qa-86","title":"什么是 KV Cache？它为什么重要？","content":"Transformer 每生成一个 token，都要用当前 token 的 Query 去匹配前文所有 token 的 Key，并读取对应 Value。如果每次都从头计算历史 token 的 K/V，成本会随着上下文长度快速增长。<br><br>KV Cache 把已经算过的 Key/Value 缓存起来，后续生成只计算新增 token 的 K/V，从而显著降低延迟和成本。<br><br>对多轮工具调用的 Agent 来说，KV Cache 非常关键，因为 Agent 往往要几十轮调用模型，前缀重复计算成本巨大。"}],"hasChildren":true}] }
        };

        // ===== 状态变量 =====
        var currentQuestionId = 'hero-intro';
        var allButtons = [];

        // ===== DOM元素 =====
        var qaNav = document.getElementById('qaNav');
        var categoryTag = document.getElementById('categoryTag');
        var questionTitle = document.getElementById('questionTitle');
        var answerContent = document.getElementById('answerContent');
        var miniNav = document.getElementById('miniNav');

        // ===== 渲染导航（V3：全部展开，不折叠）=====
        function renderNav() {
            var html = '';
            allButtons = [];

            for (var categoryKey in qaData) {
                var category = qaData[categoryKey];
                html += '<div class="nav-section">';
                html += '<div class="section-title">' + category.label + '</div>';

                // 递归渲染items
                function renderItems(items, level, categoryKey, parentId) {
                    items.forEach(function(item) {
                        var activeClass = item.id === currentQuestionId ? ' active' : '';
                        var levelClass = 'level-' + level;

                        // V3：记录所有按钮用于键盘导航和滚动同步
                        allButtons.push(item.id);

                        var hasChildren = item.hasChildren && item.children && item.children.length > 0;

                        // 渲染当前项（父节点用占位span保持对齐）
                        html += '<button class="nav-btn ' + levelClass + activeClass + '" data-id="' + item.id + '" data-category="' + categoryKey + '">';
                        if (hasChildren || level > 1) {
                            html += '<span style="display: inline-block; width: 16px; margin-right: 4px;"></span>';
                        }
                        html += item.title;
                        html += '</button>';

                        // 如果有子节点，递归渲染（缩进更深）
                        if (hasChildren) {
                            renderItems(item.children, level + 1, categoryKey, item.id);
                        }
                    });
                }

                // 从 level-1 开始渲染
                renderItems(category.items, 1, categoryKey, null);

                html += '</div>';
            }

            qaNav.innerHTML = html;
        }

        // ===== 查找项目数据 =====
        function findItem(items, id) {
            for (var i = 0; i < items.length; i++) {
                if (items[i].id === id) return items[i];
                if (items[i].children) {
                    var found = findItem(items[i].children, id);
                    if (found) return found;
                }
            }
            return null;
        }

        // ===== 查找父节点 =====
        function findParent(items, id, parent) {
            for (var i = 0; i < items.length; i++) {
                if (items[i].id === id) return parent || items[i];
                if (items[i].children) {
                    var found = findParent(items[i].children, id, items[i]);
                    if (found) return found;
                }
            }
            return null;
        }

        // ===== V3：渲染全部问题的内容（答案连通，大问题之间有明显分隔标志） =====
        function renderAllContent() {
            var html = '';

            function renderBlock(item, level) {
                var tag = level === 0 ? 'h3' : (level === 1 ? 'h4' : 'h5');
                var cls = level > 0 ? 'qa-block child' : 'qa-block parent-block';
                html += '<div class="' + cls + '" id="' + item.id + '" data-id="' + item.id + '">';
                html += '<' + tag + '>' + item.title + '</' + tag + '>';
                if (item.content) {
                    html += '<div class="qa-body">' + item.content + '</div>';
                }
                html += '</div>';

                if (item.hasChildren && item.children) {
                    item.children.forEach(function(child) {
                        html += '<div class="qa-divider"></div>';
                        renderBlock(child, level + 1);
                    });
                }
            }

            for (var categoryKey in qaData) {
                var category = qaData[categoryKey];

                // 分类横幅
                html += '<div class="qa-category-banner" data-category="' + categoryKey + '">' + category.label + '</div>';

                category.items.forEach(function(item, idx) {
                    // 大问题之间的明显间隔
                    if (idx > 0) {
                        html += '<div class="qa-parent-divider"></div>';
                    }
                    renderBlock(item, 0);
                });
            }

            // 添加底部spacer，让最后一个问题可以滚到顶部
            html += '<div class="qa-bottom-spacer"></div>';

            answerContent.innerHTML = html;
        }

        // ===== 微型目录更新 =====
        function updateMiniNav() {
            var idx = allButtons.indexOf(currentQuestionId);
            if (idx === -1 || allButtons.length === 0) {
                miniNav.classList.remove('show');
                miniNav.innerHTML = '';
                return;
            }
            
            var range = 2; // 当前项上下各显示 2 个，共 5 项
            var html = '';
            
            // 前面的省略号
            if (idx - range > 0) {
                html += '<div class="mini-nav-item ellipsis">···</div>';
            }
            
            // 当前项上面的项（上面的先显示，所以 i 从大到小）
            for (var i = Math.max(0, idx - range); i < idx; i++) {
                var item = findItemById(allButtons[i]);
                if (item) {
                    html += '<div class="mini-nav-item dim" data-id="' + item.id + '">' + item.title + '</div>';
                }
            }
            
            // 当前项
            var currentItem = findItemById(allButtons[idx]);
            if (currentItem) {
                html += '<div class="mini-nav-item active" data-id="' + currentItem.id + '">' + currentItem.title + '</div>';
            }
            
            // 当前项下面的项
            for (var i = idx + 1; i <= Math.min(allButtons.length - 1, idx + range); i++) {
                var item = findItemById(allButtons[i]);
                if (item) {
                    html += '<div class="mini-nav-item dim" data-id="' + item.id + '">' + item.title + '</div>';
                }
            }
            
            // 后面的省略号
            if (idx + range < allButtons.length - 1) {
                html += '<div class="mini-nav-item ellipsis">···</div>';
            }
            
            miniNav.innerHTML = html;
            miniNav.classList.add('show');
        }

        // 微型目录点击导航
        miniNav.addEventListener('click', function(e) {
            var target = e.target.closest('.mini-nav-item');
            if (!target || !target.dataset.id || target.classList.contains('ellipsis')) return;
            
            var id = target.dataset.id;
            var categoryKey = null;
            
            for (var ck in qaData) {
                if (findParent(qaData[ck].items, id)) {
                    categoryKey = ck;
                    break;
                }
            }
            
            if (categoryKey) {
                var item = findItem(qaData[categoryKey].items, id);
                if (item) {
                    showAnswer(item, categoryKey, id);
                }
            }
        });

        // ===== V3：选中问题（右侧内容已全部连通，这里只做定位滚动） =====
        function showAnswer(item, categoryKey, scrollToId) {
            if (!item) return;

            // 清除待处理的滚动同步，防止快速切换时导航闪烁
            clearTimeout(scrollTimeout);

            isScrolling = true;

            currentQuestionId = scrollToId || item.id;

            // 更新分类标签
            var category = qaData[categoryKey];
            if (category) {
                categoryTag.textContent = category.label;
            }

            questionTitle.style.display = 'none';

            // 高亮左侧对应按钮
            var btns = qaNav.querySelectorAll('.nav-btn');
            btns.forEach(function(btn) {
                btn.classList.remove('active');
            });

            var targetBtn = qaNav.querySelector('[data-id="' + currentQuestionId + '"]');
            if (targetBtn) {
                targetBtn.classList.add('active');
            }

            // 右侧滚动到对应问题块
            setTimeout(function() {
                var contentArea = document.querySelector('.qa-content');
                var targetBlock = answerContent.querySelector('[data-id="' + currentQuestionId + '"]');
                if (targetBlock) {
                    contentArea.scrollTo({ top: targetBlock.offsetTop - 20, behavior: 'instant' });
                } else {
                    contentArea.scrollTo({ top: 0, behavior: 'instant' });
                }

                setTimeout(function() {
                    isScrolling = false;
                }, 500);
            }, 50);

            updateMiniNav();
        }

        // ===== 项目详情面板 =====
        var projectPanel = document.getElementById('projectPanel');
        var projectPanelIframe = document.getElementById('projectPanelIframe');
        var projectPanelTitle = document.getElementById('projectPanelTitle');
        var projectPanelClose = document.getElementById('projectPanelClose');
        var isProjectPanelOpen = false;

        function openProjectPanel(item) {
            if (!item || !item.projectSection) return;
            
            projectPanelIframe.src = item.projectSection;
            projectPanelTitle.textContent = item.title + ' - 项目详情';
            projectPanel.classList.add('open');
            isProjectPanelOpen = true;
        }

        function closeProjectPanel() {
            projectPanel.classList.remove('open');
            isProjectPanelOpen = false;
        }

        function toggleProjectPanel() {
            if (isProjectPanelOpen) {
                closeProjectPanel();
            } else {
                var item = findItemById(currentQuestionId);
                if (item && item.projectSection) {
                    openProjectPanel(item);
                }
            }
        }

        function findItemById(id) {
            for (var ck in qaData) {
                var item = findItem(qaData[ck].items, id);
                if (item) return item;
            }
            return null;
        }

        projectPanelClose.addEventListener('click', closeProjectPanel);

        // ===== 键盘导航 =====
        function handleKeyDown(e) {
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                toggleProjectPanel();
                return;
            }
            
            if (e.key === 'ArrowRight') {
                e.preventDefault();
                
                // 切换到下一个项目分类
                var categoryOrder = Object.keys(qaData);
                var currentCategory = null;
                for (var ck in qaData) {
                    var found = findParent(qaData[ck].items, currentQuestionId);
                    if (found) { currentCategory = ck; break; }
                }
                
                if (currentCategory) {
                    var currentIdx = categoryOrder.indexOf(currentCategory);
                    var nextIdx = (currentIdx + 1) % categoryOrder.length;
                    var nextCategory = categoryOrder[nextIdx];
                    var firstItem = qaData[nextCategory].items[0];
                    if (firstItem) {
                        if (isProjectPanelOpen) {
                            closeProjectPanel();
                        }
                        showAnswer(firstItem, nextCategory, firstItem.id);
                    }
                }
                return;
            }
            
            if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                e.preventDefault();
                
                lastKeyboardNav = Date.now();
                isScrolling = true;
                
                var currentIndex = allButtons.indexOf(currentQuestionId);
                var newIndex;
                
                if (e.key === 'ArrowDown') {
                    newIndex = (currentIndex + 1) % allButtons.length;
                } else {
                    newIndex = (currentIndex - 1 + allButtons.length) % allButtons.length;
                }
                
                var newId = allButtons[newIndex];
                var oldId = currentQuestionId;
                
                var oldParent = null;
                var newParent = null;
                var categoryKey = null;
                
                for (var ck in qaData) {
                    var op = findParent(qaData[ck].items, oldId);
                    var np = findParent(qaData[ck].items, newId);
                    if (op) oldParent = op;
                    if (np) { newParent = np; categoryKey = ck; }
                }
                
                if (oldParent && newParent && oldParent.id === newParent.id) {
                    currentQuestionId = newId;
                    
                    var btns = qaNav.querySelectorAll('.nav-btn');
                    btns.forEach(function(btn) {
                        btn.classList.remove('active');
                    });
                    
                    var targetBtn = qaNav.querySelector('[data-id="' + newId + '"]');
                    if (targetBtn) {
                        targetBtn.classList.add('active');
                    }
                    
                    var targetBlock = answerContent.querySelector('[data-id="' + newId + '"]');
                    if (targetBlock) {
                        document.querySelector('.qa-content').scrollTo({ 
                            top: targetBlock.offsetTop - 20, 
                            behavior: 'instant' 
                        });
                    }
                    
                    var btn = qaNav.querySelector('[data-id="' + newId + '"]');
                    if (btn) {
                        btn.scrollIntoView({ behavior: 'instant', block: 'center' });
                    }
                    
                    if (isProjectPanelOpen) {
                        var newItem = findItemById(newId);
                        if (newItem && newItem.projectSection) {
                            openProjectPanel(newItem);
                        } else {
                            closeProjectPanel();
                        }
                    }
                    
                    updateMiniNav();
                    
                    setTimeout(function() {
                        isScrolling = false;
                    }, 500);
                } else {
                    var item = findItem(qaData[categoryKey].items, newId);
                    if (item) {
                        showAnswer(item, categoryKey, newId);
                        
                        var btn = qaNav.querySelector('[data-id="' + newId + '"]');
                        if (btn) {
                            btn.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                        
                        if (isProjectPanelOpen) {
                            if (item && item.projectSection) {
                                openProjectPanel(item);
                            } else {
                                closeProjectPanel();
                            }
                        }
                    }
                }
            }
        }

        // Internal QA links from Obsidian.
        answerContent.addEventListener('click', function(e) {
            var link = e.target.closest('a[data-qa-target]');
            if (!link) return;
            var id = link.dataset.qaTarget;
            for (var key in qaData) {
                var target = findItem(qaData[key].items, id);
                if (target) { e.preventDefault(); showAnswer(target, key, id); return; }
            }
        });

        // ===== 事件监听 =====
        
        // 导航点击
        qaNav.addEventListener('click', function(e) {
            var btn = e.target.closest('.nav-btn');
            if (btn && btn.dataset.id) {
                var id = btn.dataset.id;
                var categoryKey = btn.dataset.category;
                
                var item = findItem(qaData[categoryKey].items, id);
                
                if (item) {
                    showAnswer(item, categoryKey, id);
                    
                    var newBtn = qaNav.querySelector('[data-id="' + id + '"]');
                    if (newBtn) {
                        newBtn.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                    
                    if (isProjectPanelOpen) {
                        if (item && item.projectSection) {
                            openProjectPanel(item);
                        } else {
                            closeProjectPanel();
                        }
                    }
                }
            }
        });

        // 键盘导航（绑定到整个文档）
        document.addEventListener('keydown', handleKeyDown);

        // ===== 滚动同步：内容滚动时左侧目录对应高亮 =====
        var isScrolling = false;
        var scrollTimeout = null;
        var lastKeyboardNav = 0;

        function handleContentScroll() {
            if (isScrolling) return;
            // 最近有键盘导航则跳过（600ms内）
            if (Date.now() - lastKeyboardNav < 600) return;
            
            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(function() {
                var contentArea = document.querySelector('.qa-content');
                var blocks = answerContent.querySelectorAll('.qa-block');
                var scrollTop = contentArea.scrollTop;
                var contentHeight = contentArea.clientHeight;
                
                var currentId = null;
                var currentTop = -Infinity;
                
                blocks.forEach(function(block) {
                    var blockTop = block.offsetTop;
                    var blockBottom = blockTop + block.offsetHeight;
                    
                    if (blockTop <= scrollTop + 50 && blockTop > currentTop) {
                        currentTop = blockTop;
                        currentId = block.dataset.id;
                    }
                });
                
                if (!currentId && blocks.length > 0) {
                    currentId = blocks[0].dataset.id;
                }
                
                if (currentId && currentId !== currentQuestionId) {
                    currentQuestionId = currentId;

                    var btns = qaNav.querySelectorAll('.nav-btn');
                    btns.forEach(function(btn) {
                        btn.classList.remove('active');
                    });

                    var targetBtn = qaNav.querySelector('[data-id="' + currentId + '"]');
                    if (targetBtn) {
                        targetBtn.classList.add('active');
                        // 左侧目录跟随滚动（不打扰用户点击）
                        targetBtn.scrollIntoView({ behavior: 'instant', block: 'nearest' });
                    }

                    // 同步分类标签
                    var categoryKey = null;
                    for (var ck in qaData) {
                        if (findParent(qaData[ck].items, currentId)) {
                            categoryKey = ck;
                            break;
                        }
                    }
                    if (categoryKey) {
                        categoryTag.textContent = qaData[categoryKey].label;
                    }

                    updateMiniNav();
                }
            }, 50);
        }

        // ===== 初始化 =====
        renderNav();
        renderAllContent();
        // 默认定位到 hero 分类第一个 item（自我介绍）
        var firstCategory = Object.keys(qaData)[0];
        showAnswer(qaData[firstCategory].items[0], firstCategory);

        var contentArea = document.querySelector('.qa-content');
        if (contentArea) {
            contentArea.addEventListener('scroll', handleContentScroll);
        }
    </script>

</body>
</html>
