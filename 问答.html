    <script>
        // ===== 问答数据（严格按照自我介绍页面的提示词内容）=====
        var qaData = {
            hero: {
                label: '🎤 自我介绍',
                items: [
                    { 
                        id: 'hero-intro', 
                        title: '自我介绍', 
                        content: '面试官您好，我是程愚瀚，电子科技大学软件工程专业 28 届本科生。我之前一直在学习 Java 后端开发的内容，然后从今年 2 月份开始学习 AI 相关的内容，做了多个相关项目，包括简历上的企业知识库RAG项目、可视化任务编排项目，也包括自己的一些探索学习项目，没有写在简历上的。<br><br>还有就是我平时也会记录我自己的一些经验，输出一些文章，还包括项目的一些详细设计内容。我都把他们放在了我的博客网站上，您在简历上可以看见这个链接。<br><br>关于 <strong>企业知识库RAG</strong> 项目，我熟悉 RAG 的完整流程、优化、测评，并针对其企业知识库的场景做了一些功能。我在 RAG 这个项目中学习到最关键的一点就是，不是看起来合理的优化策略就真的有效，要基于实际数据做评估。<br><br>然后是 <strong>可视化任务编排</strong> 或者说 workflow 这个项目，这是我花了最多心思的一个项目。我觉得在 AI 时代，发现问题和提供新解决方案的能力比单纯实现更重要。所以这个项目算是我的一个创新，初衷是解决 Agent 执行路径不可控（跳步遗漏）这个问题，然后自己设计了一套针对性的解决方案。我在这个项目中学到了包括prompt调优、Agent测评、token优化等知识。<br><br>我觉得我和这个岗位是比较适配的，我既拥有 Java 后端开发的经验，也熟悉 AI 相关的内容。我愿意不断地学习新知识，以满足这个岗位的需求。希望能和老师多多交流，也希望能有幸通过这次面试。',
                        hasChildren: true,
                        children: [
                            { id: 'hero-why-ai', title: '为什么转向学习AI？', content: '<strong>问：为什么转向学习AI？</strong><br><br>主要有四个原因，<br><br>第一点是 AI 是一个热点，这方面的岗位比较多。<br><br>第二点是就算从事后端开发，学习 AI 相关的内容也是必要的。<br><br>第三点是我觉得可能 Agent 开发上限会更高，如果说终有一天程序员都会被替代的话，我觉得 Agent 开发被替代的时间会比后端开发晚一点。<br><br>第四点是我的个人原因，我个人觉得 AI 方向会更有意思一点，每天都能接触到新内容。' },
                            { id: 'hero-backend-value', title: '你的后端经验在这个岗位有什么作用？', content: '<strong>问：你的后端经验在这个岗位有什么作用？</strong><br><br>我觉得主要可以分为两个方面。<br><br>第一点就是<strong>落地经验</strong>，Agent 除了 harness，还需要我们将其封装，后端经验可以帮我完成前后端联调、服务部署，完成 Agent 从原型到可运行服务的全流程。<br><br>然后就是<strong>稳定性与运维的思维</strong>，后端开发习惯考虑异常捕获、日志埋点、接口限流、监控告警，在开发 Agent 的时候，我就使用了三层异常处理机制来稳定我的 agent 任务执行，以及输出调用链路日志，避免线上 Agent 频繁报错、资源浪费，产出企业可用的稳定智能系统。<br><br>在我的项目中，也涉及到登录验证、并发文件上传的偏向后端的工作。<br><br>总的来说：Agent、Harness 的经验负责效果，后端工程负责落地，我同时具备两者能力。' }
                        ]
                    }
                ]
            },
            rag: {
                label: '📚 RAG 项目介绍',
                items: [
                    { id: 'rag-intro', title: 'RAG 项目介绍（三个阶段）', content: '关于 企业知识库RAG 项目，这个项目主要分为了三个阶段。<br><br>第一阶段主要围绕企业知识库这个场景，搭建 RAG 的基础链路，学习各种策略来提升召回率、降低幻觉率。同时基于企业知识库的实际需求，做了文档上传优化、权限控制等工程化的工作。<br><br>第二阶段是将 RAG 变成了一个 Agentic RAG，主要做了两件事情，一个是智能路由，尝试对简单问题进行分流，减少不必要的向量检索；另一个是针对不同任务设计针对性的检索策略，比如需要多次检索的问题、对比类的问题等。<br><br>前两个阶段我其实没有系统的测评过，所有的优化都是"看起来有提升就觉得有效"，但实际提升了多少我并不清楚。所以在阶段三，我系统性地搭建了测评体系，对检索和生成两个环节分别做了多轮消融实验，让每一次优化都能看到具体的数据变化。也就是在这里我发现了一个问题，学到的最关键的一点就是，不是看起来合理的优化策略就真的有效，要基于实际数据做评估。' },
                    { id: 'rag-basics', title: 'RAG 是什么？解决了什么问题？', hasChildren: true, content: 'RAG（检索增强生成）是为了解决大模型的三大问题：<br><br>首先是知识的时效性，在训练好的那一刻就固定了；其次是专业性不足或者说不知道私有知识；最后是幻觉问题，他没有说不知道的能力，只能瞎编。<br><br>RAG 就是在调用大模型前，先从知识库里检索相关内容，塞到 Prompt 里，让大模型"看着资料回答"。可以让新知识随时入库解决知识时效性的问题；公司文档入库解决私有的问题；让 LLM 有参考内容、可溯源，解决幻觉的问题。', children: [
                        { id: 'rag-graphrag', title: 'GraphRAG 是什么？', content: '主要是为了解决向量数据库 RAG 的两个问题：<strong>全局问题</strong>（比如技术路线是怎么演变的）和<strong>关系问题</strong>（公司A和公司B的间接关系是什么），不是靠检索出一两个分片就可以解决的。<br><br><strong>GraphRAG 的原理</strong>就是将文档切块，提取实体和关系，构建一个图，然后将联系紧密的地方分区，变成社区，最后生成社区摘要。在进行检索的时候，针对关系问题，就是提取实体，然后扫描一圈他的关系；针对全局问题，就是通过社区摘要，选低层级社区 → 答案更细致，但是成本更高，选高层级社区 → 答案更概括。<br><br><strong>GraphRAG 的问题</strong>就是 Token 消耗多（提取实体关系、生成摘要等）、增量更新难（导致社区的拆分重组）、社区的颗粒度难定（层级太高太笼统，层级太低社区数量爆炸，成本上升）。<br><br>于是又出现了 <strong>LightRAG</strong>，简单点说就是他没有了社区结构（来减少更新的复杂度），增加一层用下层的关系建立的图，用来解决全局问题，代价就是全局性问题没有 GraphRAG 那么厉害，别人的社区相当于是提前就生成好了答案。<br><br><strong>如何选择？</strong>（Token消耗、要求高低、更新频率）<br>● 如果是非结构化文本（比如新闻、客服场景），低成本场景，就使用向量 RAG。<br>● 如果是要求高、钱多，就使用 GraphRAG。<br>● 中间平衡的，且更新较为频繁的，就用 LightRAG。' }
                    ] },
                    { id: 'rag-recall-opt', title: '召回率优化：RAG 基础链路', projectSection: '项目/rag.html#recall-opt', hasChildren: true, content: 'RAG主要分为三部，包括上传、检索、排序，如果再加上生成就是四步。<br><br><strong>上传阶段</strong>，主要就是文件的解析和分块策略。我的项目中实现的是两级四层的语义分块策略，我也了解其他的策略，但成本都比较高。我还做了并发上传和异步的文件解析，来减少上传时间，提升用户体验。<br><br><strong>检索阶段</strong>，主要是问题改写、召回策略。问题改写在智能路由那里针对不同的问题有不同的改写策略。召回策略我使用的是Milvus数据库，BAAI/bge-m3的向量模型，使用稠密向量 + 稀疏向量作为召回策略。在这一步将 recall_cap@5 提升到了76.66%。<br><br><strong>排序阶段</strong>，主要有三种排序方式，包括根据两种召回按照权重排序，按照排名进行排序，以及通过Rerank重排序。最后选择的是Rerank重排序将recall_cap@5 最终提升到了81.2%。<br><br><strong>生成阶段</strong>，我主要通过Prompt优化、结构化输出约束、低分拒答、幻觉检测机制、调低temperature、top-p等五个策略来减低他的幻觉率。最后使用了RAGAS框架，对忠实度、答案相关性等参数进行了测评。', children: [
                        { id: 'rag-hallucination', title: '幻觉优化：5项降低幻觉策略', content: '<strong>本质</strong>：模型在生成过程中，过度自信地"编造"了信息。<br><br><strong>原因</strong>：大模型生成本质是根据概率输出，所以天然会偏；Decoder 逐词生成，一旦某一步注意力权重偏了，后续全在这个错误上堆叠；并且向量没有"我不知道"这个状态，遇到知识盲区模型不会沉默，而是用最流畅的语法硬编一个错答案。<br><br><strong>类型</strong>：<br>① 训练数据没有包含、检索没有召回到相关内容，导致 LLM 没有可用的上下文，靠自身知识在编造答案。<br>② 检索内容召回了但 LLM 没有严格遵循，在文档内容的基础上加了自己的推断。<br><br><strong>解决</strong>：<br><strong>针对没有找回到相关内容：</strong><br><strong>① Prompt 约束</strong> — 让他没有的就说不知道<br><br><strong>② 低分拒答</strong> — 如果混合检索或者 Rerank 得出来的分数过低，就直接回复没有资料，而不是让大模型对着不相干的内容硬编。<br><br><strong>针对 LLM 添加私货的情况：</strong><br><strong>③ 结构化输出</strong> — 让 LLM 输出结构化的结论，每个结论都必须填写来自哪条参考资料。<br><br><strong>④ RAGAS 核查</strong> — 生成后再调用一次 LLM 核查或者使用 RAGAS 来做核查，来检查忠实性、答案相关性。<br><br><strong>⑤ 参数调低</strong> — 把 temperature、top-p 等参数调低，让他回答的更严谨，避免跑偏。' },
                        { id: 'rag-ablation', title: '消融实验：recall_cap@5 逐级提升', content: '<div style="padding: 4px 10px; background: #eef2ff; border-radius: 8px; font-size: 13px; font-weight: 600; color: #4f46e5; margin-bottom: 8px;">测评数据来源</div><div style="font-size: 12px; color: #64748b; margin-bottom: 12px; line-height: 1.6;"><strong>检索阶段：</strong>基于 C-MTEB / T2Retrieval 数据集，测试数据库为 Milvus，原始语料库约 12w 条，分块后约 36w 条，使用前 2000 条 query 测试。核心指标为 recall_cap@5（cap=5）。<br><strong>生成阶段：</strong>基于 RAGAS 框架 + LLM-as-Judge 模式，对 200 条问答对自动评分，计算忠实度、答案相关性等指标。</div><div style="padding: 4px 10px; background: #eef2ff; border-radius: 8px; font-size: 13px; font-weight: 600; color: #4f46e5; margin-bottom: 8px;">📊 消融实验 — recall_cap@5 逐级提升</div><div style="background: #f8f9fc; border-radius: 10px; overflow: hidden; font-size: 12px;"><div style="display: grid; grid-template-columns: 2.5fr 1fr 1.5fr; padding: 8px 14px; background: #eef2ff; font-weight: 600; color: #4f46e5; border-bottom: 1px solid #e2e8f0;"><div>方案</div><div style="text-align: center;">recall_cap@5</div><div style="text-align: right;">较上一步提升</div></div><div style="display: grid; grid-template-columns: 2.5fr 1fr 1.5fr; padding: 7px 14px; border-bottom: 1px solid #f1f4f9; color: #94a3b8;"><div>bm25 纯关键词（参照）</div><div style="text-align: center;">61.50%</div><div style="text-align: right;">—</div></div><div style="display: grid; grid-template-columns: 2.5fr 1fr 1.5fr; padding: 7px 14px; border-bottom: 1px solid #f1f4f9;"><div>dense 纯向量检索（基线）</div><div style="text-align: center;"><strong>68.38%</strong></div><div style="text-align: right; color: #22c55e;">+6.88pp</div></div><div style="display: grid; grid-template-columns: 2.5fr 1fr 1.5fr; padding: 7px 14px; border-bottom: 1px solid #f1f4f9;"><div>+ BM25 双路混合（固定权重）</div><div style="text-align: center;"><strong>75.66%</strong></div><div style="text-align: right; color: #22c55e;">+7.28pp</div></div><div style="display: grid; grid-template-columns: 2.5fr 1fr 1.5fr; padding: 7px 14px; border-bottom: 1px solid #f1f4f9;"><div>BM25 → sparse（固定权重）</div><div style="text-align: center;"><strong>76.66%</strong></div><div style="text-align: right; color: #22c55e;">+1.00pp</div></div><div style="display: grid; grid-template-columns: 2.5fr 1fr 1.5fr; padding: 7px 14px; border-bottom: 1px solid #f1f4f9;"><div>+ RRF 融合方式优化</div><div style="text-align: center;"><strong>77.0%</strong></div><div style="text-align: right; color: #22c55e;">+0.34pp</div></div><div style="display: grid; grid-template-columns: 2.5fr 1fr 1.5fr; padding: 7px 14px; background: #eef2ff; font-weight: 700; color: #4f46e5;"><div>+ Rerank 重排（候选池 50）</div><div style="text-align: center;"><strong>81.2%</strong></div><div style="text-align: right; color: #22c55e;">+4.20pp</div></div></div>' },
                        { id: 'rag-eval-metrics', title: '检索阶段有哪些测评指标？', content: '除了 recall_cap@5，还测试了以下 6 项指标，共 7 项全面对比：<br><br><strong>recall_cap@5</strong> — 在前 5 个检索结果中，包含至少一个相关文档的比例。cap=5 表示只考虑前 5 个结果，衡量"能否在前 5 个中找到相关文档"。基线 68.4% → 最优 81.2%。<br><br><strong>recall@5</strong> — 在前 5 个检索结果中，召回的相关文档占所有相关文档的比例。衡量"召回覆盖率"。基线 56.5% → 最优 67.5%。<br><br><strong>ndcg@5</strong> — 归一化折损累计增益，相关文档排得越靠前分数越高。衡量"排序质量"。基线 71.6% → 最优 82.1%。<br><br><strong>mrr@5</strong> — 第一个相关文档出现位置的倒数均值。衡量"最快多久能找到第一个相关结果"。基线 85.6% → 最优 91.1%。<br><br><strong>precision@1</strong> — 第一个检索结果就是相关文档的概率。衡量"首条命中率"。基线 82.6% → 最优 88.2%。<br><br><strong>f1@5</strong> — 前 5 个结果的精确率和召回率的调和平均。衡量"精确率与召回率的平衡"。基线 47.9% → 最优 57.3%。<br><br><strong>端到端延迟</strong> — 从发起检索到拿到结果的总耗时。纯向量检索约 55ms，增加 Rerank 后约 360ms（+305ms，在可接受范围内）。' },
                        { id: 'rag-chunk-parent', title: '分片', hasChildren: true, content: '关于分片，主要有以下四种策略。', children: [
                            { id: 'rag-why-chunk', title: '为什么要分片？', content: '① Embedding 模型有输入长度限制，超长文本会被截断丢失信息。<br><br>② 长文档可能含多主题，整体向量化导致语义稀释。<br><br>③ 模型的输入有限，更精确的检索出相关信息可以节约空间。' },
                            { id: 'rag-chunk-strategy', title: '两层四级语义分块策略', content: '<div style="margin-bottom: 12px;"><div style="padding: 4px 10px; background: #eef2ff; border-radius: 8px; font-size: 13px; font-weight: 600; color: #4f46e5; margin-bottom: 10px;">我们的分片策略</div><div style="display: flex; flex-direction: column; gap: 8px;"><div style="padding: 10px 14px; background: #f8fafc; border-left: 3px solid #4f46e5; border-radius: 0 8px 8px 0;"><div style="font-size: 12px; font-weight: 600; color: #4f46e5; margin-bottom: 4px;">第一层 · 父块</div><div style="font-size: 13px; color: #475569; line-height: 1.6;">流式解析，达到 parentChunkSize（1MB） 自动切割，而不是把整个文章加载到内存再分块，避免 OOM。</div></div><div style="padding: 10px 14px; background: #f8fafc; border-left: 3px solid #7c3aed; border-radius: 0 8px 8px 0;"><div style="font-size: 12px; font-weight: 600; color: #7c3aed; margin-bottom: 4px;">第二层 · 子块（四级语义切割）</div><div style="font-size: 13px; color: #475569; line-height: 1.6;">将父块文本按 chunkSize 512 TOKEN 分割为更小的子切片</div><div style="font-size: 12px; color: #64748b; margin-top: 6px; line-height: 1.8;">① 优先按段落分割（\n\n）<br>② 段落过长按句子分割<br>③ 句子过长按词语分割（HanLP 分词，不拆词）<br>④ 最后兜底按字符分割<br>全程保证语义完整性，不会把完整句子、词语强行切断。</div></div><div style="padding: 10px 14px; background: #f0fdf4; border-left: 3px solid #10b981; border-radius: 0 8px 8px 0;"><div style="font-size: 12px; font-weight: 600; color: #059669; margin-bottom: 4px;">重叠分块</div><div style="font-size: 13px; color: #475569; line-height: 1.6;">每个分块的前后都有一部分"上下文冗余"，这样，embedding 模型在处理时就不会遗漏关键信息。</div></div></div></div>' },
                            { id: 'rag-other-chunk', title: '其他分片策略', content: '<strong>固定大小</strong><br><br><strong>按照层级</strong>（章节、内容），适合结构清晰的文档<br><br><strong>按照语义</strong><br><br><strong>特殊内容：</strong>代码（以函数为单位）、表格（要保留表头，可以转化为json）<br><br><strong>父子：</strong>检索用小分片，返回大分片<br><br><strong>语义补全：</strong>用LLM给每一个分片都生成一个上下文，代价就是成本高' },
                            { id: 'rag-code-chunk', title: '代码分片策略', content: '<div style="padding: 4px 10px; background: #eef2ff; border-radius: 8px; font-size: 13px; font-weight: 600; color: #4f46e5; margin-bottom: 10px;">代码分片策略</div><div style="padding: 12px 14px; background: #f8fafc; border-left: 3px solid #7c3aed; border-radius: 0 8px 8px 0; font-size: 13px; color: #334155; line-height: 1.7;">切片部分我用 JavaParser 类做 AST 分析，把源代码解析成语法树，然后遍历树节点提取类和方法的起止行号，再根据行号从原始代码中提取对应文本。<br><br>这种方式的优势在于能够保持代码的语义完整性，不会像按字符数分段那样切断方法或类，同时还能获取类名、方法名等元数据，为后续的代码检索和分析提供更丰富的信息。<br><br>类 chunk 只提取前 5 行作为类签名，不会把整个类的代码都塞进去。长方法目前没有做二次切分，实际项目中超过这个长度的方法比较少见，真要改善可以按内部逻辑块继续拆分。</div>' }
                        ] },
                        { id: 'rag-query-rewrite', title: '问题改写的5种策略', content: '<strong>① 简单改写</strong> — 处理口语化查询，消除代词补充隐含信息。<br><br><strong>② 问题拆解</strong> — 把多个问题拆解分开查询，还有对比类问题，A手机和B手机的性能对比，分开查询然后对比输出。<br><br><strong>③ HyDE</strong> — 让LLM生成假设答案，用答案向量去检索，因为答案和专业文档的用词更接近，语义匹配度更高。<br><br><strong>④ 多角度扩写</strong> — 把查询改写成3到5种表述分别检索后合并去重，覆盖不同作者的用词习惯。Query扩展补充相关关键词，扩大召回范围。<br><br><strong>⑤ 后退提问</strong> — 把具体问题抽象到通用原理层面，先检索背景知识建立上下文，再检索具体细节。' },
                    ] },
                    { id: 'rag-tech-detail', title: '检索核心技术详解', hasChildren: true, content: '', children: [
                        { id: 'rag-why-hybrid', title: '为什么要混合检索？', content: '<strong>关键词检索</strong>基于经典的倒排索引和词频统计，比如说 BM25 算法，将用户的查询拆解成关键词。精确匹配能力强，但无法理解语义。<br><br><strong>语义检索</strong>使用深度学习模型将查询和文档转换为向量，通过计算向量间的距离来衡量语义相似度。能理解同义、近义和上下文关系，但可能对精确的术语或数字不敏感。<br><br><strong>混合检索</strong>融合了关键词和语义检索策略，通常通过 RRF 等算法综合排序。<br><br>生产环境推荐采用混合检索的原因：单一检索策略有天然短板。用户的真实提问可能包含精确术语，也可能包含模糊的自然语言。混合检索能兼取两者之长，在不牺牲精度的情况下提升召回率，从而提高 RAG 系统的整体鲁棒性和准确率。' },
                        { id: 'rag-vector-principle', title: '向量检索的原理', content: '首先就是向量化，用 Embedding 模型将原始数据转化为向量，长文档转化为向量前需要分块，然后用嵌入模型将分好的块转化成向量。然后再是检索。<br><br><strong>长度</strong>代表内容的多少，信息量的大小<br><strong>角度</strong>代表语义<br><br>检索主要有三种方式：<br><br><strong>余弦相似度</strong>：计算两个向量的夹角，夹角越小，就越近。只看方向。<br><br><strong>欧式距离</strong>：计算两个向量的距离，距离越小，就越近。<br><br><strong>点积</strong>：计算两个向量方向一致性与长度的数值（l1*l2*cos），结果越大通常表示向量越相似。既看方向，又看长度。需要归一化，也就是长度差异特别大时，有的向量明明角度很大，但是可能被长度掩盖。<br><br>一般会使用余弦相似度，因为只看方向不看长度，更适合衡量语义相似度，不会受到文本长度的影响。' },
                        { id: 'rag-bm25-principle', title: 'BM25 原理', content: 'ES 默认的关键词相关性算法，根据词频、文档长度计算匹配度。会通过两个关键词控制匹配度：<br><br><strong>k1</strong>：越大，关键词频率对匹配度影响就越大<br><strong>b</strong>：越大，对长文档的惩罚就会越重（相同词语出现次数，文章越长，匹配度越低）' },
                        { id: 'rag-sparse-dense', title: '稀疏索引、稠密索引与关键词检索的区别', content: '<strong>稠密向量</strong>：把文本压缩成一个固定维度（如 2048 维）的浮点数向量，每个维度"均匀分摊"了语义信息。优势是能理解语义相似度，缺点是精确匹配差——搜"鲁迅"可能把"周树人"拉进来。<br><br><strong>稀疏向量</strong>：把文本映射成一个超高维（几万到几十万维）的向量，但大部分维度是 0，只有少数维度有值。每一个维度对应一个具体的词或 token，值表示这个词的重要性。既保留了关键词级别的精确匹配能力，又具备向量空间的距离计算能力。比 BM25 强的地方在于它可以用学习到的词权重，而不是纯统计的 IDF。<br><br><strong>关键词检索（BM25）</strong>：基于词频统计的精确匹配算法，只计算查询词与文档中相同词的匹配程度。速度快、可解释性强，但无法理解同义词、近义词等语义关系。<br><br>稀疏向量是稠密向量和关键词的一个"中间态"：下接关键词的精确性（每个维度对应具体词），上接稠密向量的语义理解（可做向量空间的距离计算）。这也是为什么双路召回用稠密 + 稀疏搭配效果最好：稠密负责语义泛化，稀疏负责精确命中。' },
                        { id: 'rag-rrf-principle', title: 'RRF 重排序', content: '在多路排序列表中，忽略不同排序方式的分数，只看排名的一种排序方式。<br><br><strong>好处</strong>：可以忽略不同排序方式的分数<br><strong>缺点</strong>：因为它忽略了分数，所以不包含分数信息。比如一个文档的相关性是100，第二名是1，但根据排名来说，一个是1/1，一个是1/2，相关性差距就不大。<br><br><strong>倒数打分</strong>：每个列表里，按位置算分 1/(k+rank)<br><strong>分数累加</strong>：同一文档在所有列表中的得分求和<br><strong>重排输出</strong>：按总分从高到低排序，得到融合结果<br><strong>k</strong>：平滑常数，默认 60；k越大，得分越平均，更重视"出现次数"而非"靠前程度"；k越小，第一名优势越强，适合强头部场景。' },
                        { id: 'rag-rerank-principle', title: 'ReRank 原理', content: '<strong>Embedding 模型（Bi-Encoder）</strong>：分别计算 Query 和文档的向量，然后对比相似度。好处是快、可以全库搜索。但是只看到了表面的匹配，没有做深度交互。<br><br><strong>Rerank 模型（Cross-Encoder）</strong>：它会把 Query 和文档拼接在一起，直接分析每个词之间的关系，而不是先生成向量再比较，让它能够更深度地理解 Query 和文档的关系。最后输出一个 0 到 1 之间的相关性分数。代价：速度慢，开销大。<br><br>所以一般是先用 embedding 搜广度，再用 Rerank 精细化。' }
                    ] },
                    { id: 'rag-smart-routing', title: '智能路由', projectSection: '项目/rag.html#router', content: '智能路由主要有两个目的，一方面是希望能过滤出不需要向量检索的问题，以此来减少查询API的调用和缩短流程时间；另一方面是通过对不同类型的问题制定针对性的检索策略，以此提高检索出来内容和回答的质量。<br><br>而要实现这两个目标，需要做两件事情，第一件是问题分类，第二件是问题处理。<br><br><strong>问题分类</strong>我设计了两层机制，包括通过关键词和正则匹配快速过滤简单（闲聊、纯计算）问题，通过模型来对问题进行分类。<br><br><strong>针对第一个目标</strong>，实际测评下来发现这个方案有三个问题，第一检索管线只占总耗时的一小部分，第二简单问题的占比也不高，第三如果通过规则进行问题分类的准确度较低，会让不是简单问题的问题跳过检索，而如果使用模型来进行分类，虽然可以提高分类的准确率，但是耗时增加大于缩短，得不偿失。所以让我意识到：优化不是看起来合理就行，需要有测试数据验证。<br><br><strong>针对第二个目标</strong>，不同类型查询的处理差异主要体现在检索策略、改写深度、上下文组装方式和生成策略四个维度。我举个例子：比如问题是产品A和B的区别是什么？就会执行两次独立检索分别放入A池和B池。单边缺失标注信息不足，禁止用模型知识填补空白。输出按维度对比表格。再比如假如问题是程愚瀚和鲁迅的关系是什么，就需要执行多次向量检索，每步基于前序结论动态构建新查询——程愚瀚是电子科大的学生，然后电子科大又有什么人才，然后就可以和鲁迅联系上了。在检索使用较低阈值（0.6）做宽召回。在生成时要求标注推理步骤。当然，开启之后耗时就会长很多。' },
                    { id: 'rag-lesson', title: '案例：智能路由的教训', content: '在智能路由这里，我原本想通过关键词匹配拦截简单问题来跳过向量检索，从而节约时间。但实际测评下来发现这个方案有三个问题，<br><br>第一，检索管线只占总耗时的一小部分；<br><br>第二，简单问题的占比也不高；<br><br>第三，如果通过规则进行问题分类的准确度较低，会让不是简单问题的问题跳过检索，而如果使用模型来进行分类，虽然可以提高分类的准确率，但是耗时增加大于缩短，得不偿失。<br><br>所以让我意识到：<strong>优化不是看起来合理就行，需要有测试数据验证。</strong><br><br><div style="padding: 4px 10px; background: #eef2ff; border-radius: 8px; font-size: 13px; font-weight: 600; color: #4f46e5; margin-bottom: 8px;">全链路延迟分解：跳过检索能省多少时间？</div><div style="font-size: 12px; color: #64748b; margin-bottom: 8px;">检索数据来自 RAG 消融实验，LLM 推理数据使用 Qwen2.5-7B-Instruct（int4 量化）在单卡上实测，输入 ~1K tokens，输出 ~200 tokens。</div><div style="display: flex; align-items: center; gap: 16px; margin-bottom: 10px; font-size: 12px;"><span style="padding: 3px 10px; border-radius: 6px; background: #f0fdf4; color: #059669; font-weight: 600;">检索端：BGE-m3 → Milvus HNSW → BGE-reranker-v2-m3，36w 条分块</span><span style="padding: 3px 10px; border-radius: 6px; background: #fef3c7; color: #d97706; font-weight: 600;">LLM 端：Qwen2.5-7B-Instruct（int4）</span></div><div style="background: #f8f9fc; border-radius: 10px; overflow: hidden; font-size: 12px;"><div style="display: grid; grid-template-columns: 2fr 1fr 1fr; padding: 8px 14px; background: #eef2ff; font-weight: 600; color: #4f46e5; border-bottom: 1px solid #e2e8f0;"><div>环节</div><div style="text-align: center;">耗时</div><div style="text-align: right;">占比</div></div><div style="display: grid; grid-template-columns: 2fr 1fr 1fr; padding: 7px 14px; border-bottom: 1px solid #f1f4f9; color: #64748b;"><div>纯向量检索</div><div style="text-align: center;">~55ms</div><div style="text-align: right;">~3%</div></div><div style="display: grid; grid-template-columns: 2fr 1fr 1fr; padding: 7px 14px; border-bottom: 1px solid #f1f4f9; color: #64748b;"><div>Rerank 重排</div><div style="text-align: center;">~300ms</div><div style="text-align: right;">~18%</div></div><div style="display: grid; grid-template-columns: 2fr 1fr 1fr; padding: 7px 14px; background: #f0fdf4; font-weight: 600; color: #059669; border-bottom: 1px solid #bbf7d0;"><div>检索管线合计</div><div style="text-align: center;">360ms</div><div style="text-align: right;">~22%</div></div><div style="display: grid; grid-template-columns: 2fr 1fr 1fr; padding: 7px 14px; border-bottom: 1px solid #f1f4f9; color: #64748b;"><div>LLM 推理（首 Token）</div><div style="text-align: center;">~350ms</div><div style="text-align: right;">~21%</div></div><div style="display: grid; grid-template-columns: 2fr 1fr 1fr; padding: 7px 14px; border-bottom: 1px solid #f1f4f9; color: #64748b;"><div>LLM 推理（后续 Token）</div><div style="text-align: center;">~950ms</div><div style="text-align: right;">~57%</div></div><div style="display: grid; grid-template-columns: 2fr 1fr 1fr; padding: 7px 14px; background: #fef3c7; font-weight: 600; color: #d97706; border-bottom: 1px solid #fcd34d;"><div>LLM 推理合计</div><div style="text-align: center;">~1,300ms</div><div style="text-align: right;">~78%</div></div><div style="display: grid; grid-template-columns: 2fr 1fr 1fr; padding: 8px 14px; background: #eef2ff; font-weight: 700; color: #4f46e5;"><div>总计</div><div style="text-align: center;">~1,660ms</div><div style="text-align: right;">100%</div></div></div>' },
                    { id: 'rag-permission', title: '权限控制', projectSection: '项目/rag.html#permission', content: '权限控制主要分为三个方面，登录控制、角色控制、标签控制。<br><br><strong>登录控制</strong>主要是通过Access Token作为核心通行证，有效期1小时，减小泄漏风险，通过Refresh Token作为长期凭证，有效期7天，泄漏也无法直接调用接口，可通过Redis快速吊销。<br><br><strong>角色控制</strong>则是通过Spring Security，校验用户角色是否有权访问当前接口。<br><br><strong>标签控制</strong>则是在访问文件时，通过查看用户标签和文章标签有交集，来判断用户是否有权访问文件。' },
                    { id: 'rag-mcp', title: 'MCP', projectSection: '项目/rag.html#mcp', content: '这里主要有两个部分，为什么要实现mcp化，和怎么实现mcp化。<br><br><strong>为什么要实现mcp化</strong>：公司员工比如程序员他在写代码的时候，会使用各类agent来辅助，所以实现mcp化之后，这些agent访问企业内部的私域知识时，就不需要员工手动检索，agent可以自己去检索。<br><br><strong>至于怎么将他MCP化</strong>其实非常简单，只需要项目中增加一个spring-ai-mcp-server-webmvc依赖即可。项目启动后自动暴露一个MCP端点，对外提供两个标准方法：listTools（告知客户端有哪些可用工具）和callTool（执行实际检索）。员工在Agent端的MCP配置文件中填入本服务的地址（如http://公司内网IP:8080/mcp），Agent就能自动发现searchKnowledge工具并调用。' },
                    { id: 'rag-upload', title: '上传优化', projectSection: '项目/rag.html#upload', content: '基于 Redis Bitmap 实现并发分片上传与状态追踪，结合 RocketMQ 异步解析解耦，大文件上传响应速度提升 <strong>65%</strong>。<br><br><div style="font-size: 14px; font-weight: 600; color: #4f46e5; margin-bottom: 8px;">流程</div><div style="font-size: 13px; color: #334155; line-height: 2; margin-bottom: 14px;">① 用户上传文件，前端按 5MB 分片上传<br>② 后端校验文件类型，存入 MinIO，Redis Bitmap 记录进度，持久化到 MySQL<br>③ 所有分片完成后，校验完整性，MinIO 合并文件，MySQL 更新状态<br>④ 发送 RocketMQ 消息，异步触发文档解析、向量化、写入 ES</div><div style="font-size: 14px; font-weight: 600; color: #4f46e5; margin-bottom: 8px;">策略</div><div style="font-size: 13px; color: #334155; line-height: 2;">① 幂等设计 — 针对重复上传，每次上传前查 Redis 标记<br>② 断点续传 — 针对网络中断，重传自动跳过已上传部分<br>③ 重试机制 — 针对单个分片上传失败，利用前端内置重试<br>④ 完整性校验 — 针对数据完整性，后端算 MD5 判断<br>⑤ 最终一致 — 针对合并成功但更新 MySQL 前宕机，定时任务核对自动修复</div>' }
                ]
            },
            workflow: {
                label: '🔧 Workflow 项目介绍',
                items: [
                    { id: 'wf-origin', title: '项目起源与方案对比', hasChildren: true, content: '关于这个项目，我主要从三个方面来讲：项目的起源、为什么我能够继续去做这个项目、可复用的经验。<br><br><strong>首先是项目起源</strong><br>我发现 Agent 在执行任务时经常会遇到跳步遗漏的问题。比如要求他进行 30 条测试，他只运行了 10 条；或者我要求他在输出之前必须先检查一下，结果他直接跳过了检查这一步。<br><br>我想到了两种方式来解决这个问题：Workflow 和 Hooks，最后选择了 Workflow。<br><br>一般的 Workflow 是由人来定义的，比如说扣子这种低代码平台。但是在这里，我将 plan 的工作交给了 Plan Agent 来完成。<br><br>所以最终的方案就是：Plan Agent 构建 DAG 图，将 DAG 图可视化展示给用户确认，再用执行引擎读取 DAG 图自动完成任务，确保规划了就一定会执行。<br><br><strong>然后是为什么我能够继续去做这个项目</strong><br>在做这个项目的过程中，我发现单纯说解决跳步遗漏这个问题，DAG 这个策略也没有那么好。但是这个项目还有一些其他的优点，比如可以使用到长链路任务的场景，解决目标偏移的问题；并且基于 DAG 图还可以实现更高效的并行执行策略、断点恢复、harness 这三个优点。<br><br><strong>最后是可复用的经验</strong><br>我在这个项目也学到了一些可以迁移的东西，比如如何调整 prompt 来优化 Agent 完成一个固定任务、Token 优化、异常治理、agent 测评等。', children: [
                        { id: 'wf-dag-limitations', title: 'DAG策略的局限性', content: 'DAG这个策略也没有那么好（具体不好在哪里）<br><br><strong>vs PAE（Plan and Execute）</strong><br>相较于PAE，DAG实现起来比较复杂。PAE在粗颗粒的任务上做的比较好（比如检索再生成），但是在细颗粒度的做的比较差，比如要求测试30条数据可能只测试了10条。<br><br><strong>vs Claude Code 的 Dynamic Workflow</strong><br>相较于claudecode的dynamic workflow来说，它是通过写JavaScript脚本来控制流程，所以相对来说，它的控制更加细致，会更加灵活。它想解决的问题是单个agent在长链路任务中懒惰、目标漂移的问题。' },
                    ] },
                    { id: 'wf-plan-opt', title: 'Plan 优化', projectSection: '项目/workflow.html#plan-opt', content: '想要Agent能够帮你执行好一件事情，主要就是三个策略：第一个是给他说清楚你要做什么，第二个是列举清楚规则是什么，第三个是举一些例子。这就是Prompt Engineering里面最基本的操作。<br><br>然后我为了保证这个DAG图它是没有环的，以及做一些其他的检测，我还设置了一个后置的校验层对它进行校验。<br><br>Prompt + 样本 + 校验做到位了，DAG质量有了基本保障。但模型会犯错，而且同样的错误可能反复出现——这就需要一套机制让Plan能力能自己不断变好。于是我就参考了Reflexion的思路，把每次执行失败的DAG当作负样本收集起来，自动分析失败原因，再把高频错误注入到Prompt和样本中。这样每次失败都变成一次教学，Plan的能力就随着使用次数越来越多，形成一个持续改进的闭环。' },
                    { id: 'wf-node-io', title: '节点输入输出（STAR法则）', projectSection: '项目/workflow.html#node-io', content: '关于这个问题我可以按照STAR法则来讲。<br><br><strong>Situation — 背景</strong>：节点之间有明确的先后依赖关系，后面的节点需要拿到前面节点的输出才能执行。原本的做法直接把子Agent的完整对话历史——包括system prompt、工具调用、工具返回结果、中间推理过程——全部传给下一个节点。然后就会遇到一个问题，多个节点串联后，下游Agent的context窗口很快被占满。<br><br><strong>Task — 目标</strong>：需要确定每个节点的输出应该包含什么内容、以什么格式输出，下游节点能拿到什么内容。来实现下游节点只拿到它真正需要的信息，控制上下文占用。<br><br><strong>Action — 方案与权衡</strong>：关于以什么格式输出这一点，我想出来了两个策略，第一个是压缩，把完整的对话历史压缩成摘要，再传给下一个节点。但问题在于压缩本身也是一次模型调用，会额外消耗token，而且压缩后的摘要可能会丢失细节。于是我选择了借鉴Dynamic Workflow的动态Schema格式化输出，在生成DAG图的时候，就确定好他需要输出什么内容。关于下游节点能拿到什么内容，不再是拿到这一条链路的全部输出，而是只拿到前一个节点的输出。<br><br><strong>Result — 效果</strong>：节点传递的信息量被控制在原始输出的10%到20%左右，也不再有上下文堆积的问题。' },
                    { id: 'wf-parallel', title: '双层并行执行引擎', projectSection: '项目/workflow.html#parallel', content: '第一层是通过图来实现并行，入度（In-Degree）指一个节点被多少条边指向，入度为0表示该节点没有任何前置依赖，可以直接执行。每执行一个节点就将其指向的节点的入度减一，于是就会有新的可执行节点出现。直到将所有节点执行完毕。<br><br>第二层是在agent的react模式，支持他同格式调用多个工具，比如同时读取多个文件。' },
                    { id: 'wf-rollback', title: '节点级断点恢复', projectSection: '项目/workflow.html#rollback', content: '设计了三张表来记录一个DAG图的执行。<br><br>一张表存DAG拓扑结构，第二张存每个节点的输入输出和状态，第三张存整次执行的全局汇总。（运行时的数据传递纯走内存HashMap，节点执行完顺手把快照同步写入MySQL，但不从数据库读。）<br><br>当断点继续触发时，就会从第二张表读出快照恢复到内存，结合第一张表重新解析的DAG图确定从哪个失败节点开始，跳过已成功的，接着往下跑。最后把第三张的状态从FAILED改回RUNNING，执行完再更新。' },
                    { id: 'wf-sub-agent', title: 'Sub Agent 分发执行', projectSection: '项目/workflow.html#sub-agent', content: '做出将子任务交给子agent是水到渠成的，首先是设计到并行执行，所以不能是一个agent。其次是我总结出了三个优点。<br><br>第一点是每个agent只需要负责他们自己的任务，放在长链路的任务中，可以解决目标偏移的问题；<br><br>第二点是我们可以针对每一个agent的身份，控制他们能调用的skill或者tool，来实现权限控制和提高他们调用skill、tool的正确率；<br><br>第三点是我们减少了默认的、不必要的skill、tool注入，也就减少了单次的token消耗。并且由于我对子agent之间的信息传递做了格式化输出，所以不会出现上下文堆积的情况，也就进一步减少了token消耗。' },
                    { id: 'wf-token-opt', title: 'Token 优化', projectSection: '项目/workflow.html#sub-agent', content: '包括三点。<br><br>第一点由于我们设计了不同类型的子agent，所以针对性的设计了他可以调用的skill、tool，也就减少了默认的、不必要的skill、tool注入，也就减少了单次的token消耗。<br><br>第二点是，由于我对子agent之间的信息传递做了格式化输出，抹去了大量的工具调用等信息，以此减少了下一个节点的输入。<br><br>第三点是，控制当前节点只会获取前一个节点的输出，而不是这一条链路的输出，所以不会出现上下文堆积，也就是后一个节点的上下文包含前面所有节点的输出的情况，也就进一步减少了token消耗。' },
                    { id: 'wf-exception', title: '异常治理', projectSection: '项目/workflow.html#exception', content: '因为这个项目采用固定DAG执行，相比PAE架构可根据前一步结果动态修改下一步计划的方式，丧失了执行中调整流程的能力。而三级异常治理就是为了弥补这一限制而设计的。<br><br>首先是在顶层设计了while循环来处理重试，在第二层设计了超时策略，在最底层设计了异常捕获，又分为三种处理方式：<br><br>① 直接中断 — 关键节点失败后整体进入失败状态。适用于支付、扣款、核心写操作等。<br><br>② 错误码策略 — 按预配置的错误码或默认值继续执行。适用于辅助查询、非核心推荐等。<br><br>③ 失败条件分支策略 — 引导到异常处理分支，用于告警、补偿、回滚或特定兜底逻辑。' },
                    { id: 'wf-condition', title: '条件分支路由', projectSection: '项目/workflow.html#exception', content: '条件分支路由是为了解决有些情况Plan Agent不知道这一步的结果是什么，遇到不同的结果可能会有不同的路径。但这里就遇到一个问题：我们的并行策略是把一排节点拿来并行执行，但遇到条件分支的话，难道要同时执行两个分支吗？于是我就设计了condition字段——只有匹配条件的边才会被激活，来解决这个问题。' },
                    { id: 'wf-eval', title: 'Agent 测评', projectSection: '项目/workflow.html#eval', content: '<strong>测什么</strong><br>我觉得首先是要明确测什么，包括两个方面，结果和过程。结果维度包括需求完成度、耗时、Token消耗，过程维度包括工具调用链、无效ReAct循环、异常处理等。然后针对不同的Agent场景也需要有不同的测评，比如我们这里的DAG构建正确率，或者说CodingAgent的代码质量等。<br><br><strong>怎么测</strong><br>然后是怎么测，主要分为了三个方面，包括设计测评集、设计评分器、选择测试方法。<br><br><strong>测评集的设计</strong><br>首先是测评集的设计，要注意质量比数量更重要。我这里因为人手的原因，我是先让Agent帮我设计了一批样本，覆盖常规流程、并行分支、复杂拓扑、边界样本和对抗样本，我再去挑选和修改。<br><br><strong>设计评分器</strong><br>然后是设计评分器，包括两种，确定性评分器和LLM-as-Judge。非常清楚的可以看出来当需要理解的部分就需要调用大模型，其他时候更适合使用确定性评分器，因为大模型的评分不稳定，使用确定性评分器能够更直观的看出来改进。比如在测试DAG图构建率时，就是使用的确定性评分器，通过查看有没有环的出现来得出分数。<br><br><strong>测评方法</strong><br>最后就是选择测评方法，比如基准测试（在标准数据集上跑分，与基线版本或竞品横向对比）、回归测试、AB测试等。我觉得在agent测试中，回归测试比较重要。因为对prompt的修改指不定就破坏了已有能力，所以需要做回归测试去确保新改动不破坏已有能力。' }
                ]
            },
            concepts: {
                label: '💡 通用概念',
                items: [
                    { id: 'concept-agent', title: 'Agent', hasChildren: true, content: '', children: [
                        { id: 'concept-agent-what', title: 'Agent 是啥？和普通的 LLM 有什么区别？', content: 'Agent 除了 LLM，还包括了记忆、工具模块。让他拥有了记忆和实践能力，成为了能够真正执行任务的工具，而不只是回答问题。<br><br>然后再通过 ReAct、Plan-and-Execute、Reflection 等策略，让 agent 拥有反思总结、多步骤的能力，就可以让他任务执行的更好。' },
                        { id: 'concept-agent-paradigms', title: 'Agent 有哪些设计范式？如何选择？', content: '<strong>ReAct</strong> 就是推理、行动、观察的循环，推理这一轮我需要干什么，行动获取结果，再根据结果思考是在进行下一轮还是结束循环返回结果。问题是他只能看见眼前，处理特别复杂的、需要全局规划的任务时，容易在中间迷失方向。<br><br><strong>Plan-and-Execute</strong> 是先制定计划-执行-再加上动态判断（可能提前结束或者重新规划）。<br><br><strong>Reflexion</strong> 是在完成当前任务之后，反思做的好不好，如果评估不通过，就重试或者换一种策略。他还有一种变体，就是会记录错题本。记录下这次失败的原因和改进建议，然后把这段总结作为额外的上下文传给下一次尝试。<br><br><strong>如何选择？</strong> 如果是一个任务，就适合使用 ReAct；如果是有多个步骤，链条比较长的任务就适合使用 PAE。三种设计范式可以混合使用，用 Plan-and-Execute 做整体规划，每个步骤内部用 ReAct 来执行。如果要求比较高需要迭代的，就再加上 Reflexion。' },
                        { id: 'concept-agent-multi', title: 'Multi-Agent（多智能体）协作范式有哪几种典型架构模式？', content: '四种标准架构：主从、流水线、对等、混合。<br><br><strong>主从架构</strong> — 1 个调度主 Agent + N 个专业子 Agent。主 Agent 拆解总任务、分配子任务、汇总所有子 Agent 结果。子 Agent 只负责单一细分能力，无全局决策权。优势是管控简单、输出统一；劣势是主 Agent 单点瓶颈。<br><br><strong>流水线架构</strong> — Agent 按固定顺序串联，前一个输出作为后一个输入。Agent1 输出→Agent2 接收处理→Agent3 收尾。优势是适合线性工序任务；劣势是某一环失败整体阻塞，无并行能力。<br><br><strong>对等架构（去中心化）</strong> — 所有 Agent 地位平等，通过 A2A 互相通信协商、自主分工，无统一指挥官。各 Agent 自主认领擅长任务，互相交换信息，冲突自主协商。优势是分布式、可并行、容错高；劣势是交互逻辑复杂，容易出现分工混乱。案例：多个专业 AI 专家共同完成一份行业报告。<br><br><strong>混合架构</strong> — 融合以上两种及以上模式，大型项目主流方案。比如主 Agent 做任务拆分（主从），拆分后的子任务分组走流水线并行处理。' },
                        { id: 'concept-agent-boundary', title: '单 Agent 范式和多 Agent 范式的边界在哪里？', content: '<strong>单 Agent：</strong>一个大模型实例承载全部能力，内部靠提示词、记忆、工具完成所有子步骤，所有决策由同一个模型做出。适合任务复杂度低、能力维度单一、子任务无强专业隔离的场景。<br><br><strong>多 Agent：</strong>多个独立 Agent 各司其职，每个 Agent 专精一类能力，通过 A2A 互通信息，任务拆解到不同智能体分工完成。适合任务跨多领域、能力互相冲突、单一模型无法兼顾所有专业逻辑的场景。' }
                    ] },
                    { id: 'concept-mcp', title: 'MCP 是什么？', content: '<strong>是什么？</strong><br>我理解的 MCP 它就是一个 agent 到 tool 之间的一个协议，它能够让 agent 调用这个 tool，避免每一个 agent 对接每接一个新工具都要单独写适配代码。底层基于 JSON-RPC 2.0 实现有状态双向通信，支持本地 stdio、HTTP-SSE、流式 HTTP 多种传输方式。<br><br><strong>协议有什么组成？</strong><br>有三部分：Host、Client、Server。Host 就是支持 MCP 协议的应用程序，也就是我们配置大模型的地方。Client 在 Host 内部运行，负责与 MCP Server 建立连接。Server 可以理解为一个软件，我们将他提供的原子性的能力称之为 Tool，一个 Server 可以提供多个 Tool。<br><br><strong>怎么使用？</strong><br>当我们配置并启动我们需要的 Server 后，会获取其包含的 Tool 列表，用户提问后，Host 将问题与 Tool 列表一同传给模型；模型判断需调用的 Tool 及参数，反馈给 Client；Client 转发调用请求至 MCP Server，Server 执行 Tool 后返回结果；Client 将结果回传给模型，模型整理后给出最终答案并反馈给用户。<br><br><strong>项目体现</strong><br>然后包括我的这个 RAG 项目，我也把它实现成了一个 MCP。我当时想象的场景就是说，我是一个程序员，我肯定不会使用我公司开发的 RAG 来帮我执行一些任务。但是我使用其他如 Claude Code 来执行任务的时候，我又需要获取我公司的资源，怎么办？那我可能就通过公司的 RAG 的 MCP 的一个工具来获取一些资料，然后让 agent 能够更好的帮我完成这个任务。' },
                    { id: 'concept-function-calling', title: 'FunctionCalling 是什么？（和 MCP 的关系是什么）', hasChildren: true, content: 'Function Calling 主要包括四部分：大模型主动识别需求（让模型知道什么时候该输出普通文本，什么时候该输出工具调用 JSON）、生成结构化参数、调用外部工具（解析返回的函数名和参数，调用真实接口 / 本地函数）、拿到结果再整合回答。让 Agent 有了调用外部工具的能力。<br><br><strong>Function Calling 和 MCP 的关系</strong><br>Function Calling 解决的是"模型怎么调用工具"的问题，是模型能力层面的；MCP 解决的是"工具怎么被模型发现和调用"的问题，是协议层面的。两者是互补关系：Function Calling 让模型能调用工具，MCP 让工具能被模型发现和调用。', children: [
                        { id: 'concept-format-output', title: '如何让大模型格式化输出？', content: '有三种方式：<br><br><strong>① 原始阶段（Prompt）</strong>：通过 prompt 写清楚 JSON Schema 的例子，但是 prompt 的约束不稳定。<br><br><strong>② 指令微调 SFT</strong>：在 SFT 阶段喂了大量"问题-答案"对，让模型学会识别什么时候需要调用工具、按固定格式输出函数名+参数、不乱说废话，直接吐结构化数据。<br><br><strong>③ 输出时的强约束机制</strong>：模型是根据概率生成字符，通过微调仍然可能输出不符合规范的内容，这时候就可以通过 JSON Schema、正则（用来匹配字符串格式的专用语法）、状态机过滤，将不符合规范的字符概率设置为 0。' },
                        { id: 'concept-constrained-decoding', title: '格式化输出 2.0（约束解码）', content: '约束解码：大模型生成文本是一个 token 一个 token 往外蹦的。正常情况下，每一步模型会算出一个概率分布，然后从所有 token 里选一个。但结构化输出做了一件事：在每一步生成之前，先根据 JSON Schema 算出一个"当前合法的 token 集合"，然后把不合法的 token 的概率全部置为零，模型只能在合法集合里选。<br><br>但是好像国产模型不支持，而是通过微调实现的。我检索了一下说是成本问题：约束解码需要在模型推理的时候，每生成一个 token 都跑一遍状态机，检查当前 token 是否合法。这个状态机本身不贵，但它会破坏推理的批处理（batching）。大模型厂商为了降成本，会把多个用户的请求拼成一个 batch 一起算，这样 GPU 利用率高。但约束解码意味着每个请求的合法 token 集合不一样——你的 Schema 是 {name, age}，别人的 Schema 是 {city, temperature}，两个请求的合法 token 集合不同，就没法拼在一起算了。要么只能单独算（降低吞吐），要么用更复杂的调度策略（增加工程成本）。' }
                    ] },
                    { id: 'concept-skill', title: 'Skill 是什么？（和 MCP 的关系）', content: '<strong>Skill 是什么？</strong><br>Skill 可以理解为解决特定任务的固定规则，是一种知识的沉淀，来实现策略的复用和传播。<br><br><strong>有什么组成？</strong><br>整体采用渐进式披露机制，由三层组成，第一层元数据始终加载，包括名称和描述，让模型决定使用哪一个 skill；第二层流程层，描述怎么做（流程、规则、约束条件，以及使用哪一个 tool，加载哪一个材料）；第三层资源层，是进一步的按需加载，包括资源、示例、脚本、甚至其他的 skill 等。比如我在写一个 skill 的时候，为了避免这个 skill 包含不同任务的内容，我就会在这个 skill 中写明，当他遇到什么问题的时候，去访问某一个子 skill。这样能够减少上下文浪费。<br><br><strong>和 System Prompt 的区别是什么？</strong><br>● System Prompt 是一段静态的全局的文本指令，它只影响 LLM 的生成风格、角色设定、行为边界等，没有执行逻辑，无法调用外部系统或改变状态。<br>● Skill 是一个可执行的、结构化的能力单元，包含元数据、输入参数定义、状态管理等。Skill 能被 Agent 动态调度、组合、复用。<br><br><strong>Skill 冲突了怎么解决？</strong><br>假如说用户的需求很模糊，这个时候同时命中多个 Skill 那会造成冲突，主要有四种解决方式：<br><br>① LLM 二次决策 — 将用户输入 + 候选 Skill 列表一起给 LLM，要求输出最匹配的一个，或者输出"需要澄清"。<br><br>② 优先级 + 置信度打分 — 给每个 Skill 预设一个 priority，数值越小优先级越高。同时使用 embedding 相似度得出匹配分。取分数最高且 priority 最小的。<br><br>③ 定义互斥规则 — 定义某些 Skill 不能同时匹配，比如说 send_email 和 send_sms 被同一句话触发时，配置优先走 email。<br><br>④ 用户历史偏好 — 记录用户最近使用过的 Skill，在冲突时优先匹配历史 Skill。' },
                    { id: 'concept-harness', title: 'Harness Engineering 是什么？', content: 'Harness 这个概念本质上是在回答一个问题：为什么同样一个模型，在不同的产品里表现天差地别？答案就是 Agent 等于模型加 Harness，模型提供的是智能引擎，而 Harness 是让这份智能真正落地的那套系统。<br><br>一个裸模型本质上只是一个文本输入输出的函数，它记不住上下文、执行不了代码、访问不了实时数据。Harness 就是围绕这个函数搭建的一整套基础设施，包括文件系统让它能持久化存储、沙箱让它能安全执行代码、记忆系统让它能跨会话学习、压缩机制防止它在长任务中性能衰减。<br><br>这些东西的设计原则是从期望的 Agent 行为逆向推导的，你想要 Agent 能做什么，就在 Harness 里给它搭什么能力。所以 Harness Engineering 本质上是一种系统工程思维，它承认模型的智能是不完美的，但通过设计好的环境、工具和反馈循环，可以让任何模型在特定任务上发挥出远超其本身的能力。' },
                    { id: 'concept-loop', title: 'Loop Engineering', content: 'Loop Engineering 到底改变了什么？之前的工作模式是我写 prompt、Agent 干活、我检查结果、再写下一个 prompt，我才是那个驱动循环的人。有了 Loop Engineering 之后，我设计好目标、评估标准和工具集，然后一个循环系统自动去驱动 Agent，我只在最后看结果。<br><br>但这里有一个关键的前提：Loop Engineering 真正适用的场景，是那些停止条件可以被明确验证的任务。比如"让所有测试通过"或者"构建成功"，这些条件 Agent 自己能判断。但对于"做一个好的 PPT"这种任务，什么是好本身就很模糊，你还是需要在循环中介入判断。所以 Loop Engineering 解决的是重复执行的自动化，而不是判断好坏的自动化，这个边界很重要。<br><br>Loop Engineering 和 Reflection 的对比：Reflection 是 Agent 内部的一次推理过程中自我反思的机制，本质上是模型在生成回答之前的内部循环。而 Loop Engineering 完全不同，它是外部的、跨多次 Agent 调用的编排框架，解决的是让 Agent 能够稳定地长时间自主运行的问题，比如无限循环、任务中断、资源超额消耗这些在实际落地中才会遇到的坑。所以它和 Reflection 不在一个层次上，Reflection 解决的是单次推理的质量，Loop Engineering 解决的是整个任务执行的可靠性。' },
                    { id: 'concept-spec', title: 'SpecCoding（SDD规范驱动开发）', hasChildren: true, content: '规范驱动开发，也就是先写规格文档（包括需求分析、技术方案、各种 rule）然后再生成代码的开发模式。其实我们想一下也知道，我们想让人完成一个项目需要什么，那让 agent 完成一个项目也就需要什么。如果像 vibecoding 一样，只告诉他一个很模糊的需求，那就很难得到你想要的结果。<br><br>我觉得规格文档（也就是所有不属于代码的文档）应该划分为两部分：<br><br><strong>第一部分</strong>是可以所有项目共享的 rule 和模板，这一部分也就是我们可以不断迭代浓缩。我之前看过得物发的一个文档，里面详细规划了三层 rule，包括基础层（代码的格式、注释的规范）、模块层（代码的架构规范）、流程层（开发流程等各种流程），模板则是指第二部分的规范。<br><br><strong>第二部分</strong>是和这个项目内容有关的，比如需求分析、变更记录等。agent 或者如果是在企业多人开发的时候，就可以通过这些记录对这个项目有一个大概的感知，而不是去全部扫描一遍代码。我在 spec coding 的时候发现，把这些详细的记录落到文件，会极大的增强我对代码的自信心和了解程度，不像我在 vibecoding 的时候，跟开盲盒一样，也不清楚哪一个类是干什么的。', children: [
                        { id: 'concept-spec-what', title: '是什么', content: '规范驱动开发，也就是先写规格文档（包括需求分析、技术方案、各种 rule）然后再生成代码的开发模式。其实我们想一下也知道，我们想让人完成一个项目需要什么，那让 agent 完成一个项目也就需要什么。如果像 vibecoding 一样，只告诉他一个很模糊的需求，那就很难得到你想要的结果。<br><br>我觉得规格文档（也就是所有不属于代码的文档）应该划分为两部分：<br><br><strong>第一部分</strong>是可以所有项目共享的 rule 和模板，这一部分也就是我们可以不断迭代浓缩。我之前看过得物发的一个文档，里面详细规划了三层 rule，包括基础层（代码的格式、注释的规范）、模块层（代码的架构规范）、流程层（开发流程等各种流程），模板则是指第二部分的规范。<br><br><strong>第二部分</strong>是和这个项目内容有关的，比如需求分析、变更记录等。agent 或者如果是在企业多人开发的时候，就可以通过这些记录对这个项目有一个大概的感知，而不是去全部扫描一遍代码。我在 spec coding 的时候发现，把这些详细的记录落到文件，会极大的增强我对代码的自信心和了解程度，不像我在 vibecoding 的时候，跟开盲盒一样，也不清楚哪一个类是干什么的。' },
                        { id: 'concept-spec-experience', title: '我的经验', content: '最原始的阶段就是用豆包生成代码片段，手动复制到项目里。<br><br>然后是 <strong>vibecoding</strong>，这个阶段就像开盲盒，不知道应该怎么利用它帮我开发代码，就会导致代码有问题不知道怎么排查、上下文腐烂、版本管理没做好这些问题，结局就是重开。<br><br>第三个阶段就是依赖 <strong>superpowers 这一类 skill</strong>，我寄希望于它，希望它能带领我去走完需求分析、记录日志等流程，但实际上它做不到这些事情，所以我就学到规范驱动开发的流程需要内化进我们的大脑，而不是去依赖一个 skill。<br><br>在阶段四，我在这个阶段系统性的看了很多大佬分享的经验，学到了如何初始化项目格式（需求文档、修改日志、技术方案等）、如何建立规则体系、要先写文档，再让 AI 按照文档去执行等经验。' },
                        { id: 'concept-spec-pitfalls', title: '踩过的坑', content: '<strong>AI 跳过确认直接执行</strong> — agent 经常在我还没有确认实施方案时就直接开始执行了。这说明 rules 是不可靠的，还需要我们自己清楚步骤是什么，人工主导流程。<br><br><strong>没有耐心看 AI 的输出</strong> — 这是我自己最大的问题。不管是让 AI 出一个方案，还是看它执行完的返回，我经常扫两眼感觉差不多就点确认了，根本没有仔细看完。结果等到它跑完了才发现，原来它那个方案有问题，或者它理解错了我的意思。我的经验是：每次 AI 输出后，强迫自己从头到尾看完。不管它输出多长，方案也好、改完代码的反馈也好，别跳过。你省下来的那两分钟，后面可能要花两个小时去 debug。<br><br><strong>AI 偷摸换了方案不告诉你</strong> — 有时候让它实现一个方案，它写着写着发现那个方案有问题，就自己悄悄换成了另一种方案。但它不会主动告诉你它换了——你如果不仔细看它的执行输出，根本发现不了。所以必须养成习惯：每次 AI 执行完任务，仔细看它返回的内容，别跳过。不然你以为它在做 A，实际上它在做 B。<br><br><strong>没有版本控制意识</strong> — 前两次尝试时没有养成"修改前先 commit"的习惯，导致 AI 改坏了代码后无法回退。' },
                        { id: 'concept-spec-workflow', title: '我的工作流', content: '首先就是要定义好项目架构，规格文档需要包含需求分析、整体技术方案、变更日志、规则体系、文档模板等。<br><br>然后就是头脑风暴确定整体需求、逐个确认设计文档、分步执行 + 强制记录、测试验证的循环。' },
                        { id: 'concept-spec-review', title: '审查流程', content: '在以前我会偏向于检测代码有没有语法错误、逻辑对不对，但是随着 AI 的能力越来越强，我想转换了一下主要检查的方向。<br><br>比如我最常遇到的问题是跟 AI 说完需求它就开始改，改完之后看起来都对了，但实际上那个修改根本没有运行起来，所以我在让它动手之前就想清楚这个变更应该怎么检查效果。还有就是包括：<br><br><strong>代码是不是太长了？</strong> — AI 特别喜欢把简单事情复杂化。<br><br><strong>有没有不必要的抽象？</strong> — AI 喜欢提前抽象、过度设计。<br><br><strong>有没有产生重复造轮子？</strong> — AI 不知道可以去 GitHub 上找别人已经实现好的部分复用。<br><br><strong>改动范围是否合理？</strong> — 一个简单的需求，AI 可能会顺手改了十个不相关的文件。需要确认每个改动都是必要且合理的。' }
                    ] },
                    { id: 'concept-transformer', title: 'Transformer', hasChildren: true, content: '', children: [
                        { id: 'concept-transformer-rnn', title: 'Transformer 原理？为什么比 RNN 好？', content: 'RNN 有两个致命缺陷，直接导致了 Transformer 的出现。<br><br><strong>长距离依赖丢失。</strong>RNN 处理文本是一个词一个词顺序读的，靠一个叫"隐状态"的向量把前面读过的信息传给下一个词。问题在于这个传递是有衰减的——读第 50 个词的时候，第一个词的信息已经被反复压缩得面目全非了，这就是著名的梯度消失问题。好比传话游戏，传了 50 个人之后，第一句话早就变味了。<br><br><strong>无法并行计算。</strong>因为 RNN 必须读完第 i 个词才能读第 i+1 个，整个序列只能串行处理。这意味着 GPU 虽然有几千个计算核心同时闲着，也只能一个接一个排队算，训练效率极低。对于需要处理几百万篇文章的大模型来说，这根本不可接受。<br><br>所以 Transformer 核心就是通过<strong>自注意力机制</strong>让每个词能同时看到句子里所有词，既没有长距离信息衰减，又能一次性并行计算整个序列。<br><br><strong>自注意力机制的简要流程：</strong>每个词可以同时生成三个向量——Q 是"我在找谁"，K 是"我是谁"，V 是"我要说什么"。每个词拿自己的 Q 和所有人的 K 做点积打分，Softmax 归一化成权重，再按权重把所有人的 V 加权求和，最终每个词都变成了融合全场上下文的向量。<br><br>● 长距离依赖方面，第 1 个词和第 500 个词之间是直接计算的，没有层层传递的衰减，打分高低只看语义关系不看距离远近。<br>● 并行计算方面，所有词的 Q、K、V 可以一次性算出来，矩阵乘法一把梭，GPU 的几千个核心终于不用排队了。<br><br>代价就是，注意力矩阵是 N×N 的，序列长度翻倍计算量翻四倍，这就是上下文窗口不能无限大的根源。' },
                        { id: 'concept-transformer-temperature', title: 'Temperature、Top-P、Top-K 原理？怎么控制大模型输出随机性？', content: '大模型工作原理：模型输出分为三步，分别是给所有词汇生成分数（Logits）、通过 Softmax 函数将分数转换为概率、按概率加权采样选词输出。<br><br>● 模型输出原理：给他认识的每一个词打分，谁分高就输出谁，接着循环，直到输出一个完整的句子，遇到了结束标记。问题是：这样输出就固定了，于是就将分数转化为概率。<br>● 通过 Softmax 函数将分数转换为概率：于是输出下一个词就不再一定是分数最高的，而是分数越高，概率越大。<br>● 最后按概率加权采样选词输出。<br><br><strong>Temperature 原理：</strong>该参数作用于 Softmax 函数，通过调整分数缩放比例改变词汇概率差距；数值越低高分词概率越集中、输出越稳定，数值越高词汇概率越平均、输出越随机多样。<br><br><strong>Top-p 原理：</strong>全称最高累加概率，是概率阈值参数，从高分词开始累加概率至阈值后截断长尾低概率词，避免输出跑题；数值越低过滤词越多、输出越严谨，数值越高兼容词越多、输出越发散。<br><br><strong>Top-k 原理：</strong>和 Top-p 差不多，这个是选取前 k 个，那个是选取前 p 的概率。<br><br><strong>参数核心区别与使用建议：</strong>Temperature 调整词汇概率差距，Top-p 截断长尾词汇；二者值越大越适合创作发散场景，值越小越适合代码、数学等严谨场景，OpenAI 建议仅调整其中一个参数即可。' },
                        { id: 'concept-transformer-kvcache', title: '什么是 KV Cache？Prompt Cache 缓存命中原理是什么？', content: '首先是误区：现在的 LLM 的架构都是 decoder（包括训练和输出），所以他就是单向的注意力机制，所以就只会看左边。流程跟有没有 encoder 差不多，第一步是计算 kv，区别就是 encoder 是双向，decoder 是单向，然后第二步都是 decoder 利用前一步的 kv，计算输出。<br><br>而 <strong>KV Cache</strong> 指的就是缓存 kv，因为现在两步都是 decoder，KV Cache 包括这两步的 kv 缓存。用在第一步，就是缓存相同 prompt 前缀的 kv，因为每一个 token 的 kv 都是根据前面的 token 来计算的，所以不变就可以不重新计算，变了就需要重新计算。用在第二步就是循环的 decoder 计算输出，下一个词语的输出会依据上一个词的 kv，这里会存起来，就不用重新计算。' },
                        { id: 'concept-transformer-training', title: '大语言模型是怎么炼成的？Transformer 的训练流程？', content: '大语言模型的训练分为三个阶段。<br><br><strong>阶段一：预训练</strong><br>做法是把互联网上几乎所有公开文本（书籍、论文、网页、代码）丢给模型，让它反复做一件事——预测下一个词。这属于自监督学习，不需要人工标注，语料本身就是标签。<br>关键点：预训练让模型掌握了语法、常识、推理模式，知识量远超任何人。但不听话，它只会文本接龙，不懂你让它做什么。<br><br><strong>阶段二：SFT 监督微调</strong><br>提供大量高质量"问题-答案"对，覆盖日常问答、写作、翻译、代码等场景，然后用这些数据继续训练模型。<br>关键点：模型学会了指令遵循和对话格式，知道"当用户这样说时，我应该那样答"。但学来的东西好坏都吸收。标注员可能带入偏见，模型也可能学会迎合而非求真。只教了"做什么"，没教"不做什么"。<br><br><strong>阶段三：RLHF 基于人类反馈的强化学习</strong><br>具体分三步：<br>● 首先对同一个问题让模型生成多个答案，人类标注员给这些答案做偏好；<br>● 然后用这些偏好数据训练一个奖励模型，让它学会判断"人类更喜欢哪种回答"；<br>● 最后用奖励模型配合 PPO 算法去微调 LLM，让模型生成更符合人类偏好的输出。<br>关键点：生成更符合人类偏好的输出，包括：判断什么该答、什么该拒绝、什么该承认不知道、要懂礼貌、不要胡说等。<br><br><strong>阶段四：LoRA</strong><br>全参数微调要更新整个模型所有矩阵，百亿参数起步，普通显卡根本跑不动。LoRA 不碰原始权重 W，只在旁边挂两个小矩阵 A 和 B。计算时输出 = W·x + B·A·x，训练只调 A 和 B，W 冻结不动。因为 A、B 是低秩矩阵，参数量只有原来的千分之一。' },
                        { id: 'concept-transformer-stage', title: '为什么必须分阶段训练？', content: '不合并成一步，有三个原因。<br><br><strong>成本：</strong>预训练极昂贵。如果在预训练阶段就使用昂贵的人工标注数据，成本将是天文数字。把"学知识"和"学规矩"分开，最大化利用免费互联网数据，只在最后关键步骤用人工。<br><br><strong>稳定性：</strong>三个目标有时冲突。让一个还没学会基本语言规律的模型同时去学复杂的"人类偏好"，学习过程会极不稳定，最终可能什么都没学好。<br><br><strong>灵活性：</strong>一次昂贵预训练得到一个强大基座模型，然后针对不同场景（写代码、写小说、做客服）用不同微调和 RLHF 派生出各种专业模型。一次筑基，多次复用。' },
                        { id: 'concept-transformer-bpe', title: 'BPE 分词算法', content: 'BPE（Byte Pair Encoding，字节对编码）是目前主流大模型分词器的核心算法。<br><br><strong>训练过程分四步：</strong><br>● 初始状态：词表只含基础字符（英文就是 26 个字母加标点，中文就是常用单字）<br>● 统计整个语料库中所有相邻符号对的共现频率<br>● 合并频率最高的字符对，生成新 Token（比如 t + h → th，再 th + e → the）<br>● 重复合并，直到词表达到预设大小（如 5 万）<br><br><strong>训练结果：</strong>高频词变成大积木（"the"、"apple" 各为一个 Token），低频词拆成子词拼装（unfortunately → ["un", "fortunate", "ly"]），生词也可以组合推断（unfriendly → ["un", "friend", "ly"]）。' }
                    ] },
                    { id: 'concept-claude', title: 'Claude Code 源码学习', hasChildren: true, content: 'Claude Code、Hermes 等工具的使用经验和源码阅读心得。', children: [
                        { id: 'concept-claude-memory', title: '内存压缩策略', content: '每轮循环开始前：<br>1. L3 大结果落盘（先把大的存起来，防止后面擦掉）<br>2. L1 裁中间（擦掉旧的对话）<br>3. L2 旧结果占位（旧输出换成一行提示）<br><br>如果还不够：<br>4. L4 LLM 摘要（花钱让模型写摘要）<br><br>如果 API 还报错：<br>5. 应急裁剪（更激进地擦）<br><br>他设计了一个四层压缩策略。前三层是不需要调用 LLM 的文本操作，分别是大输出结果落盘到磁盘只留预览（前 2000 字）、裁剪旧对话、旧工具结果用一行占位符代替。如果前三层跑完还是太大，才触发第四层 LLM 摘要，花一次 API 调用让模型生成包含当前目标、重要发现、剩余工作等关键信息的摘要，替换所有旧消息。还有应急方案，API 报错时以更激进的方式从尾部回退裁剪（留下更少的对话）。' },
                        { id: 'concept-claude-context', title: '上下文压缩的具体实现', content: '我觉得最核心的有两个设计，一个是在生成摘要前引入了一个草稿本机制，另一个是把摘要的输出分成了九个固定段落。这两个设计解决的是不同层面的问题，但组合在一起效果非常好。<br><br>草稿本<br>它的做法是让模型在输出正式摘要之前，先复盘整个对话，再输出 &lt;summary&gt;。这个设计的"思考"和"输出"能够换取更好的压缩质量。这个 &lt;analysis&gt; 在后续处理时会被直接删掉。<br><br>九段模板<br>这九段包括：<br>● <strong>要干什么</strong><br>　○ 目标<br>　○ 背景（列出所有讨论过的重要技术概念、技术和框架。）<br>　○ 所有用户消息<br>　○ 待办<br>● <strong>干过什么</strong><br>　○ 代码（逐一列举已检查、修改或创建的具体文件和代码段。附上完整代码片段，并说明为什么这次读取或编辑很重要。）<br>　○ 错误（列出你遇到的所有错误，以及你如何修复它们。特别关注用户给出的具体反馈，尤其是用户让你换种方式做的时候。）<br>　○ 已解决的问题（避免了重复劳动）<br>● <strong>要干什么</strong><br>　○ 当前状态（压缩发生时正在干什么）<br>　○ 下一步（下一步要干什么，必须附上最近对话的逐字原文引用）' },
                        { id: 'concept-claude-longterm', title: '长期记忆', content: '<strong>结构</strong><br>核心是一个单独的 MEMORY.md 文件，充当目录角色，每次对话启动时默认加载前 200 行到 system prompt。记录了每一个记忆的文件名和一句话描述。<br><br>然后是四种记忆类型不是用文件夹物理隔离，而是通过文件名里的 type 字段逻辑标记，分为 user（偏好）、feedback（规矩）、project（项目背景）、reference（线索） 四类。<br><br><strong>写入触发机制</strong><br>第一条是被动存储，当用户说了某些特定内容时触发，比如"记住""别忘了"这类关键词。这些场景下模型会主动把信息写入记忆文件。<br><br>第二条路径是主动提取，对话结束后后台会自动 fork 一个子 agent，让它分析整个对话内容，从中识别出符合记忆类型的信息并自动提取保存，用户不需要显式说"请记住这个"。<br><br><strong>注入机制</strong><br>第一层是 MEMORY.md，每次对话启动时默认加载前 200 行到 system prompt。<br><br>第二层是按需检索，在每轮对话前把 MEMORY.md 连同当前用户查询发给一个轻量级的模型，让它从中选出最多 5 个最相关的记忆文件，注入到当前对话上下文。<br><br><strong>"后台整理"机制</strong><br>它每 24 小时运行一次，模拟人类睡眠时的记忆整合过程。它的作用主要是：<br>● 扫描记忆内容，合并相同内容，移除过时内容，确保 MEMORY.md 文件的精干。' },
                        { id: 'concept-claude-prompt', title: 'SystemPrompt', content: 'Claude Code 的 system prompt 是运行时组装的，分为静态和动态两类。<br><br>静态段落包括身份定义、语气风格、任务处理原则、工具使用说明等，这些是每轮对话都需要的核心指令，内容基本稳定。<br><br>动态段落包括记忆注入、会话指导、MCP 服务器指令、token 预算控制等，这些根据当前状态决定是否加载，比如记忆段落只在有记忆文件时才注入。<br><br>组装时每轮对话前会检查上下文真实状态，基于这些状态决定加载哪些段落，然后拼接成完整 prompt。' }
                    ] },
                    { id: 'concept-claude-diff', title: 'OpenClaw 和 Hermes 的区别', content: '<strong>定位</strong><br>OpenClaw 是网关调度型企业 Harness，靠配置预制技能，无自主进化。Hermes 是原生 Agent 运行时，内置自学习，能自动沉淀复用任务流程。<br><br><strong>记忆 &amp; 安全</strong><br>OpenClaw 是单层会话记忆，仅黑名单做命令拦截。Hermes 三层持久记忆，多级沙箱 + 高危人工确认，对齐 Claude Code Harness。<br><br><strong>适用场景</strong><br>OpenClaw 适用多渠道客服、政企强合规标准化任务。Hermes 适合本地编码、对接 Claude Code、个人长期自动化。' }
                    ] }
            }
        ;

        // ===== 状态变量 =====
        var currentQuestionId = 'hero-intro';
        var allButtons = [];
        var expandedParents = {}; // 存储展开的父节点ID

        // ===== DOM元素 =====
        var qaNav = document.getElementById('qaNav');
        var categoryTag = document.getElementById('categoryTag');
        var questionTitle = document.getElementById('questionTitle');
        var answerContent = document.getElementById('answerContent');
        var miniNav = document.getElementById('miniNav');

        // ===== 渲染导航（支持层级结构和折叠展开）=====
        function renderNav() {
            var html = '';
            allButtons = [];
            
            for (var categoryKey in qaData) {
                var category = qaData[categoryKey];
                html += '<div class="nav-section">';
                html += '<div class="section-title">' + category.label + '</div>';
                
                // 递归渲染items
                function renderItems(items, level, categoryKey, parentId) {
                    items.forEach(function(item) {
                        var activeClass = item.id === currentQuestionId ? ' active' : '';
                        var levelClass = 'level-' + level;
                        
                        // 如果是子节点且父节点未展开，则隐藏
                        var hiddenStyle = '';
                        if (level > 1 && parentId && !expandedParents[parentId]) {
                            hiddenStyle = 'display: none !important;';
                        }
                        
                        // 记录可点击按钮用于键盘导航
                        if (level === 1 || (parentId && expandedParents[parentId])) {
                            allButtons.push(item.id);
                        }
                        
                        var hasChildren = item.hasChildren && item.children && item.children.length > 0;
                        var isExpanded = expandedParents[item.id];
                        var arrowIcon = hasChildren ? (isExpanded ? '▼' : '▶') : '';
                        
                        // 渲染当前项
                        html += '<button class="nav-btn ' + levelClass + activeClass + '" data-id="' + item.id + '" data-category="' + categoryKey + '" style="' + hiddenStyle + '">';
                        if (hasChildren) {
                            html += '<span class="nav-arrow" data-toggle="' + item.id + '" style="display: inline-block; width: 16px; text-align: center; font-size: 10px; color: #94a3b8; margin-right: 4px;">' + arrowIcon + '</span>';
                        } else if (level > 1) {
                            html += '<span style="display: inline-block; width: 16px; margin-right: 4px;"></span>';
                        }
                        html += item.title;
                        html += '</button>';
                        
                        // 如果有子节点，递归渲染（缩进更深）
                        if (hasChildren) {
                            renderItems(item.children, level + 1, categoryKey, item.id);
                        }
                    });
                }
                
                // 从 level-1 开始渲染
                renderItems(category.items, 1, categoryKey, null);
                
                html += '</div>';
            }
            
            qaNav.innerHTML = html;
        }

        // ===== 查找项目数据 =====
        function findItem(items, id) {
            for (var i = 0; i < items.length; i++) {
                if (items[i].id === id) return items[i];
                if (items[i].children) {
                    var found = findItem(items[i].children, id);
                    if (found) return found;
                }
            }
            return null;
        }

        // ===== 查找父节点 =====
        function findParent(items, id, parent) {
            for (var i = 0; i < items.length; i++) {
                if (items[i].id === id) return parent || items[i];
                if (items[i].children) {
                    var found = findParent(items[i].children, id, items[i]);
                    if (found) return found;
                }
            }
            return null;
        }

        // ===== 获取父节点的所有内容（包括子节点） =====
        function getFullContent(item) {
            var html = '';
            function renderBlock(item, level) {
                var tag = level === 0 ? 'h3' : (level === 1 ? 'h4' : 'h5');
                var cls = level > 0 ? 'qa-block child' : 'qa-block';
                html += '<div class="' + cls + '" data-id="' + item.id + '">';
                html += '<' + tag + '>' + item.title + '</' + tag + '>';
                if (item.content) {
                    html += '<div class="qa-body">' + item.content + '</div>';
                }
                html += '</div>';
                
                if (item.hasChildren && item.children) {
                    item.children.forEach(function(child) {
                        html += '<div class="qa-divider"></div>';
                        renderBlock(child, level + 1);
                    });
                }
            }
            renderBlock(item, 0);
            
            // 添加底部spacer，让最后一个问题可以滚到顶部
            html += '<div class="qa-bottom-spacer"></div>';
            
            return html;
        }

        // ===== 微型目录更新 =====
        function updateMiniNav() {
            var idx = allButtons.indexOf(currentQuestionId);
            if (idx === -1 || allButtons.length === 0) {
                miniNav.classList.remove('show');
                miniNav.innerHTML = '';
                return;
            }
            
            var range = 2; // 当前项上下各显示 2 个，共 5 项
            var html = '';
            
            // 前面的省略号
            if (idx - range > 0) {
                html += '<div class="mini-nav-item ellipsis">···</div>';
            }
            
            // 当前项上面的项（上面的先显示，所以 i 从大到小）
            for (var i = Math.max(0, idx - range); i < idx; i++) {
                var item = findItemById(allButtons[i]);
                if (item) {
                    html += '<div class="mini-nav-item dim" data-id="' + item.id + '">' + item.title + '</div>';
                }
            }
            
            // 当前项
            var currentItem = findItemById(allButtons[idx]);
            if (currentItem) {
                html += '<div class="mini-nav-item active" data-id="' + currentItem.id + '">' + currentItem.title + '</div>';
            }
            
            // 当前项下面的项
            for (var i = idx + 1; i <= Math.min(allButtons.length - 1, idx + range); i++) {
                var item = findItemById(allButtons[i]);
                if (item) {
                    html += '<div class="mini-nav-item dim" data-id="' + item.id + '">' + item.title + '</div>';
                }
            }
            
            // 后面的省略号
            if (idx + range < allButtons.length - 1) {
                html += '<div class="mini-nav-item ellipsis">···</div>';
            }
            
            miniNav.innerHTML = html;
            miniNav.classList.add('show');
        }

        // 微型目录点击导航
        miniNav.addEventListener('click', function(e) {
            var target = e.target.closest('.mini-nav-item');
            if (!target || !target.dataset.id || target.classList.contains('ellipsis')) return;
            
            var id = target.dataset.id;
            var categoryKey = null;
            
            for (var ck in qaData) {
                if (findParent(qaData[ck].items, id)) {
                    categoryKey = ck;
                    break;
                }
            }
            
            if (categoryKey) {
                var item = findItem(qaData[categoryKey].items, id);
                if (item) {
                    showAnswer(item, categoryKey, id);
                }
            }
        });

        // ===== 显示答案（展开整个父节点） =====
        function showAnswer(item, categoryKey, scrollToId) {
            if (!item) return;
            
            // 清除待处理的滚动同步，防止快速切换时导航闪烁
            clearTimeout(scrollTimeout);
            
            isScrolling = true;
            
            var parentItem = findParent(qaData[categoryKey].items, item.id);
            currentQuestionId = scrollToId || item.id;
            
            var needRerender = false;
            
            // 先清除所有展开状态，只展开当前选中项的父节点
            var parentToExpand = null;
            if (item.hasChildren && item.children && item.children.length > 0) {
                parentToExpand = item;
            } else {
                parentToExpand = findParent(qaData[categoryKey].items, item.id);
            }
            
            // 清除所有已有的展开状态
            for (var key in expandedParents) {
                if (expandedParents.hasOwnProperty(key)) {
                    delete expandedParents[key];
                    needRerender = true;
                }
            }
            
            // 展开当前父节点
            if (parentToExpand && parentToExpand.hasChildren && parentToExpand.children && parentToExpand.children.length > 0) {
                expandedParents[parentToExpand.id] = true;
                needRerender = true;
            }
            
            if (needRerender) renderNav();
            
            var category = qaData[categoryKey];
            categoryTag.textContent = category.label;
            
            questionTitle.style.display = 'none';
            
            answerContent.innerHTML = getFullContent(parentItem);

            var btns = qaNav.querySelectorAll('.nav-btn');
            btns.forEach(function(btn) {
                btn.classList.remove('active');
            });
            
            var activeId = scrollToId || parentItem.id;
            var targetBtn = qaNav.querySelector('[data-id="' + activeId + '"]');
            if (targetBtn) {
                targetBtn.classList.add('active');
            }

            setTimeout(function() {
                var contentArea = document.querySelector('.qa-content');
                if (scrollToId && scrollToId !== parentItem.id) {
                    var targetBlock = answerContent.querySelector('[data-id="' + scrollToId + '"]');
                    if (targetBlock) {
                        contentArea.scrollTo({ top: targetBlock.offsetTop - 20, behavior: 'instant' });
                    }
                } else {
                    contentArea.scrollTo({ top: 0, behavior: 'instant' });
                }
                
                setTimeout(function() {
                    isScrolling = false;
                }, 500);
            }, 50);
            
            updateMiniNav();
        }

        // ===== 项目详情面板 =====
        var projectPanel = document.getElementById('projectPanel');
        var projectPanelIframe = document.getElementById('projectPanelIframe');
        var projectPanelTitle = document.getElementById('projectPanelTitle');
        var projectPanelClose = document.getElementById('projectPanelClose');
        var isProjectPanelOpen = false;

        function openProjectPanel(item) {
            if (!item || !item.projectSection) return;
            
            projectPanelIframe.src = item.projectSection;
            projectPanelTitle.textContent = item.title + ' - 项目详情';
            projectPanel.classList.add('open');
            isProjectPanelOpen = true;
        }

        function closeProjectPanel() {
            projectPanel.classList.remove('open');
            isProjectPanelOpen = false;
        }

        function toggleProjectPanel() {
            if (isProjectPanelOpen) {
                closeProjectPanel();
            } else {
                var item = findItemById(currentQuestionId);
                if (item && item.projectSection) {
                    openProjectPanel(item);
                }
            }
        }

        function findItemById(id) {
            for (var ck in qaData) {
                var item = findItem(qaData[ck].items, id);
                if (item) return item;
            }
            return null;
        }

        projectPanelClose.addEventListener('click', closeProjectPanel);

        // ===== 键盘导航 =====
        function handleKeyDown(e) {
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                toggleProjectPanel();
                return;
            }
            
            if (e.key === 'ArrowRight') {
                e.preventDefault();
                
                // 切换到下一个项目分类
                var categoryOrder = ['hero', 'rag', 'workflow', 'concepts'];
                var currentCategory = null;
                for (var ck in qaData) {
                    var found = findParent(qaData[ck].items, currentQuestionId);
                    if (found) { currentCategory = ck; break; }
                }
                
                if (currentCategory) {
                    var currentIdx = categoryOrder.indexOf(currentCategory);
                    var nextIdx = (currentIdx + 1) % categoryOrder.length;
                    var nextCategory = categoryOrder[nextIdx];
                    var firstItem = qaData[nextCategory].items[0];
                    if (firstItem) {
                        if (isProjectPanelOpen) {
                            closeProjectPanel();
                        }
                        showAnswer(firstItem, nextCategory, firstItem.id);
                    }
                }
                return;
            }
            
            if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                e.preventDefault();
                
                lastKeyboardNav = Date.now();
                isScrolling = true;
                
                var currentIndex = allButtons.indexOf(currentQuestionId);
                var newIndex;
                
                if (e.key === 'ArrowDown') {
                    newIndex = (currentIndex + 1) % allButtons.length;
                } else {
                    newIndex = (currentIndex - 1 + allButtons.length) % allButtons.length;
                }
                
                var newId = allButtons[newIndex];
                var oldId = currentQuestionId;
                
                var oldParent = null;
                var newParent = null;
                var categoryKey = null;
                
                for (var ck in qaData) {
                    var op = findParent(qaData[ck].items, oldId);
                    var np = findParent(qaData[ck].items, newId);
                    if (op) oldParent = op;
                    if (np) { newParent = np; categoryKey = ck; }
                }
                
                if (oldParent && newParent && oldParent.id === newParent.id) {
                    currentQuestionId = newId;
                    
                    var btns = qaNav.querySelectorAll('.nav-btn');
                    btns.forEach(function(btn) {
                        btn.classList.remove('active');
                    });
                    
                    var targetBtn = qaNav.querySelector('[data-id="' + newId + '"]');
                    if (targetBtn) {
                        targetBtn.classList.add('active');
                    }
                    
                    var targetBlock = answerContent.querySelector('[data-id="' + newId + '"]');
                    if (targetBlock) {
                        document.querySelector('.qa-content').scrollTo({ 
                            top: targetBlock.offsetTop - 20, 
                            behavior: 'instant' 
                        });
                    }
                    
                    var btn = qaNav.querySelector('[data-id="' + newId + '"]');
                    if (btn) {
                        btn.scrollIntoView({ behavior: 'instant', block: 'center' });
                    }
                    
                    if (isProjectPanelOpen) {
                        var newItem = findItemById(newId);
                        if (newItem && newItem.projectSection) {
                            openProjectPanel(newItem);
                        } else {
                            closeProjectPanel();
                        }
                    }
                    
                    updateMiniNav();
                    
                    setTimeout(function() {
                        isScrolling = false;
                    }, 500);
                } else {
                    var item = findItem(qaData[categoryKey].items, newId);
                    if (item) {
                        showAnswer(item, categoryKey, newId);
                        
                        var btn = qaNav.querySelector('[data-id="' + newId + '"]');
                        if (btn) {
                            btn.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                        
                        if (isProjectPanelOpen) {
                            if (item && item.projectSection) {
                                openProjectPanel(item);
                            } else {
                                closeProjectPanel();
                            }
                        }
                    }
                }
            }
        }

        // ===== 事件监听 =====
        
        // 导航点击
        qaNav.addEventListener('click', function(e) {
            var btn = e.target.closest('.nav-btn');
            if (btn && btn.dataset.id) {
                var id = btn.dataset.id;
                var categoryKey = btn.dataset.category;
                
                var item = findItem(qaData[categoryKey].items, id);
                
                if (item) {
                    showAnswer(item, categoryKey, id);
                    
                    var newBtn = qaNav.querySelector('[data-id="' + id + '"]');
                    if (newBtn) {
                        newBtn.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                    
                    if (isProjectPanelOpen) {
                        if (item && item.projectSection) {
                            openProjectPanel(item);
                        } else {
                            closeProjectPanel();
                        }
                    }
                }
            }
        });

        // 键盘导航（绑定到整个文档）
        document.addEventListener('keydown', handleKeyDown);

        // ===== 滚动同步：内容滚动时左侧目录对应高亮 =====
        var isScrolling = false;
        var scrollTimeout = null;
        var lastKeyboardNav = 0;

        function handleContentScroll() {
            if (isScrolling) return;
            // 最近有键盘导航则跳过（600ms内）
            if (Date.now() - lastKeyboardNav < 600) return;
            
            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(function() {
                var contentArea = document.querySelector('.qa-content');
                var blocks = answerContent.querySelectorAll('.qa-block');
                var scrollTop = contentArea.scrollTop;
                var contentHeight = contentArea.clientHeight;
                
                var currentId = null;
                var currentTop = -Infinity;
                
                blocks.forEach(function(block) {
                    var blockTop = block.offsetTop;
                    var blockBottom = blockTop + block.offsetHeight;
                    
                    if (blockTop <= scrollTop + 50 && blockTop > currentTop) {
                        currentTop = blockTop;
                        currentId = block.dataset.id;
                    }
                });
                
                if (!currentId && blocks.length > 0) {
                    currentId = blocks[0].dataset.id;
                }
                
                if (currentId && currentId !== currentQuestionId) {
                    currentQuestionId = currentId;
                    
                    var btns = qaNav.querySelectorAll('.nav-btn');
                    btns.forEach(function(btn) {
                        btn.classList.remove('active');
                    });
                    
                    var targetBtn = qaNav.querySelector('[data-id="' + currentId + '"]');
                    if (targetBtn) {
                        targetBtn.classList.add('active');
                    }
                    
                    updateMiniNav();
                }
            }, 50);
        }

        // ===== 初始化 =====
        renderNav();
        showAnswer(findItem(qaData.hero.items, 'hero-intro'), 'hero');
        
        var contentArea = document.querySelector('.qa-content');
        if (contentArea) {
            contentArea.addEventListener('scroll', handleContentScroll);
        }
    </script>

</body>
</html>
