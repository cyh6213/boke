    <style>
        body { display: flex; flex-direction: column; overflow: hidden; }
        
        .qa-main {
            display: flex;
            margin-top: 60px;
            height: calc(100vh - 60px);
        }

        /* ===== 左侧统一导航区域 (50%) ===== */
        .qa-nav {
            width: 50%;
            background: #faf8ff;
            border-right: 1px solid #f5f3ff;
            overflow-y: auto;
            flex-shrink: 0;
            position: relative;
        }
        
        /* 项目分组容器 */
        .qa-nav .nav-section {
            padding: 0;
            margin-bottom: 12px;
            border-radius: 10px;
            background: #ffffff;
            box-shadow: 0 1px 3px rgba(124, 58, 237, 0.03);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: none;
        }
        
        /* 确保按钮垂直排列 */
        .qa-nav .nav-section > * {
            display: block;
            width: 100%;
            float: none;
        }
        
        /* 强制按钮换行 */
        .qa-nav .nav-btn {
            display: block !important;
            width: 100% !important;
            float: none !important;
            margin-right: 0 !important;
            text-align: left !important;
            justify-content: flex-start !important;
        }
        
        /* 项目标题（最外层） */
        .qa-nav .section-title {
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 700;
            color: #5b21b6;
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f5f3ff;
            margin-bottom: 4px;
        }
        
        /* 一级按钮（父节点，可点击显示答案） */
        .qa-nav .nav-btn.level-1 {
            padding-left: 20px;
            font-size: 13px;
            font-weight: 600;
            color: #4f46e5;
            background: #f5f3ff;
            border: 1px solid #e0d8ff;
            border-radius: 6px;
            margin: 4px 8px;
        }
        .qa-nav .nav-btn.level-1:hover {
            background: #ede9fe;
            color: #4f46e5;
        }
        .qa-nav .nav-btn.level-1.active {
            background: #4f46e5;
            color: #ffffff;
            border-color: #4f46e5;
        }
        
        /* 二级按钮（子节点） */
        .qa-nav .nav-btn.level-2 {
            padding-left: 35px;
            font-size: 12px;
            font-weight: 500;
            color: #6D28D9;
            background: #f8f7ff;
            border: 1px solid #ece8ff;
            border-radius: 6px;
            margin: 2px 8px;
        }
        .qa-nav .nav-btn.level-2:hover {
            background: #ede9fe;
            color: #4f46e5;
        }
        .qa-nav .nav-btn.level-2.active {
            color: #ffffff;
            font-weight: 600;
            background: #6D28D9;
            border-color: #6D28D9;
        }
        
        /* 三级按钮 */
        .qa-nav .nav-btn.level-3 {
            padding-left: 50px;
            font-size: 12px;
            font-weight: 500;
            color: #7c3aed;
            background: #f8f7ff;
            border: 1px solid #ece8ff;
            border-radius: 6px;
            margin: 2px 8px;
        }
        .qa-nav .nav-btn.level-3:hover {
            background: #ede9fe;
            color: #4f46e5;
        }
        .qa-nav .nav-btn.level-3.active {
            color: #ffffff;
            font-weight: 500;
            background: #6D28D9;
            border-color: #6D28D9;
        }

        /* ===== 右侧答案展示 (50%) ===== */
        .qa-content {
            position: relative;
            width: 50%;
            padding: 20px 30px;
            overflow-y: auto;
            background: #ffffff;
            position: relative;
        }
        .qa-content .content-header {
            margin-bottom: 16px;
            padding-bottom: 10px;

        }
        .qa-content .content-header .category-tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;

        .qa-content .content-body {

            color: #3f3f46;

        }
        .qa-content .content-body strong {
            color: #6D28D9;
            font-weight: 600;
        }
        
        /* 父问题/子问题内容块 */
        .qa-content .qa-block {
            padding: 16px 0;
        }
        .qa-content .qa-block.child {
            padding: 12px 0;
        }
        .qa-content .qa-block h3 {
            font-size: 16px;
            font-weight: 700;
            color: #6D28D9;
            margin: 0 0 12px 0;
        }
        .qa-content .qa-block.child h4 {
            font-size: 14px;
            font-weight: 600;
            color: #6D28D9;
            margin: 0 0 8px 0;
            padding-left: 12px;

        }
        .qa-content .qa-block .qa-body {
            font-size: 13px;
            color: #3f3f46;
            line-height: 1.7;
            padding-left: 0;
        }
        .qa-content .qa-block.child .qa-body {
            padding-left: 15px;
        }
        .qa-content .qa-block .qa-body strong {
            color: #6D28D9;
            font-weight: 600;

        /* 深色正文总结/要点 <font style="color:#6D28D9"> 保持紫色（因为颜色已经映射）；
           为了防止 content-body 的根容器里出现默认黑色，这里兜底用紫色覆盖 font style=深色 的情况 */
        .qa-content .qa-block .qa-body font[style*="6D28D9"] {

        }
        
        /* 分隔线 */
        .qa-content .qa-divider {
            height: 1px;
            background: linear-gradient(to right, transparent, #ddd6fe, transparent);

        }
        
        /* 底部spacer，确保最后一个问题可以滚到顶部 */
        .qa-content .qa-bottom-spacer {
            height: 60vh;
            min-height: 400px;
        }
        
        .qa-content .content-body p {
            margin-bottom: 8px;
        }
        .qa-content .content-body p:last-child {
            margin-bottom: 0;
        }

        /* ===== 右侧项目详情面板 ===== */
        .project-panel {
            position: fixed;
            top: 60px;
            right: 0;
            width: 60%;
            height: calc(100vh - 60px);
            background: #ffffff;
            box-shadow: -4px 0 20px rgba(0, 0, 0, 0.08);
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 100;
            display: flex;
            flex-direction: column;
        }
        .project-panel.open {
            transform: translateX(0);
        }
        .project-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            border-bottom: 1px solid #f5f3ff;
            background: #faf8ff;
            flex-shrink: 0;
        }
        .project-panel-title {
            font-size: 14px;
            font-weight: 600;
            color: #5b21b6;
        }
        .project-panel-close {
            width: 28px;
            height: 28px;
            border: none;
            background: transparent;
            font-size: 20px;
            color: #94a3b8;
            cursor: pointer;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .project-panel-close:hover {
            background: #f5f3ff;
            color: #7c3aed;
        }
        .project-panel-iframe {
            flex: 1;
            width: 100%;
            border: none;
        }

        /* ===== 微型目录（导航栏右侧，纵向排列，向下延伸） ===== */
        .mini-nav {
            display: none;
            position: fixed;
            top: 0;

            font-size: 11px;
            line-height: 16px;
            color: #94a3b8;
            padding: 2px 0;
            max-width: 160px;
            min-width: 80px;
            background: rgba(255,255,255,0.96);
            border-radius: 0 0 6px 6px;
            border: 1px solid #f1f4f9;
            border-top: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            pointer-events: none;
        }
        .mini-nav.show {
            display: block;
        }
        .mini-nav-item {
            padding: 1px 10px;
            cursor: pointer;
            color: #94a3b8;
            transition: color 0.15s, background 0.15s;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            pointer-events: auto;
        }
        .mini-nav-item:hover {
            color: #4f46e5;
            background: rgba(79,70,229,0.04);
        }
        .mini-nav-item.active {
            color: #4f46e5;
            font-weight: 700;
        }
        .mini-nav-item.dim {
            color: #cbd5e1;
        }
        .mini-nav-item.ellipsis {
            color: #cbd5e1;
            cursor: default;
            padding: 1px 10px;
            letter-spacing: 1px;
            pointer-events: none;
        }
    </style>

    <script>
        // ===== 问答数据（严格按照自我介绍页面的提示词内容）=====
        var qaData = {
            hero: {
                label: '自我介绍',
                items: [
                    { id: 'hero-0', title: '自我介绍', content: '面试官您好，我是程愚瀚，电子科技大学软件工程专业 28 届本科生。我有java后端开发和Agent开发两方面的经验。<br><br>除了简历上的项目，我也有RAG优化的相关经验。同时还有就是我平时也会记录我自己的一些经验，我都把他们放在了我的博客网站上，您在简历上可以看见这个链接。<br><br><strong>然后我重点给您介绍一下简历上的项目和实习经历。</strong><br><br><strong>我在字节实习的主要工作就是</strong>思考如何利用AI提效，<strong>这里遇到了一个问题：</strong>在传统的人机交互过程中，Agent 干完一步等人审查，人布置完任务等着Agent做事，时间被等待碎片化，这种双向的等待拖慢了流程的推进，浪费了大量的时间。<br><br><strong>所以这个项目核心就是在AI提效的基础上，思考如何进一步提效，我的办法就是</strong>进一步减少人工介入，减少那些人被迫介入但是不产生高价值决策的时间占比，比如单纯的流程推进，可以由AI自己完成的结果校验等<br><br><strong>我再对项目的使用场景加一个限制，就是</strong>流程相对固定、需要多 Agent 与人工协同完成的长链路任务。<br><br><strong>而我的解决思路来自Graph Engineering这个概念</strong>：“系统管流程、Agent 管执行、人管关键决策”。<br><br><strong>我从技术侧和业务侧各做了一次实践。技术侧，</strong>我自研了一个 Graph Runtime：用 DAG 定义流程，Harness引擎自动调度执行，支持节点级 Checkpoint、全链路 Trace、分层异常治理等能力。<br><br><strong>业务侧，</strong>我在实习中把同样的模式落地：从多个单条 Skill 演进到主控 Agent 加多子 Agent 的群聊模式，让Agent 自动推进跨平台审核流程，单条策略的搭建从一周缩短到两天，大大减少了我的精力消耗。<br><br><strong>这两次实践，让我分别</strong>在技术上理清了项目的可行性，在业务上验证了这个项目的真实需求。<strong>同时也认清了自己的不足</strong>：靠想象是做不出能够真实使用的项目的，只有到真实的业务场景，去体验、学习和验证。<strong>所以我希望</strong>能够加入贵公司，在真实场景学习工程落地的方法，如果可能，能够将现有项目转化为有人使用的产品。' },
                    { id: 'hero-1', title: '实习介绍', content: '<strong>我是在字节跳动 CQC 部门实习，广告机审运营，主要就是</strong>给各种内容，比如短视频，广告等搭建机审策略，搭workflow，我在其中主要做 AI 提效相关工作。<br><br><strong>我的工作主要分为两部分。第一部分是</strong>搭建各种各样的bot来提效，比如我简历里面提到的针对异常治理自动化，日常我们需要监控机审的误杀率，还会接受线上爆出的机审误判Case，这些事情非常得繁琐且没有产出，所以就针对性的搭建了“定时巡检主动预警”和“群聊消息被动响应”两条链路，来解决人工巡检和排查问题。<br><br><strong>第二部分，</strong>就是策略搭建流程自动化，也是我项目的灵感来源，这个策略搭建的流程繁琐，且因为权限、安全等问题，不能实现完全的自动化，甚至不能只依靠一个平台的agent来完成。<br><br><strong>我最开始是</strong>先把策略搭建涉及的能力逐项梳理出来，搭建成独立 Skill，这个阶段解决的是单点提效。<br><br><strong>但真正使用后就遇到了我项目提到的问题</strong>，Agent 干完一步等人看，人布置完任务等着Agent做事，人的时间被等待碎片化，这种双向的等待拖慢了流程的推进，浪费了大量的时间。<strong>于是我思考这么样可以进一步提效，我将主要目标放在了以下几点：</strong>减少不必要的人工接入（比如单纯的流程推进，可以由AI自己完成的结果校验等），然后因为由于有必要的平台agent转换和人工介入，我希望它能够自动的给出相关上下文，不再需要手动组织。<br><br><strong>于是我在飞书群聊中</strong>，搭建了主控 Agent 加多个子 Agent 的协作模式：主控负责理解任务、维护上下文和推进流程，子 Agent 复用前期沉淀的 Skill，执行具体工作，人只在必要节点介入。将策略的搭建周期从一周缩短到两天。<br><br><strong>这段经历也可以看作我个人 Graph Runtime 项目在真实业务中的一次需求验证，让我想清楚了我的项目是在什么场景使用，给谁使用。同时也让我更加了解大家对于Agent提效的需求是什么。</strong>', hasChildren: true, children: [
                            { id: 'hero-1-0', title: '大家对于Agent提效的需求是什么', content: '我觉得可以按照Agent能力和非Agent能力分为两方面。<br><br><strong>非agent能力的第一点就是权限</strong>，也是限制的最死的一点，因为现在我们通过Agent提效，我们的大部分操作都是写一个Skill，告诉他要在某一个平台做什么，然后到另一个平台做什么。所以说，其实暂时我们对Agent的能力要求没有那么高，限制的最死的，让我们某一个操作不能够通过Agent提效的，就是权限问题。<br><br><strong>然后第二点是平台的Agent可操作性</strong>，比如现在做的很好的就是飞书，它的很多能力都可以由Agent来自动的操作。<br><br><strong>前面说的两点其实都不太是Agent的开发者需要做的事情，而是公司层面的适配。而对于Agent平台的开发者，我们的主要精力是在Agent能力。</strong>每一个Agent它们其实都有不同的侧重点，比如说有的，它就在数据检索方面做了很大的改进，有的则是在办公能力上面，比如说写文件啊，这些上面做了非常大的改进。<br><br><strong>总结一下就是权限和平台的可操作性是利用AI提效的硬要求，然后再是Agent能力上面的提高，让在办公环境中利用AI提效能成为现实。</strong>' },
                            { id: 'hero-1-1', title: '为什么上一份实习只做了一个多月？', content: '<strong>首先，为什么选择加入</strong>。<br>这是我的第一份实习，也是进入字节了解真实业务环境的机会。虽然入职前我知道这个岗位更偏 AI Agent 应用，而不是底层开发，但我仍然认为它值得尝试。<br><br>一方面，我希望了解大厂真实的协作流程，以及 AI 在生产业务中到底如何落地；另一方面，我之前做 Agent 项目时，很多需求判断来自自己的想象，而这段实习让我能够接触真实业务，知道企业真正关注的是什么<br><br><strong>其次，为什么决定离开。</strong><br>实际工作一个多月后，我发现岗位的长期核心仍然是通过 Skill 和现有 Agent 平台完成运营提效，并围绕机审效果等业务指标持续优化。我认可这些工作的价值，也确实学到了 Agent 应用和业务落地经验，但它和我的长期方向存在比较明确的差异。<br><br>我的职业方向是 Agent 工程开发，希望深入参与代码实现、Agent 策略和工程稳定性建设，而不只是使用既有平台完成业务任务。因此，在确认这种差异是岗位长期属性，而不是暂时安排之后，我决定尽早调整方向。<br><br><strong>这次离开并不是因为工作强度、团队氛围或者短期困难，也不是频繁尝试不同岗位，他让我更清楚地验证了自己的职业方向。</strong>下一份实习我会在加入前重点确认岗位职责和长期工作内容。如果岗位确实以 Agent 开发为主，我希望能够长期投入，并持续做出完整成果。' },
                            { id: 'hero-1-2', title: '你对下一份实习有什么期待？', content: '第一，我希望岗位本身以 Agent 开发为主。我希望能够真正参与代码编写、Agent 策略设计、工具调用和运行时编排，而不只是使用已有平台完成业务任务。<br><br>第二，个人项目可以让我验证一个技术方案能不能跑通，但很难让我知道真实业务约束下的技术取舍。我希望在真实生产场景中建立完整的 Agent 工程认知。<br><br>第三，我也希望进入公司以后，有机会把自己的项目进一步做成一个真正可以推广、可以使用的产品，而不只是停留在 Demo 阶段。' }
                        ]},
                    { id: 'hero-2', title: '项目介绍', content: '自我介绍我已经说过项目目标了，然后我在简单介绍一下这个项目的harness系统和功能实现<br><br><strong>在架构上：</strong><br><br>我将系统拆成了三层：Planner 负责生成版本化 DAG；Orchestrator 负责校验 DAG，维护节点依赖和 <code>ready queue</code>，并行调度满足条件的节点；Agent Runtime 只负责节点内的 ReAct 和工具调用。Harness 则是承载这三层的完整运行环境，统一提供上下文、Workspace、Checkpoint、异常治理、HITL 和 Trace。<strong>这个设计主要带来三点价值：</strong>第一，把模型的不确定推理与系统的确定性控制解耦；第二，统一并行、重试、恢复等执行语义；第三，模型、规划策略和执行引擎可以独立替换和测试。<br><br><strong>在功能实现上：</strong><br><br><strong>从目标（减少不必要的人工介入）的角度来看</strong>：设计了规划和执行解耦的架构，由harness系统来推进任务的执行，同时设计设计了审查Loop，让人从审查迭代的循环中脱离，还实现了更加实用的人机交互模式。<br><br><strong>从长链路任务（复杂任务怎么跑得完、跑得稳）的角度</strong>：我设计了多Agent交互的模式，上下文组织机制，节点级checkpoint机制，三级异常传播机制，共同保证长流程能够顺利跑完全程<br><br><strong>从Agent基建的角度：</strong>我主要做了五层的Trace记录<br><br><strong>从优化的角度看：</strong>针对执行速度优化，做了并行执行；针对Plan能力DAG构建正确率做了优化；针对上下文、工具管理做了Token用量方面优化。<br><br><strong>其中，还有一些功能在计划当中，</strong>比如toolhub工具智能化管理（计划通过Trace调用工具记录，来给planagent提供更多信息来选择tool）、Trace记录实现了，但是还在思考Trace的可视化怎么做，让用户可以更方便对异常溯源；多LLM模型调用（审查agent，planAgent）也暂时还未实现；上下文传递智能化，目前的上下文主要想要实现的目标是在减少工具调用等无关信息的传递，同时尽量传递够用的信息，但是没有根据任务类型的不同，来动态的选择传递信息的量（查天气 vs 复杂任务）', hasChildren: true, children: [
                            { id: 'hero-2-0', title: '为什么项目叫 GraphHarness？', content: '这个名字由 Graph 和 Harness 两部分组成。<br><br><strong>Graph 来自 Graph Engineering</strong>。它不是把所有任务塞进一个 Agent Loop，而是把多个 Agent、工具、审查机制和人工决策点组织成显式的 DAG，由系统根据依赖关系自动推进。加入 HITG 后，就形成了“系统管流程、Agent 管执行、人管关键决策”的协作方式。<br><br><strong>Harness 不止是确定性调度</strong>，而是让这张图可靠运行的完整工程环境。它负责 DAG 校验、依赖解析、并行调度、上下文组装、Checkpoint、异常恢复、HITL 和 Trace，把模型的不确定推理与系统的确定性控制解耦。<br><br>所以可以概括为：Graph 定义人和 Agent 如何协作，Harness 保证这套协作能够稳定、可控地运行。' },
                            { id: 'hero-2-1', title: '随着模型能力不断提升，Harness 和 DAG 会不会逐渐失去意义', content: '我也思考过，随着模型能力不断提升，Harness 和 DAG 会不会逐渐失去意义。<br><br><strong>我的判断是</strong>：模型能力的提升会压缩 Harness 的范围，但不会消除对确定性调度的需求。<br><br>在 AI Coding 中已经能看到这个趋势。早期我们需要编写大量 Rules 指导模型如何完成任务；随着模型变强，过多规则反而会限制它，最终留下的往往只有安全边界和必须遵守的约束。DAG 也是一样：如果只是用它告诉模型如何思考、如何完成开放任务，未来确实可能成为能力限制。<br><br>但 DAG 的核心价值不只是帮助模型完成任务，而是保证关键流程按照可验证、可追踪、可干预的方式执行。在审批、审核、金融等对错误容忍度较低的场景中，模型再聪明，也不能完全依赖概率生成来决定流程。<br><br>因此，我不认为 DAG 会被淘汰。它的应用范围可能会收缩，但会进一步集中到固定流程和高敏感场景中。' },
                            { id: 'hero-2-2', title: '项目亮点：异常恢复', content: '我认为项目的一个亮点是，它没有把 Agent 的异常简单处理成统一重试，而是根据异常的影响范围，设计了工具调用级、节点执行级和流程级三层异常治理机制。<br><br><strong>第一层是工具调用级。</strong>对于超时等临时性问题，采用指数退避直接重试，不返回给模型；遇到参数错误则把结构化错误返回给模型修正；遇到鉴权失败和非法操作等不可恢复异常则直接上抛。来避免一次网络抖动或参数错误直接导致整个节点失败，同时防止无差别重试造成资源浪费或重复副作用。<br><br><strong>第二层是节点执行级。</strong>如果工具重试耗尽，或者模型出现思路停滞、和结果质量不合格，Harness 会创建新的 NodeAttempt。它会保留已经验证的事实和工具结果，清理错误的 ReAct 历史，再根据失败原因重新组装上下文，进行重试。<br><br><strong>第三层是流程级。</strong>如果节点仍然失败，调度器 会根据预设的 处理策略，选择中断流程、还是使用默认值、进入异常分支，或者人工介入。人工处理后，再从对应的 Checkpoint 恢复，不重新执行未受影响的节点。这一层解决的是局部恢复已经无法处理时，整个业务流程应该如何继续的问题。它避免单个非关键节点拖垮整条流程，也避免系统为了“跑完”而静默吞掉关键错误。<br><br>这套机制的价值是：<strong>用尽可能低的成本恢复可恢复异常，同时让不可恢复异常快速失败，使流程能够在明确边界内尽可能继续执行。</strong>' },
                            { id: 'hero-2-3', title: '项目难点：分层异常恢复', content: '我认为项目中实现难度最大的是异常恢复。<br><br>我先介绍一下我们这里的异常处理机制。<br><br>这里设计了三层的异常处理机制，核心原则是：能够局部恢复，就不扩大故障范围；局部无法解决，再向上冒泡。<br><br>第一层是工具调用级。对于超时等临时性问题，采用指数退避直接重试，不返回给模型；遇到参数错误则把结构化错误返回给模型修正；遇到鉴权失败和非法操作等不可恢复异常则直接上抛。<br><br>第二层是节点执行级。如果工具重试耗尽，或者模型出现思路停滞、和结果质量不合格，Harness 会创建新的 NodeAttempt。它会保留已经验证的事实和工具结果，清理错误的 ReAct 历史，再根据失败原因重新组装上下文，进行重试。<br><br>第三层是流程级。如果节点仍然失败，调度器 会根据预设的 处理策略，选择中断流程、还是使用默认值、进入异常分支，或者人工介入。人工处理后，再从对应的 Checkpoint 恢复，不重新执行未受影响的节点。<br><br><strong>这里面遇到的难点是</strong>在我们异常处理策略的第二层，节点重试时，如何重新构建一份既保留有效成果、又不会继承错误思路的上下文。<br><br>节点级主要有两类问题。输出 Schema 不合格比较容易处理：保留原始证据和待修正结果，注入字段级错误，让新的 <code>NodeAttempt</code> 定向修改。更难的是模型循环或长期无进展。<br><br>我最初想的是竖切一刀，通过判断旧 ReAct 从哪一步开始走错，保留前面的正确部分、删除后面的错误部分。但是我想不出来怎么做，而且只要保留旧的推理轨迹，就可能让模型继续锚定原来的思路。<br><br>最后我的解决方案是横切一刀，把执行成果与推理过程解耦：只继承执行结果，不继承原来的 Thought、ReAct 历史。这样既避免从头重复获取信息，也降低了新一轮重试被旧思路误导的风险。' }
                        ]}
                ]
            },
            gh: {
                label: 'GraphHarness',
                items: [
                    { id: 'gh-0', title: 'Planner–Orchestrator–Agent Runtime 分层架构', content: '', hasChildren: true, children: [
                            { id: 'gh-0-0', title: 'harness系统的意义', content: '<strong>我设计 Harness，核心是为了解决一个矛盾</strong>：模型擅长推理，但不适合管理长链路任务的确定性流程。<br><br>一个任务除了 Planner 生成 DAG、Agent 执行节点，还涉及 DAG 校验、依赖解析、并行调度、上下文组装、状态持久化、异常恢复、HITL 和 Trace。如果全部交给 Agent，不仅容易漏步骤、重复执行，调度和存储逻辑也会与模型、Prompt 强耦合。<br><br><strong>所以我将系统拆成三层</strong>：Planner 负责生成版本化 DAG；Orchestrator 负责校验 DAG，维护节点依赖和 <code>ready queue</code>，并行调度满足条件的节点；Agent Runtime 只负责节点内的 ReAct 和工具调用。Harness 则是承载这三层的完整运行环境，统一提供上下文、Workspace、Checkpoint、异常治理、HITL 和 Trace。<br><br><strong>这个设计主要带来三点价值</strong>：第一，把模型的不确定推理与系统的确定性控制解耦；第二，统一并行、重试、恢复等执行语义；第三，模型、规划策略和执行引擎可以独立替换和测试。<br><br>所以 Harness 系统的意义就是给模型加上一套工程‘缰绳’，把 Agent 能力变成可编排、可恢复、可观测、可测试的运行系统。”' }
                        ]},
                    { id: 'gh-1', title: 'Agent 全链路可观测', content: '', hasChildren: true, children: [
                            { id: 'gh-1-0', title: '设计', content: '<strong>我的 Trace 设计主要解决两个问题：</strong>如何完整还原一次 Agent Workflow 的执行过程，以及出现问题后，如何追踪系统的完整处理链。整体按照“执行粒度、记录模型、关系组织、跨层关联”四个部分展开。<br><br><strong>第一是六级细粒度执行模型。</strong>我把一次执行拆成 Run → Node → NodeAttempt → Round → ToolCall → ToolAttempt。这里不仅记录逻辑任务，<strong>还专门引入了 Attempt，用来区分“系统想完成什么”和“为完成它实际尝试了几次”。</strong>比如 Agent 只决定查询一次订单，因此只有一个 ToolCall；但底层请求两次超时、第三次成功，就会产生三个 ToolAttempt。这样既能统计 Agent 的工具选择，也能分析底层的请求、重试和错误情况。<br><br><strong>第二是 Span 与 Event 双模型。</strong>Span 记录有明确开始和结束的执行过程，包括耗时、状态和结果，用来构成执行链路的骨架；Event 记录某个时刻发生的关键事实，例如触发重试、权限拒绝、上下文裁剪、分支命中或者进入 HITL。也就是说，<strong>Span 负责还原系统执行了什么，Event 负责补充执行过程中发生了什么。</strong><br><br><strong>第三是调用关系与业务语义分离</strong>。我使用 span_id 和 parent_span_id 将六级 Span 组织成调用树，表示谁调用了谁；同时保留 node_id、node_attempt_id、tool_call_id 和 tool_attempt_id 等业务 ID，说明当前记录对应哪个逻辑任务以及哪次物理执行。这样 Trace 的存储结构不会和具体业务语义强耦合，同时又能准确定位业务对象。<br><br><strong>第四是跨层问题处理链关联</strong>。调用树只能表达调用关系，但一次异常可能跨越多个层级，经历工具重试、异常冒泡、节点恢复、降级以及 HITL。<strong>因此我增加了 correlation_id</strong>，用同一个 ID 关联这次问题涉及的多个 Span 和 Event，完整还原一个问题从发生到最终处置的过程。<br><br>所以这套 Trace 最终能够回答两类问题：一次任务具体是怎么执行的，以及某个问题发生之后，系统是怎么一步步处理的。' },
                            { id: 'gh-1-1', title: '异常排查', content: '<strong>第一条是按 Span 层级下钻：</strong>先通过 <code>run_id</code> 查看完整时间线，定位异常 Node，再进入具体的 NodeAttempt、Round、ToolCall 和 ToolAttempt。这条路径回答的是“问题发生在哪里”。<br><br><strong>第二条是通过</strong> <strong><code>correlation_id</code></strong> <strong>还原异常处理过程</strong>。因为一次工具超时可能在 Tool Runtime 触发重试，重试耗尽后又升级到 Orchestrator，随后触发降级或者 HITL。这些动作分散在不同 Span，单靠父子关系无法说明它们是在处理同一个问题。因此，第一次需要跨层处理异常时生成一个 <code>correlation_id</code>，并通过 Trace Context、<code>ErrorEnvelope</code> 或消息 Payload 继续传递。当异常恢复或明确终止后，就停止向后续正常执行传播这个 <code>correlation_id</code>，但已有记录会永久保留。因此，<code>parent_span_id</code> 用来回答“调用层级是什么”，<code>correlation_id</code> 用来回答“这些分散的动作是否在处理同一个问题”。' }
                        ]},
                    { id: 'gh-2', title: '三级异常治理', content: '', hasChildren: true, children: [
                            { id: 'gh-2-0', title: '三级异常实现', content: '我没有把 Agent 的异常简单处理成统一重试，而是根据异常的影响范围，设计了工具调用级、节点执行级和流程级三层异常治理机制。<br><br><strong>第一层是处理工具故障。</strong>对于超时等临时性问题，采用指数退避直接重试，不返回给模型；遇到参数错误则把结构化错误返回给模型修正；遇到鉴权失败和非法操作等不可恢复异常则直接上抛。这一层主要解决工具调用中的局部、短暂故障，<strong>避免一次网络抖动或参数错误直接导致整个节点失败，同时防止无差别重试造成资源浪费或重复副作用。</strong><br><br><strong>第二层是处理节点执行问题</strong>。如果工具重试耗尽，或者模型出现思路停滞、和结果质量不合格，Harness 会创建新的 NodeAttempt。<strong>同样的上下文原样重试通常没有意义</strong>，所以它会保留已经验证的事实和工具结果，清理错误的 ReAct 历史，再根据失败原因重新组装上下文，进行重试。<br><br><strong>第三层是决定整个流程如何继续</strong>。如果节点仍然失败，调度器 会根据预设的 处理策略，选择中断流程、还是使用默认值、进入异常分支，或者人工介入。人工处理后，再从对应的 Checkpoint 恢复，不重新执行未受影响的节点。<strong>这一层解决的是局部恢复已经无法处理时，整个业务流程应该如何继续的问题。它避免单个非关键节点拖垮整条流程，也避免系统为了“跑完”而静默吞掉关键错误。</strong><br><br>最后呢就是这套系统搭配了我们的Trace记录系统支持的可视化机制，专门设计了异常id，可以将一次异常引发的三层异常串成完整的问题处理链。' },
                            { id: 'gh-2-1', title: '节点重试时，如何重新构建一份既保留有效成果、又不会继承错误思路的上下文', content: '<strong>节点级主要有两类问题。</strong>输出 Schema 不合格比较容易处理：保留原始证据和待修正结果，注入字段级错误，让新的 <code>NodeAttempt</code> 定向修改。更难的是模型循环或长期无进展。<br><br><strong>我最初想的是竖切一刀，</strong>通过判断旧 ReAct 从哪一步开始走错，保留前面的正确部分、删除后面的错误部分。但是我想不出来怎么做，而且只要保留旧的推理轨迹，就可能让模型继续锚定原来的思路。<br><br><strong>最后我的解决方案是横切一刀，</strong>把执行成果与推理过程解耦：只继承执行结果，不继承原来的 Thought、ReAct 历史。这样既避免从头重复获取信息，也降低了新一轮重试被旧思路误导的风险。' }
                        ]},
                    { id: 'gh-3', title: '上下文与产物管理', content: '', hasChildren: true, children: [
                            { id: 'gh-3-0', title: '你是如何设计系统的上下文与产物管理的？', content: '<strong>这部分主要思考两个问题：</strong>上游 Agent 的产出以什么形式、存放在哪里；下游 Agent 又应该获取哪些内容。<br><br><strong>整个方案经历了三次迭代。</strong><br><br><strong>1.0 阶段</strong>采用全量上下文传递。<br>最开始，我直接把上游 Agent 的完整执行历史，全部传给下一个节点。但多个节点串联后，信息会不断累积。很快就会占满 Context Window。<br><br><strong>2.0 阶段</strong>改为结构化输出和按需输入。<br>我首先考虑过把完整历史压缩成摘要，但这既需要额外调用模型，也可能丢失细节。因此，我借鉴 Dynamic Workflow 的思路，在生成 DAG 时为每个节点动态定义输出 Schema。节点完成后，只保存和传递经过 Schema 校验的 <code>NodeOutput</code>，不再传递完整执行历史。<br><br>输入侧也不再累积整条链路的输出。每个节点默认只接收原始任务、Plan，以及直接依赖节点的结构化输出；其他节点的信息独立存储，Agent 确实需要时再通过 Tool 按需查询。这样，节点间传递的信息量降低到了原始内容的 10%～20%，也基本解决了上下文持续膨胀的问题。<br><br><strong>3.0 阶段</strong>进一步加入 Workspace 和产物版本管理。<br>2.0 解决了文本上下文的问题，但代码、报表等中间产物仍然分散，难以判断应该使用哪个版本。因此，我设计了统一的 <code>Workspace</code>，集中管理用户需求、全局约束和各类文件产物。<br><br>Workspace 使用本地 Git 管理版本。每个节点成功后，会把修改提交为一个 commit，并把 <code>commit_sha</code> 写入对应的 <code>Checkpoint</code>。需要回滚时，系统会同时恢复节点状态和对应的文件版本。<br><br>所以，这套方案就是：结构化 <code>NodeOutput</code> 负责节点间的信息传递，Workspace + Git + Checkpoint 负责中间产物和版本状态的一致性。' },
                            { id: 'gh-3-1', title: '子节点的输入你是怎么做的？', content: '子 Agent 的 Prompt 组织主要解决两个问题：默认给它哪些信息，以及这些信息按照什么顺序组织。<strong>我的原则是只提供完成当前节点所需的最小完整上下文，同时让稳定约束优先、动态信息靠后、大型产物按需读取</strong>。整体分成六层。<br><br><strong>第一层</strong>是 System Prompt，定义稳定规则。包括 Agent 的职责边界、安全要求、工作原则、工具规则和通用输出要求。这部分最稳定，也最不能被后续内容干扰，所以放在最前面。<br><br><strong>第二层</strong>是 Workflow Context，帮助它理解全局目标。包括用户原始需求、全局约束、验收标准、当前 Plan 和轻量化 DAG 概览。这里只说明整体流程和依赖关系，不注入其他节点的完整执行历史。<br><br><strong>第三层</strong>是 Node Prompt，明确当前要做什么。包括节点目标、输入要求、完成条件、Workspace 读写范围、失败处理方式，以及什么时候必须触发 HITL。<br><br><strong>第四层</strong>是 Dependency Context，提供必要的上游信息。默认只注入直接依赖节点经过 Schema 校验的结构化输出，包括结果、告警、未解决问题和必要的 Artifact 引用，而不是累积所有祖先节点的上下文。<br><br><strong>第五层</strong>是 Tool Context，说明当前可以怎么做。包括可用工具、权限、预算和调用限制。如果默认上下文不够，Agent 可以通过 <code>context_query</code> 和 <code>context_get</code> 主动查询其他节点的信息。查询结果必须携带来源节点、文件路径和 <code>commit_sha</code>；大型内容只返回引用，需要时再读取，查询不到则明确返回 <code>context_missing</code>，不能让模型自行补全。<br><br><strong>第六层</strong>是 Output Contract，约束最终产出。系统会根据动态 <code>NodeOutput Schema</code> 明确必填字段、<code>ArtifactRef</code> 格式，以及成功、部分成功和失败的表达方式，保证输出能够被下游节点稳定消费。<br><br>所以这套设计不是简单地压缩 Prompt，而是建立一条明确的信息链：先固定行为边界，再说明全局目标，然后聚焦当前任务，提供最小依赖，开放按需查询，最后约束输出。这样既能保证子 Agent 理解任务，又能避免全量上下文累积造成的 Token 膨胀和注意力干扰。' },
                            { id: 'gh-3-2', title: '关于并行修改', content: '这里主要是约束并行执行的subagent不能同时修改一个文件，首先是他们一般是生成产物，而不是去修改上游产物，所以正常不会出现同时修改一个文件的情况。<br><br>然后我也去考路过使用brach+workTree针对每一个并行分支创建一个版本，但是一方是我觉得有一点复杂，如果有冲突还需要手动解决，另一方面是我看其他的CodingAgent也没有使用，所以我就放弃了。' }
                        ]},
                    { id: 'gh-4', title: 'Plan 架构与能力优化', content: '', hasChildren: true, children: [
                            { id: 'gh-4-0', title: '为什么拆成两阶段 Plan？', content: '这个改造不是一开始就设计好的，而是随着 Plan Agent 职责增加逐步演化出来的。<br><br>早期 Plan Agent 只需要生成任务流程，输出内容比较简单，DAG 构建正确率较高。后来我们增加了工具选择、节点输入输出、数据映射、执行约束等能力，单次生成的目标变得过多，<strong>plan的质量出现明显下降。</strong><br><br><strong>因此我们设计了两阶段 Plan</strong>：<br><br>● 第一阶段：流程规划。只生成任务节点、节点职责和依赖关系，优先保证任务覆盖、拆解粒度和 DAG 拓扑合理。用户也可以在这一阶段调整节点粒度和流程方向。<br>● 第二阶段：执行配置。在确认后的 DAG 上，为每个节点补充 Agent、Tools、输入输出 Schema、数据映射和验收条件，使其成为可以直接执行的图。<br><br>所以本质上，这是把一个复杂的联合生成问题，拆成“先确定做什么，再确定怎么执行”两个约束更明确的问题。改造后，DAG 构建正确率恢复并提升到了 97%。' },
                            { id: 'gh-4-1', title: 'plan流程=两级规划+校验', content: '我们的 Plan 采用两阶段设计，核心思路是：先确定做什么，再确定怎么执行，并在每个阶段完成对应校验。<br><br>第一阶段是流程规划。<strong>先是由</strong>Plan Agent 根据用户目标完成任务拆解，生成节点职责、依赖关系和并行结构。<strong>再是由</strong>此时系统先通过图算法校验 DAG 是否无环、连通、依赖合法，再由 Review Agent 检查任务覆盖、拆解粒度和流程逻辑。校验通过后展示给用户调整，确认后冻结流程拓扑。<br><br>第二阶段是执行配置。<strong>先是由</strong>Plan Agent 在已确认的 DAG 上，为各节点补充执行 Agent、Tools、输入来源、输出 Schema、数据映射和验收条件。<strong>再是由</strong>随后通过 JSON Schema 和执行契约校验，检查格式、工具参数及上下游数据是否匹配；Review Agent 再评估节点任务与执行配置是否一致。<br><br>全部通过后，才交给引擎执行。整体流程是：<br><br>需求输入 → 流程规划 → 拓扑与语义校验 → 用户校准 → 执行配置 → 格式与契约校验 → 可执行 DAG<br><br>这样能让错误在产生阶段就被发现，避免错误流程进入配置阶段。' },
                            { id: 'gh-4-2', title: '后置校验具体校验什么？DAG正确的标准是什么？', content: '我们将后置校验分为四层，而且每层使用的工具不同。<strong>总体原则是：能用确定性代码校验的，就不交给模型。</strong><br><br>1. <strong>格式校验：</strong>使用 JSON Schema Validator，检查 JSON 是否可解析、字段是否完整、类型是否正确，确保结果能被引擎和前端消费。<br>2. <strong>图结构校验：</strong>使用确定性图算法检查环、非法节点引用、不可达节点以及异常起止节点，保证 DAG 拓扑合法。<br>3. <strong>执行契约校验：</strong>通过规则程序检查 Tool 是否存在、参数是否符合 Schema，以及节点输入能否由用户输入或上游输出提供，保证图能够实际运行。<br>4. <strong>语义逻辑校验</strong>：这部分难以通过代码约束，因此由独立 Review Agent 对照原始需求，从任务覆盖、拆解粒度、依赖关系和工具匹配四个维度进行评审。<br><br>前面三层发现问题会直接阻断执行；语义层输出结构化问题和修改建议，必要时交由用户确认。这样既利用代码保证确定性，也只让模型处理真正需要语义判断的问题。' }
                        ]},
                    { id: 'gh-5', title: '双层并行调度', content: '', hasChildren: true, children: [
                            { id: 'gh-5-0', title: '并行执行', content: '调度我用 Kahn 拓扑排序。因为节点执行是动态推进的：维护每个节点的剩余依赖数（入度），入度为 0 的进 ready queue，节点进入终态后发事件去减后继入度，减到 0 就入队。这样既能发现环，也天然支持并行和条件分支。<br><br>内层是工具级，同一节点内 ReAct 一轮模型一次产出多个互不依赖的 ToolCall，并发执行，有数据依赖的串行。<br><br>测评：200 项任务评测里端到端 wall time 比完全串行低 23%，<strong>这个数字固定了模型版本、工具延迟和并发参数，但是要注意的是这个测试数据和图的可并行宽度强相关。</strong>' },
                            { id: 'gh-5-1', title: '普通的Agent也可以并行执行任务，那我们的差距在哪里？', content: '差距在思维方式上，普通的Agent是在思考哪些任务可以并行执行，而我们的agent是只需思考任务的依赖关系，而我们的算法会根据他输出的DAG图给出并行执行方案，而这个方案就是最大程度的并行，这是规则决定的，而不是模型规划能力决定的' }
                        ]},
                    { id: 'gh-6', title: '人机交互', content: '', hasChildren: true, children: [
                            { id: 'gh-6-0', title: '系统的HITX', content: '我的项目提供了两层的人工介入，包括HITL、HITG。<br><br>HITL就是传统的，单个Agent React的过程中，遇到信息不足、准备调用高风险工具时，需要临时向人请求帮助。<br><br>HITG 则是把人工介入作为 Graph 中的一类正式任务节点，把人当做一个subagent来调用。它不是临时帮助 Agent，而是在实际场景中，会遇到一些任务是受到权限、安全等各种因素，只能由人来完成的。<br><br><strong>二者的区别主要有两点</strong>：<br><br>● HITG是预先定义好的，我清楚在这个流程中哪里需要人介入；HITL是临时的，是由Agent自己决定发起的。<br>● 第二点区别就是，HITG需要完成的任务更加复杂，只做决断。所以我在这里把这个HITG设计为了一个任务节点，把人当做SubAgent一样的调用：让系统根据任务准备好任务背景、上游产物、待决策事项和可选操作，而不是默认人了解全部上下文。人可以通过对应的输入窗口提交审批结果、产物或处理意见；将结果写回 Workflow，再推进后继节点。这个策略带来了很大的提效，因为他将我们人需要完成任务的上下文直接准备好了。' },
                            { id: 'gh-6-1', title: 'HITG/HITL：人应该扮演什么角色', content: '主要有四方面：<br><br>● 澄清：Agent 不确定用户意图，主动提问<br>● 审批：Agent 准备执行某步，等人点头<br>● 审核：Agent 产出初稿，人审核修改后再继续<br>● 接管：有的任务受限于权限、安全性需要人来完成' },
                            { id: 'gh-6-2', title: 'HITL怎么实现？', content: 'HITL 通常实现为 执行拦截、状态保存、人工回调、上下文恢复 四步。<br><br>Agent 在 ReAct 循环中准备执行高风险 ToolCall，或者遇到信息不足、低置信度时，就会拦截本轮执行，生成结构化的 <code>interrupt</code>，包含介入原因、待确认操作、工具参数、上下文摘要和期望的人类输入类型。<br><br>系统随后序列化当前 Agent 状态，以等待人工介入之后恢复，等待期间释放线程和模型资源。<br><br>人通过聊天卡片或 Web 页面提交批准、拒绝、修改或补充信息。服务端校验身份、权限、输入格式，再把人工结果作为新的 信息 加入上下文，恢复 ReAct 循环：批准就执行原 ToolCall，修改就用新参数执行，补充信息就继续推理，拒绝则终止或重新规划。' }
                        ]},
                    { id: 'gh-7', title: 'Loop与质量门禁', content: '', hasChildren: true, children: [
                            { id: 'gh-7-0', title: '你是如何实现减少人工检查的？', content: '这里主要是通过 Loop Engineering 的思想建立质量门禁。<br><br><strong>在实践中通常有两个问题</strong>：第一，完成标准不明确，Agent 不知道什么时候应该结束；第二，即使设置了标准，如果仍由执行 Agent 自己检查自己的结果，它容易受到原有思路影响，无法客观判断是否真正完成。<br><br><strong>所以我做了两件事：</strong>一是为任务定义明确的完成标准，例如必须交付哪些产物、满足哪些字段和质量要求；二是将生成和验收拆开，引入独立的 Review Agent，而不是让执行 Agent 自我审查。<br><br><strong>具体实践中</strong>，不管是 Plan 侧还是节点侧，我都采用了两层质量门禁。首先，优先使用确定性校验，通过 JSON Schema、图算法和规则程序检查能够被代码明确判断的问题，例如格式与字段类型、DAG 拓扑与执行契约，以及 Artifact 是否完整。在确定性校验通过后，再进行语义校验，由独立的 Review Agent 对照原始目标和任务完成标准，判断任务覆盖是否完整、拆解与依赖是否合理、工具是否匹配、结论是否有证据支撑，以及是否存在逻辑矛盾或内容遗漏。<br><br>审查未通过时，Review Agent 会输出结构化的问题和修改建议，由系统自动触发新的 <code>NodeAttempt</code>；只有当审查通过或者多次审查仍未通过时，才进入 HITG。这样就把大部分人工逐次验收转化成了自动质量门禁。' },
                            { id: 'gh-7-1', title: '为什么执行、审查Agent要分离？', content: '因为执行 Agent 的目标是完成任务，如果让他自己审查的话，相当于&quot;自己考自己&quot;；<br><br>而审查 Agent 不参与执行，视角独立，并且他有单独的审查Prompt，执行审查任务更专业。此外，我们还要求审查agent必须要输出不通过的原因，我们会将原因反馈给执行agent，让他进行修改。<br><br>这种&quot;执行与验收职责分离 +&quot;的组合，比让执行 Agent 自查更可靠。' }
                        ]}
                ]
            },
            concepts: {
                label: '概念',
                items: [
                    { id: 'concepts-0', title: 'Harness、Graph、Loop', content: '', hasChildren: true, children: [
                            { id: 'concepts-0-0', title: 'HarnessEngineering', content: '<strong>Harness 这个概念本质上是在回答一个问题</strong>：为什么同样一个模型，在不同的产品里表现天差地别？答案就是 Agent 等于模型加 Harness，模型提供的是智能，而 Harness 是让这份智能真正落地的系统。<br><br><strong>那harness包含哪些内容呢？</strong>你想要 Agent 能做什么，就在 Harness 里给它搭什么能力。包括文件系统让它能持久化存储、沙箱让它能安全执行代码、记忆系统让它能跨会话学习、压缩机制防止它在长任务中性能衰减。' },
                            { id: 'concepts-0-1', title: 'Loop Engineering', content: '<strong>定义是</strong>：给任务定一个准出标准，不达标就回去继续干，直到过线。<br><br><strong>Loop Engineering到底改变了什么？</strong>之前的工作模式是我写 prompt、Agent 干活、我检查结果、再写下一个 prompt，我才是那个驱动循环的人。有了 Loop Engineering 之后，我设计好目标、评估标准和工具集，然后一个循环系统自动去驱动 Agent，我只在最后看结果。<br><br>但这里有一个关键的前提，我后来才想明白——<strong>Loop Engineering 真正适用的场景</strong>，是那些停止条件可以被明确验证的任务。比如&quot;让所有测试通过&quot;或者&quot;构建成功&quot;，这些条件 Agent 自己能判断。但对于&quot;做一个好的 PPT&quot;这种任务，什么是好本身就很模糊，你还是需要在循环中介入判断。所以 Loop Engineering 解决的是重复执行的自动化，而不是判断好坏的自动化，这个边界很重要。' },
                            { id: 'concepts-0-2', title: 'Graph Engineering', content: '<strong>Graph Engineering简单的说就是，</strong>把多个Agent Loop连成显示的图，而不是把所有东西塞在一个聊天上下文里。<br><br>而他的一个比较明显的特点就是这个些AgentLoop之间，联系了起来，交给了系统自动推进。<br><br>所以他解决问题是不同任务之间的流程依赖人来推动，效率就不高，这里是交给系统来推动<br><br>但这里和我们项目所描述的状态还有一定的距离，我们再把人工介入加进去，就变成了HITG（Human in the Graph）,也就形成了我项目所描述的人和Agent的新协作方式：“系统管流程、Agent 管执行、人管关键决策”。' },
                            { id: 'concepts-0-3', title: '三者关系', content: '● Harness Engineering：给 Agent 搭一套环境，让它能更稳定地干活。<br>● Loop Engineering：给任务定一个准出标准，不达标就回去继续干，直到过线。<br>● Graph Engineering：把多个Agent Loop连成显示的图，而不是把所有东西塞在一个聊天上下文里。' }
                        ]},
                    { id: 'concepts-1', title: 'SDD', content: '', hasChildren: true, children: [
                            { id: 'concepts-1-0', title: 'SpecCoding是什么', content: '普通 Vibe Coding 是“描述需求 → 直接写代码”。这种方式适合小改动，但复杂业务里容易出问题，因为 AI 可能没有完全理解业务边界、数据来源和实现约束。<br><br>Spec Coding 多了中间层：需求分析 → 技术设计 → 任务拆解 → 编码执行。<strong>它的价值在于把模糊需求先结构化，把“怎么改”的决策前置到任务文档里。这样人可以在低成本阶段发现方向错误，而不是等 AI 写完一堆代码再返工。</strong><br><br>我的经验是，Spec Coding 的核心是让 AI 和人先对齐三件事：<br><br>1. 需求到底是什么；<br>2. 技术上应该改哪里；<br>3. 什么结果算完成。<br><br><strong>而在使用上</strong>我会把 Spec Coding 用在正式业务需求、影响面比较大、需要多人对齐或者容易误解的任务上；简单 bugfix 或补字段，不一定需要完整 Spec。' },
                            { id: 'concepts-1-1', title: '你的 AI Coding 流程是什么？', content: '我会采用“<strong>规划驱动 + 测试驱动</strong>”的方式。<br><br>核心思路是：<strong>先把要什么说清楚，再把怎么验收定义清楚，最后再让 AI 执行。</strong><br><br>AI 现在写代码的能力很强，但它的弱点通常不是“写不出代码”，而是“不知道你到底要什么”和“不知道什么结果算对”。所以我不会一上来就让 AI 直接写代码，而是先做三件事：<br><br>第一，明确需求和边界。把业务目标、用户路径、非功能约束、不做什么写清楚。<br><br>第二，定义验证标准。比如接口契约、单元测试、集成测试、lint、架构守护测试。让结果可验证，而不是靠人感觉“差不多”。<br><br>第三，把实现交给 AI。人不盯每一行代码，而是看它能不能通过测试和约束。<br><br>所以我的流程可以概括为：<strong>Plan → Test → Run</strong>。规划解决输入质量，测试解决输出验证，AI 负责中间执行。。' },
                            { id: 'concepts-1-2', title: '踩过的坑', content: '<strong>AI 跳过确认直接执行</strong><br><br>agent经常在我还没有确认试下方案时就直接开始执行了。这说明rules时不可靠的，还需要我们自己清楚步骤是什么，人工主导流程。<br><br><strong>没有耐心看 AI 的输出</strong><br><br>这是我自己最大的问题。不管是让 AI 出一个方案，还是看它执行完的返回，我经常扫两眼感觉差不多就点确认了，根本没有仔细看完。结果等到它跑完了才发现，原来它那个方案有问题，或者它理解错了我的意思。我的经验是：每次 AI 输出后，强迫自己从头到尾看完。不管它输出多长，方案也好、改完代码的反馈也好，别跳过。你省下来的那两分钟，后面可能要花两个小时去 debug。<br><br><strong>AI 偷摸换了方案不告诉你</strong><br><br>有时候让它实现一个方案，它写着写着发现那个方案有问题，就自己悄悄换成了另一种方案。但它不会主动告诉你它换了——你如果不仔细看它的执行输出，根本发现不了。所以必须养成习惯：每次 AI 执行完任务，仔细看它返回的内容，别跳过。不然你以为它在做 A，实际上它在做 B。<br><br><strong>我没有版本控制意识</strong><br><br>前两次尝试时没有养成&quot;修改前先 commit&quot;的习惯，导致 AI 改坏了代码后无法回退。' },
                            { id: 'concepts-1-3', title: '你对于AIcoding的理解是什么？AI Coding 效果的决定性因素是基础模型能力，其次是工具，最后才是使用方法和范式', content: 'AI Coding 效果的决定性因素是基础模型能力，其次是工具，最后才是使用方法和范式。<br><br><strong>代码仓库本身就是最大的上下文（最大的 prompt）。与其花精力写繁琐的 spec 和提示词去约束模型，不如持续优化代码质量，让模型在优质代码上产出优质代码。好代码 = 好 prompt，屎山代码 = 垃圾 prompt。</strong><br><br>约束很多是<strong>模型能力不足时的&quot;打补丁&quot;</strong>。当模型足够强，约束的边际效用递减甚至<strong>起反作用</strong>（束缚模型发挥）；真正高杠杆的是<strong>输入给模型的代码质量本身</strong>。' },
                            { id: 'concepts-1-4', title: '怎么避免 AI 生成“看起来能跑但其实错”的代码？', content: '核心是不能只看 AI 的解释，要看客观验证。<br><br>AI 有时会为了让代码跑通而绕过真实问题，比如补假数据、硬编码默认值、吞掉错误、改测试适配实现。这类代码表面能跑，但业务上是错的。<br><br>我会用几种方式避免：<br><br>1. <strong>测试先行</strong>：先定义业务行为和异常场景，再让 AI 实现；<br>2. <strong>不要让它随便改测试</strong>：失败时优先修实现，除非确认测试本身错；<br>3. <strong>跑编译、lint、单测、集成测试</strong>；<br>4. <strong>重点 Review 边界条件和错误处理</strong>；<br>5. <strong>让它输出修改说明和风险点</strong>，方便人工检查。<br><br>一句话：<strong>AI 的自信不等于正确，测试和 Review 才是正确性的来源。</strong>' }
                        ]}
                ]
            }
        };

        // ===== 状态变量 =====
        var currentQuestionId = 'hero-intro';
        var allButtons = [];
        var expandedParents = {}; // 存储展开的父节点ID

        // ===== DOM元素 =====
        var qaNav = document.getElementById('qaNav');
        var categoryTag = document.getElementById('categoryTag');
        var questionTitle = document.getElementById('questionTitle');
        var answerContent = document.getElementById('answerContent');
        var miniNav = document.getElementById('miniNav');

        // ===== 渲染导航（支持层级结构和折叠展开）=====
        function renderNav() {
            var html = '';
            allButtons = [];
            
            for (var categoryKey in qaData) {
                var category = qaData[categoryKey];
                html += '<div class="nav-section">';
                html += '<div class="section-title">' + category.label + '</div>';
                
                // 递归渲染items
                function renderItems(items, level, categoryKey, parentId) {
                    items.forEach(function(item) {
                        var activeClass = item.id === currentQuestionId ? ' active' : '';
                        var levelClass = 'level-' + level;
                        
                        // 如果是子节点且父节点未展开，则隐藏
                        var hiddenStyle = '';
                        if (level > 1 && parentId && !expandedParents[parentId]) {
                            hiddenStyle = 'display: none !important;';
                        }
                        
                        // 记录可点击按钮用于键盘导航
                        if (level === 1 || (parentId && expandedParents[parentId])) {
                            allButtons.push(item.id);
                        }
                        
                        var hasChildren = item.hasChildren && item.children && item.children.length > 0;
                        var isExpanded = expandedParents[item.id];
                        var arrowIcon = hasChildren ? (isExpanded ? '▼' : '▶') : '';
                        
                        // 渲染当前项
                        html += '<button class="nav-btn ' + levelClass + activeClass + '" data-id="' + item.id + '" data-category="' + categoryKey + '" style="' + hiddenStyle + '">';
                        if (hasChildren) {
                            html += '<span class="nav-arrow" data-toggle="' + item.id + '" style="display: inline-block; width: 16px; text-align: center; font-size: 10px; color: #94a3b8; margin-right: 4px;">' + arrowIcon + '</span>';
                        } else if (level > 1) {
                            html += '<span style="display: inline-block; width: 16px; margin-right: 4px;"></span>';
                        }
                        html += item.title;
                        html += '</button>';
                        
                        // 如果有子节点，递归渲染（缩进更深）
                        if (hasChildren) {
                            renderItems(item.children, level + 1, categoryKey, item.id);
                        }
                    });
                }
                
                // 从 level-1 开始渲染
                renderItems(category.items, 1, categoryKey, null);
                
                html += '</div>';
            }
            
            qaNav.innerHTML = html;
        }

        // ===== 查找项目数据 =====
        function findItem(items, id) {
            for (var i = 0; i < items.length; i++) {
                if (items[i].id === id) return items[i];
                if (items[i].children) {
                    var found = findItem(items[i].children, id);
                    if (found) return found;
                }
            }
            return null;
        }

        // ===== 查找父节点 =====
        function findParent(items, id, parent) {
            for (var i = 0; i < items.length; i++) {
                if (items[i].id === id) return parent || items[i];
                if (items[i].children) {
                    var found = findParent(items[i].children, id, items[i]);

                font.replaceWith.apply(font, Array.from(font.childNodes));
            });

            return template.innerHTML;
        }

        function getFullContent(item) {
                    html += '<div class="qa-body">' + item.content + '</div>';
            function renderBlock(item, level) {
                var tag = level === 0 ? 'h3' : (level === 1 ? 'h4' : 'h5');
                var cls = level > 0 ? 'qa-block child' : 'qa-block';
                html += '<div class="' + cls + '" data-id="' + item.id + '">';
                html += '<' + tag + '>' + item.title + '</' + tag + '>';
                if (item.content) {
                    html += '<div class="qa-body">' + normalizeAnswerContent(item.content) + '</div>';
                }
                html += '</div>';
                
                if (item.hasChildren && item.children) {
                    item.children.forEach(function(child) {
                        html += '<div class="qa-divider"></div>';
                        renderBlock(child, level + 1);
                    });
                }
            }
            renderBlock(item, 0);
            
            // 添加底部spacer，让最后一个问题可以滚到顶部
            html += '<div class="qa-bottom-spacer"></div>';
            
            return html;
        }

        // ===== 微型目录更新 =====
        function updateMiniNav() {
            var idx = allButtons.indexOf(currentQuestionId);
            if (idx === -1 || allButtons.length === 0) {
                miniNav.classList.remove('show');
                miniNav.innerHTML = '';
                return;
            }
            
            var range = 2; // 当前项上下各显示 2 个，共 5 项
            var html = '';
            
            // 前面的省略号
            if (idx - range > 0) {
                html += '<div class="mini-nav-item ellipsis">···</div>';
            }
            
            // 当前项上面的项（上面的先显示，所以 i 从大到小）
            for (var i = Math.max(0, idx - range); i < idx; i++) {
                var item = findItemById(allButtons[i]);
                if (item) {
                    html += '<div class="mini-nav-item dim" data-id="' + item.id + '">' + item.title + '</div>';
                }
            }
            
            // 当前项
            var currentItem = findItemById(allButtons[idx]);
            if (currentItem) {
                html += '<div class="mini-nav-item active" data-id="' + currentItem.id + '">' + currentItem.title + '</div>';
            }
            
            // 当前项下面的项
            for (var i = idx + 1; i <= Math.min(allButtons.length - 1, idx + range); i++) {
                var item = findItemById(allButtons[i]);
                if (item) {
                    html += '<div class="mini-nav-item dim" data-id="' + item.id + '">' + item.title + '</div>';
                }
            }
            
            // 后面的省略号
            if (idx + range < allButtons.length - 1) {
                html += '<div class="mini-nav-item ellipsis">···</div>';
            }
            
            miniNav.innerHTML = html;
            miniNav.classList.add('show');
        }

        // 微型目录点击导航
        miniNav.addEventListener('click', function(e) {
            var target = e.target.closest('.mini-nav-item');
            if (!target || !target.dataset.id || target.classList.contains('ellipsis')) return;
            
            var id = target.dataset.id;
            var categoryKey = null;
            
            for (var ck in qaData) {
                if (findParent(qaData[ck].items, id)) {
                    categoryKey = ck;
                    break;
                }
            }
            
            if (categoryKey) {
                var item = findItem(qaData[categoryKey].items, id);
                if (item) {
                    showAnswer(item, categoryKey, id);
                }
            }
        });

        // ===== 显示答案（展开整个父节点） =====
        function showAnswer(item, categoryKey, scrollToId) {
            if (!item) return;
            
            // 清除待处理的滚动同步，防止快速切换时导航闪烁
            clearTimeout(scrollTimeout);
            
            isScrolling = true;
            
            var parentItem = findParent(qaData[categoryKey].items, item.id);
            currentQuestionId = scrollToId || item.id;
            
            var needRerender = false;
            
            // 先清除所有展开状态，只展开当前选中项的父节点
            var parentToExpand = null;
            if (item.hasChildren && item.children && item.children.length > 0) {
                parentToExpand = item;
            } else {
                parentToExpand = findParent(qaData[categoryKey].items, item.id);
            }
            
            // 清除所有已有的展开状态
            for (var key in expandedParents) {
                if (expandedParents.hasOwnProperty(key)) {
                    delete expandedParents[key];
                    needRerender = true;
                }
            }
            
            // 展开当前父节点
            if (parentToExpand && parentToExpand.hasChildren && parentToExpand.children && parentToExpand.children.length > 0) {
                expandedParents[parentToExpand.id] = true;
                needRerender = true;
            }
            
            if (needRerender) renderNav();
            
            var category = qaData[categoryKey];
            categoryTag.textContent = category.label;
            
            questionTitle.style.display = 'none';
            
            answerContent.innerHTML = getFullContent(parentItem);

            var btns = qaNav.querySelectorAll('.nav-btn');
            btns.forEach(function(btn) {
                btn.classList.remove('active');
            });
            
            var activeId = scrollToId || parentItem.id;
            var targetBtn = qaNav.querySelector('[data-id="' + activeId + '"]');
            if (targetBtn) {
                targetBtn.classList.add('active');
            }

            setTimeout(function() {
                var contentArea = document.querySelector('.qa-content');
                if (scrollToId && scrollToId !== parentItem.id) {
                    var targetBlock = answerContent.querySelector('[data-id="' + scrollToId + '"]');
                    if (targetBlock) {
                        contentArea.scrollTo({ top: targetBlock.offsetTop - 20, behavior: 'instant' });
                    }
                } else {
                    contentArea.scrollTo({ top: 0, behavior: 'instant' });
                }
                
                setTimeout(function() {
                    isScrolling = false;
                }, 500);
            }, 50);
            
            updateMiniNav();
        }

        // ===== 项目详情面板 =====
        var projectPanel = document.getElementById('projectPanel');
        var projectPanelIframe = document.getElementById('projectPanelIframe');
        var projectPanelTitle = document.getElementById('projectPanelTitle');
        var projectPanelClose = document.getElementById('projectPanelClose');
        var isProjectPanelOpen = false;

        function openProjectPanel(item) {
            if (!item || !item.projectSection) return;
            
            projectPanelIframe.src = item.projectSection;
            projectPanelTitle.textContent = item.title + ' - 项目详情';
            projectPanel.classList.add('open');
            isProjectPanelOpen = true;
        }

        function closeProjectPanel() {
            projectPanel.classList.remove('open');
            isProjectPanelOpen = false;
        }

        function toggleProjectPanel() {
            if (isProjectPanelOpen) {
                closeProjectPanel();
            } else {
                var item = findItemById(currentQuestionId);
                if (item && item.projectSection) {
                    openProjectPanel(item);
                }
            }
        }

        function findItemById(id) {
            for (var ck in qaData) {
                var item = findItem(qaData[ck].items, id);
                if (item) return item;
            }
            return null;
        }

        projectPanelClose.addEventListener('click', closeProjectPanel);

        // ===== 键盘导航 =====
        function handleKeyDown(e) {
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                toggleProjectPanel();
                return;
            }
            
            if (e.key === 'ArrowRight') {
                e.preventDefault();
                
                // 切换到下一个项目分类
                var categoryOrder = ['hero', 'rag', 'workflow', 'concepts'];
                var currentCategory = null;
                for (var ck in qaData) {
                    var found = findParent(qaData[ck].items, currentQuestionId);
                    if (found) { currentCategory = ck; break; }
                }
                
                if (currentCategory) {
                    var currentIdx = categoryOrder.indexOf(currentCategory);
                    var nextIdx = (currentIdx + 1) % categoryOrder.length;
                    var nextCategory = categoryOrder[nextIdx];
                    var firstItem = qaData[nextCategory].items[0];
                    if (firstItem) {
                        if (isProjectPanelOpen) {
                            closeProjectPanel();
                        }
                        showAnswer(firstItem, nextCategory, firstItem.id);
                    }
                }
                return;
            }
            
            if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                e.preventDefault();
                
                lastKeyboardNav = Date.now();
                isScrolling = true;
                
                var currentIndex = allButtons.indexOf(currentQuestionId);
                var newIndex;
                
                if (e.key === 'ArrowDown') {
                    newIndex = (currentIndex + 1) % allButtons.length;
                } else {
                    newIndex = (currentIndex - 1 + allButtons.length) % allButtons.length;
                }
                
                var newId = allButtons[newIndex];
                var oldId = currentQuestionId;
                
                var oldParent = null;
                var newParent = null;
                var categoryKey = null;
                
                for (var ck in qaData) {
                    var op = findParent(qaData[ck].items, oldId);
                    var np = findParent(qaData[ck].items, newId);
                    if (op) oldParent = op;
                    if (np) { newParent = np; categoryKey = ck; }
                }
                
                if (oldParent && newParent && oldParent.id === newParent.id) {
                    currentQuestionId = newId;
                    
                    var btns = qaNav.querySelectorAll('.nav-btn');
                    btns.forEach(function(btn) {
                        btn.classList.remove('active');
                    });
                    
                    var targetBtn = qaNav.querySelector('[data-id="' + newId + '"]');
                    if (targetBtn) {
                        targetBtn.classList.add('active');
                    }
                    
                    var targetBlock = answerContent.querySelector('[data-id="' + newId + '"]');
                    if (targetBlock) {
                        document.querySelector('.qa-content').scrollTo({ 
                            top: targetBlock.offsetTop - 20, 
                            behavior: 'instant' 
                        });
                    }
                    
                    var btn = qaNav.querySelector('[data-id="' + newId + '"]');
                    if (btn) {
                        btn.scrollIntoView({ behavior: 'instant', block: 'center' });
                    }
                    
                    if (isProjectPanelOpen) {
                        var newItem = findItemById(newId);
                        if (newItem && newItem.projectSection) {
                            openProjectPanel(newItem);
                        } else {
                            closeProjectPanel();
                        }
                    }
                    
                    updateMiniNav();
                    
                    setTimeout(function() {
                        isScrolling = false;
                    }, 500);
                } else {
                    var item = findItem(qaData[categoryKey].items, newId);
                    if (item) {
                        showAnswer(item, categoryKey, newId);
                        
                        var btn = qaNav.querySelector('[data-id="' + newId + '"]');
                        if (btn) {
                            btn.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                        
                        if (isProjectPanelOpen) {
                            if (item && item.projectSection) {
                                openProjectPanel(item);
                            } else {
                                closeProjectPanel();
                            }
                        }
                    }
                }
            }
        }

        // ===== 事件监听 =====
        
        // 导航点击
        qaNav.addEventListener('click', function(e) {
            var btn = e.target.closest('.nav-btn');
            if (btn && btn.dataset.id) {
                var id = btn.dataset.id;
                var categoryKey = btn.dataset.category;
                
                var item = findItem(qaData[categoryKey].items, id);
                
                if (item) {
                    showAnswer(item, categoryKey, id);
                    
                    var newBtn = qaNav.querySelector('[data-id="' + id + '"]');
                    if (newBtn) {
                        newBtn.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                    
                    if (isProjectPanelOpen) {
                        if (item && item.projectSection) {
                            openProjectPanel(item);
                        } else {
                            closeProjectPanel();
                        }
                    }
                }
            }
        });

        // 键盘导航（绑定到整个文档）
        document.addEventListener('keydown', handleKeyDown);

        // ===== 滚动同步：内容滚动时左侧目录对应高亮 =====
        var isScrolling = false;
        var scrollTimeout = null;
        var lastKeyboardNav = 0;

        function handleContentScroll() {
            if (isScrolling) return;
            // 最近有键盘导航则跳过（600ms内）
            if (Date.now() - lastKeyboardNav < 600) return;
            
            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(function() {
                var contentArea = document.querySelector('.qa-content');
                var blocks = answerContent.querySelectorAll('.qa-block');
                var scrollTop = contentArea.scrollTop;
                var contentHeight = contentArea.clientHeight;
                
                var currentId = null;
                var currentTop = -Infinity;
                
                blocks.forEach(function(block) {
                    var blockTop = block.offsetTop;
                    var blockBottom = blockTop + block.offsetHeight;
                    
                    if (blockTop <= scrollTop + 50 && blockTop > currentTop) {
                        currentTop = blockTop;
                        currentId = block.dataset.id;
                    }
                });
                
                if (!currentId && blocks.length > 0) {
                    currentId = blocks[0].dataset.id;
                }
                
                if (currentId && currentId !== currentQuestionId) {
                    currentQuestionId = currentId;
                    
                    var btns = qaNav.querySelectorAll('.nav-btn');
                    btns.forEach(function(btn) {
                        btn.classList.remove('active');
                    });
                    
                    var targetBtn = qaNav.querySelector('[data-id="' + currentId + '"]');
                    if (targetBtn) {
                        targetBtn.classList.add('active');
                    }
                    
                    updateMiniNav();
                }
            }, 50);
        }

        // ===== 初始化 =====
        renderNav();
        // 默认展示 hero 分类第一个 item（自我介绍）
        var firstCategory = Object.keys(qaData)[0];
        showAnswer(qaData[firstCategory].items[0], firstCategory);
        
        var contentArea = document.querySelector('.qa-content');
        if (contentArea) {
            contentArea.addEventListener('scroll', handleContentScroll);
        }
    </script>
